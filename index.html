<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVIRAL ULTRA SYSTEM</title>

<style>
body{margin:0;font-family:sans-serif;background:#f4f7fb}
.wrap{max-width:1100px;margin:auto;padding:20px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 10px 25px rgba(0,0,0,0.05)}
h2{margin-bottom:10px}
input,select,textarea{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:1px solid #ddd}
button{width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,#4f6dff,#7ed6ff);color:#fff;font-weight:bold;margin-top:10px}
.tag{display:inline-block;padding:6px 10px;border-radius:20px;background:#eef3ff;margin:4px;font-size:12px}
.flex{display:flex;gap:10px}
.col{flex:1}
</style>
</head>

<body>
<div class="wrap">

<!-- 고객 -->
<div class="card">
<h2>고객 견적 / 결제</h2>
<input id="cname" placeholder="고객명">
<input id="cphone" placeholder="연락처">
<select id="cservice">
<option>홈페이지 제작</option>
<option>블로그 운영</option>
<option>광고 운영</option>
</select>
<textarea id="ccontent" placeholder="요청 내용"></textarea>

<label><input type="checkbox" id="agree"> 약관 전체동의</label>

<button onclick="request()">견적 요청</button>
</div>

<!-- 라인 -->
<div class="card">
<h2>라인 ONE - A (시안)</h2>

<input id="rid" placeholder="Request ID">
<select id="step">
<option value="design">디자인</option>
<option value="marketing">마케팅</option>
<option value="dev">개발</option>
</select>

<input type="file" id="file">
<input id="usb" placeholder="USB NO (UNIT-01)">

<button onclick="upload()">업로드</button>
<button onclick="receive()">수령 확인</button>

</div>

<!-- 결제 -->
<div class="card">
<h2>결제 처리 (경영지원)</h2>

<input id="payRid" placeholder="Request ID">
<select id="payType">
<option value="예약금">예약금</option>
<option value="잔금">잔금</option>
</select>
<select id="payMethod">
<option>계좌이체</option>
<option>현금</option>
<option>카드</option>
</select>

<button onclick="pay()">결제 등록</button>

</div>

<!-- PO -->
<div class="card">
<h2>PO 적재</h2>
<input id="poRid" placeholder="Request ID">
<button onclick="toPO()">PO 적재</button>
</div>

<!-- 상태 -->
<div class="card">
<h2>전체 상태</h2>
<div id="list"></div>
</div>

</div>

<script>

let DB = JSON.parse(localStorage.getItem("HV_DB")||"[]");

function save(){
localStorage.setItem("HV_DB",JSON.stringify(DB));
}

function id(){
return "RID-"+Date.now();
}

function request(){
if(!document.getElementById("agree").checked){
alert("약관 동의 필요");
return;
}

let rid=id();

DB.push({
rid:rid,
type:"customer",
name:cname.value,
service:cservice.value,
status:"접수"
});

save();
render();

alert("요청 완료: "+rid);
}

function upload(){

let rid=document.getElementById("rid").value;
let step=document.getElementById("step").value;
let usb=document.getElementById("usb").value;

if(!rid)return alert("RID 필요");

DB.push({
rid:rid,
type:"work",
step:step,
usb:usb,
status:"진행중",
time:new Date().toLocaleString()
});

save();
render();
}

function receive(){

let rid=document.getElementById("rid").value;
let step=document.getElementById("step").value;

let map={marketing:"design",dev:"marketing"};

let prev=map[step];

if(!prev){
alert("디자인은 수령 없음");
return;
}

let prevItem=DB.find(x=>x.rid==rid && x.step==prev);

if(!prevItem){
alert("이전단계 없음");
return;
}

// 핵심 자동 처리
prevItem.status="제출완료";

DB.push({
rid:rid,
type:"work",
step:step,
status:"작업시작"
});

save();
render();
}

function pay(){

let rid=document.getElementById("payRid").value;

DB.push({
rid:rid,
type:"pay",
payType:payType.value,
method:payMethod.value,
status:"확인대기"
});

save();
render();
}

function toPO(){

let rid=document.getElementById("poRid").value;

DB.push({
rid:rid,
type:"po",
status:"PO적재"
});

save();
render();
}

function render(){

let html="";

DB.forEach(x=>{
html+=`<div class="tag">${x.rid} | ${x.type} | ${x.step||""} | ${x.status}</div>`;
});

document.getElementById("list").innerHTML=html;
}

render();

</script>

</body>
</html>
