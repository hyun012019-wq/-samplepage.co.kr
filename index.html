
<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HVIRAL ERP·CRM INDEX SIM</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:#f4f6fb;color:#202633;min-height:100vh}
header{height:72px;background:#fff;border-bottom:1px solid #e5e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:10}
.menuBtn{border:0;background:#06142f;color:white;border-radius:18px;padding:14px 18px;font-size:24px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}
#overlay.show{display:block}
nav{position:fixed;top:0;left:-300px;width:290px;height:100vh;background:#111c36;padding:14px;z-index:30;transition:.25s;overflow:auto}
nav.open{left:0}
nav button{width:100%;padding:13px;margin:4px 0;border:0;border-radius:13px;background:#263a60;color:#fff;text-align:left}
main{padding:18px}
.card{background:white;border-radius:26px;padding:22px;margin:0 auto 18px;max-width:1120px;box-shadow:0 12px 28px rgba(20,30,60,.08)}
.narrow{max-width:760px}
input,select,textarea{width:100%;padding:15px;border:1px solid #dce2ee;border-radius:17px;margin-bottom:10px;font-size:15px;background:#fff}
textarea{min-height:90px}
button.primary{width:100%;padding:16px;border:0;border-radius:18px;background:#4f6dff;color:#fff;font-weight:800;font-size:16px;margin:7px 0}
button.red{padding:10px 13px;border:0;border-radius:13px;background:#ef4444;color:#fff}
button.ghost{padding:9px 11px;border:1px solid #dbe2ef;border-radius:12px;background:#fff;margin:3px}
.small{font-size:12px;color:#687386;line-height:1.6}
.flow{display:flex;gap:7px;flex-wrap:wrap}
.flow span{background:#edf1f7;border-radius:999px;padding:8px 12px;font-size:12px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi .card{margin:0}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf1f7;font-size:12px}
.ok{background:#dff7e8}.warn{background:#fff2c7}.bad{background:#ffe0e0}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid #e8ecf3;padding:8px;text-align:left;white-space:nowrap}
th{background:#f0f3fa}
.contract-paper{background:white;border:1px solid #ddd;border-radius:18px;padding:24px;max-width:850px;margin:auto;line-height:1.8}
.signbox{border:1px dashed #aaa;border-radius:12px;background:#fafafa;width:100%;height:160px;touch-action:none}
@media(max-width:768px){
header{height:64px}
.kpi{grid-template-columns:1fr}
.card{border-radius:22px;padding:18px}
table,thead,tbody,tr,th,td{display:block;width:100%}
thead{display:none}
tr{border:1px solid #e8ecf3;border-radius:14px;margin-bottom:12px;padding:10px}
td{display:flex;justify-content:space-between;white-space:normal;border:0}
td:before{content:attr(data-label);font-weight:700;color:#687386}
}
@media print{header,nav,#overlay,.no-print{display:none!important}main{padding:0}.card{box-shadow:none}.contract-paper{border:0}}
</style>
</head>
<body>
<div id="overlay" onclick="toggleMenu()"></div>
<nav id="nav"></nav>
<header>
  <button class="menuBtn" onclick="toggleMenu()">☰</button>
  <b>HVIRAL ERP·CRM INDEX SIM</b>
  <div id="userBox"></div>
</header>
<main id="root"></main>

<script>
const PW="9898";
const KEY="HVIRAL_FULL_INDEX_OUT_IN_SIM_V2";
const SESSION="HVIRAL_SIM_SESSION";

let unlocked=sessionStorage.getItem(SESSION)==="1";
let user=null, view="dash", signPad=null;

let db=JSON.parse(localStorage.getItem(KEY)||"null")||{
  boundDB:[], callA:[], callB:[], callC:[], callD:[], callE:[],
  consent:[], token:[], execution1:[], po:[], transfer:[],
  sales:[], hq:[], contract:[], finance:[], audit:[], executive:[], execution2:[],
  inbound:[], planning:[], notifications:[], logs:[]
};

const now=()=>new Date().toLocaleString("ko-KR");
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const v=id=>document.getElementById(id)?.value?.trim()||"";
const seq=p=>`${p}-${new Date().getFullYear()}-${String(Date.now()).slice(-6)}`;
const same=(r,id)=>r.rid===id||r.inid===id||r.token===id||r.unit===id;

function log(type,msg,id=""){
  db.logs.unshift({time:now(),user:user?.name||"비로그인",role:user?.role||"",type,msg,id,page:view,device:navigator.userAgent});
  save();
}
function notify(role,msg,id="",kind="INFO"){
  db.notifications.unshift({time:now(),role,msg,id,kind,read:"N"});
  try{new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg").play()}catch(e){}
  if(Notification.permission==="granted") new Notification("HVIRAL 알림",{body:msg});
  if(navigator.vibrate) navigator.vibrate([180,80,180]);
  log("NOTIFY",`${role} 알림: ${msg}`,id);
  save();
}
function requestNotifyPermission(){Notification?.requestPermission?.();}
function req(roles){
  if(!roles.includes(user?.role)&&user?.role!=="대표"&&user?.role!=="관리자"){
    alert("권한 없음: "+roles.join(", "));
    return false;
  }
  return true;
}
function cls(x){
  return ["완료","Y","승인","동의","예약금결제","잔금결제","PO적재","전달완료","서명완료","계약완료","콘텐츠생성"].includes(x)?"ok":
  ["대기","미연락","작성대기","검토중","본부장검토","서명대기","승인대기","작업요청"].includes(x)?"warn":
  ["N","반려","차단","거절","이슈"].includes(x)?"bad":"";
}
function badge(x){return `<span class="badge ${cls(x)}">${x||""}</span>`}
function table(rows,cols){
  return `<input placeholder="검색" onkeyup="filterRows(this)" style="max-width:340px">
  <div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td data-label="${c}">${badge(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function filterRows(i){
  let q=i.value.toLowerCase();
  i.parentElement.querySelectorAll("tbody tr").forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?"":"none");
}

function routePublic(){
  let u=new URL(location.href), q=u.searchParams.get("quote"), c=u.searchParams.get("contract"), rv=u.searchParams.get("review");
  if(q){customerQuote(q);return true}
  if(c){customerContract(c);return true}
  if(rv){customerReview(rv);return true}
  return false;
}
function toggleMenu(){nav.classList.toggle("open");overlay.classList.toggle("show")}
function go(x){view=x;toggleMenu();render()}
function render(){
  if(routePublic())return;
  if(!unlocked)return lock();
  if(!user)return login();
  drawMenu();
  userBox.innerHTML=`${user.name} · ${user.role} <button class="red" onclick="logout()">로그아웃</button>`;
  ({dash,boundDB,callA,callB,callC,callD,callE,consent,token,execution1,po,transfer,sales,hq,contract,finance,audit,executive,execution2,inbound,planning,notifications,logs}[view])();
}
function drawMenu(){
  const menus=[
    ["dash","대시보드"],["boundDB","BOUND 운영지원 DB"],["callA","콜팀 A"],["callB","콜팀 B"],["callC","콜팀 C"],["callD","콜팀 D"],["callE","콜팀 E"],["consent","동의자 승인요청"],["token","대표 토큰·승인"],["execution1","본사 실행팀 1차 시안"],["po","프로젝트오피스 PO"],["transfer","BOUND 전환전달팀"],["sales","본사 마케팅영업"],["hq","본부장 치환"],["contract","부대표 계약"],["finance","경영지원 결제확인"],["audit","감사 예외검토"],["executive","전무이사 실행통제"],["execution2","실행팀 2차 진행"],["inbound","인바운드 접수"],["planning","기획조정팀"],["notifications","알림센터"],["logs","감사 로그"]
  ];
  nav.innerHTML=menus.map(m=>`<button onclick="go('${m[0]}')">${m[1]}</button>`).join("");
}
function lock(){
  root.innerHTML=`<div class="card narrow"><h2>접근 제한</h2><input id="pw" type="password" placeholder="비밀번호 입력" autocomplete="off" onkeydown="if(event.key==='Enter')check()"><button class="primary" onclick="check()">접속</button><p class="small">승인된 인원만 접근 가능합니다.</p></div>`;
}
function check(){
  if(v("pw")===PW){
    unlocked=true;
    sessionStorage.setItem(SESSION,"1");
    log("ACCESS","접속 성공");
    render();
  }else{
    log("ACCESS_FAIL","접속 실패");
    alert("비밀번호 틀림");
  }
}
function login(){
  root.innerHTML=`<div class="card narrow"><h2>HVIRAL 로그인</h2><input id="name" value="이재현"><select id="role"><option>대표</option><option>관리자</option><option>운영지원</option><option>콜팀</option><option>전환전달팀</option><option>영업</option><option>본부장</option><option>부대표</option><option>경영지원</option><option>감사</option><option>전무이사</option><option>실행팀</option><option>PO</option><option>기획조정</option></select><button class="primary" onclick="user={name:v('name'),role:v('role')};log('LOGIN','로그인');requestNotifyPermission();render()">입장</button></div>`;
}
function logout(){
  log("LOGOUT","로그아웃");
  user=null;
  unlocked=false;
  sessionStorage.removeItem(SESSION);
  render();
}
function layout(html){root.innerHTML=html}

function metrics(){
  let callN=["callA","callB","callC","callD","callE"].reduce((a,k)=>a+db[k].length,0);
  let agree=["callA","callB","callC","callD","callE"].reduce((a,k)=>a+db[k].filter(x=>x.result==="동의").length,0);
  return {
    callN, agree, agreeRate:callN?Math.round(agree/callN*100):0,
    sales:db.sales.length, hq:db.hq.length, contract:db.contract.length,
    reserve:db.finance.filter(x=>x.payType==="예약금"&&x.status==="확인완료").length,
    balance:db.finance.filter(x=>x.payType==="잔금"&&x.status==="확인완료").length,
    noti:db.notifications.filter(x=>x.read==="N").length
  }
}
function dash(){
  let m=metrics();
  layout(`<div class="card"><h2>전체 흐름</h2><div class="flow"><span>BOUND DB</span><span>콜 A~E</span><span>동의자</span><span>대표 토큰</span><span>1차 시안</span><span>PO</span><span>전환전달</span><span>콜팀 고객발송</span><span>영업 알림</span><span>고객 예약금</span><span>경영지원/감사</span><span>본부장</span><span>부대표 계약/잔금</span><span>전무</span><span>2차 실행</span><span>최종 PO</span></div></div>
  <div class="kpi"><div class="card"><b>콜→동의율</b><h2>${m.agreeRate}%</h2></div><div class="card"><b>영업건</b><h2>${m.sales}</h2></div><div class="card"><b>계약건</b><h2>${m.contract}</h2></div><div class="card"><b>미확인 알림</b><h2>${m.noti}</h2></div></div>
  <div class="card"><button class="primary" onclick="requestNotifyPermission()">브라우저 알림/소리/진동 권한 켜기</button></div>`);
}

function boundDB(){
  layout(`<div class="card narrow"><h2>BOUND 운영지원 DB</h2><input id="biz" placeholder="업체명"><input id="phone" placeholder="연락처"><input id="industry" placeholder="업종"><input id="area" placeholder="지역"><select id="team"><option>callA</option><option>callB</option><option>callC</option><option>callD</option><option>callE</option></select><button class="primary" onclick="addBound()">타깃 등록·콜팀 배정</button></div><div class="card">${table(db.boundDB,["rid","biz","phone","industry","area","team","status"])}</div>`);
}
function addBound(){
  if(!req(["운영지원"]))return;
  let rid=seq("OUT"),team=v("team");
  let row={rid,biz:v("biz"),phone:v("phone"),industry:v("industry"),area:v("area"),team,status:"미연락"};
  db.boundDB.unshift(row);
  db[team].unshift({rid,biz:row.biz,phone:row.phone,result:"미연락",memo:""});
  log("CREATE","BOUND 타깃 등록 및 콜팀 배정",rid);
  notify("콜팀","신규 콜 배정: "+rid,rid);
  save();render();
}

function callA(){callUI("callA","콜팀 A")}
function callB(){callUI("callB","콜팀 B")}
function callC(){callUI("callC","콜팀 C")}
function callD(){callUI("callD","콜팀 D")}
function callE(){callUI("callE","콜팀 E")}
function callUI(team,title){
  layout(`<div class="card narrow"><h2>${title}</h2><input id="rid" placeholder="Request ID"><select id="result"><option>동의</option><option>거절</option><option>부재</option><option>재접촉</option><option>차단</option></select><input id="memo" placeholder="콜메모"><button class="primary" onclick="saveCall('${team}')">콜결과 저장</button></div><div class="card">${table(db[team],["rid","biz","phone","result","memo"])}</div>`);
}
function saveCall(team){
  if(!req(["콜팀"]))return;
  let rid=v("rid"),row=db[team].find(x=>x.rid===rid);
  if(!row)return alert("배정 ID 없음");
  row.result=v("result");row.memo=v("memo");
  let b=db.boundDB.find(x=>x.rid===rid);
  if(b)b.status=v("result");
  if(v("result")==="동의"&&!db.consent.some(x=>x.rid===rid)){
    db.consent.unshift({rid,biz:row.biz,team,status:"승인대기",request:"1차 시안 제작 승인요청"});
    notify("운영지원","동의자 승인요청 발생: "+rid,rid);
  }
  log("CALL","콜결과 저장",rid);
  save();render();
}

function consent(){
  layout(`<div class="card narrow"><h2>동의자 승인요청</h2><input id="rid" placeholder="Request ID"><button class="primary" onclick="requestToken()">대표 토큰 승인요청</button></div><div class="card">${table(db.consent,["rid","biz","team","status","request"])}</div>`);
}
function requestToken(){
  if(!req(["운영지원"]))return;
  let r=db.consent.find(x=>x.rid===v("rid"));
  if(!r)return alert("동의자 없음");
  r.status="대표승인요청";
  notify("대표","토큰 승인 요청: "+r.rid,r.rid);
  log("REQUEST","대표 토큰 승인요청",r.rid);
  save();render();
}

function token(){
  layout(`<div class="card narrow"><h2>대표 토큰·승인</h2><input id="rid" placeholder="Request ID 또는 IN-Request ID"><input id="customer" placeholder="고객/업체명"><input id="work" placeholder="작업내용"><select id="decision"><option>승인</option><option>반려</option><option>보류</option></select><button class="primary" onclick="issueToken()">토큰 처리</button></div><div class="card">${table(db.token,["rid","inid","token","unit","customer","work","status"])}</div>`);
}
function issueToken(){
  if(!req(["대표"]))return;
  let id=v("rid"),isIn=id.startsWith("IN-"),tk=seq("TK"),unit=seq("U"),status=v("decision");
  db.token.unshift({rid:isIn?"":id,inid:isIn?id:"",token:tk,unit,customer:v("customer"),work:v("work"),status});
  if(status==="승인"){
    db.execution1.unshift({rid:isIn?"":id,inid:isIn?id:"",token:tk,unit,type:"1차시안",status:"작업요청",file:"",po:"N"});
    notify("실행팀","1차 시안 작업요청: "+id,id);
  }
  log("TOKEN","대표 토큰 처리",id);
  save();render();
}

function execution1(){
  layout(`<div class="card narrow"><h2>본사 실행팀 1차 시안</h2><input id="rid" placeholder="Request ID 또는 IN-Request ID"><input id="file" placeholder="시안 파일/링크"><button class="primary" onclick="finishExec1()">1차 시안 완료 → PO 적재</button></div><div class="card">${table(db.execution1,["rid","inid","token","unit","type","status","file","po"])}</div>`);
}
function finishExec1(){
  if(!req(["실행팀"]))return;
  let id=v("rid"),w=db.execution1.find(x=>same(x,id));
  if(!w)return alert("작업 없음");
  w.status="완료";w.file=v("file");w.po="Y";
  let job=seq("JOB");
  db.po.unshift({rid:w.rid,inid:w.inid,job,type:"1차시안",file:v("file"),status:"PO적재"});
  db.transfer.unshift({rid:w.rid,inid:w.inid,job,file:v("file"),status:"회수대기",customLink:"",callTeam:"",callSent:"N",salesAlert:"N"});
  notify("PO","1차 시안 PO 적재: "+id,id);
  notify("전환전달팀","PO 시안 회수 필요: "+id,id);
  log("AUTO","1차 시안 완료 및 PO/전환전달 생성",id);
  save();render();
}

function po(){layout(`<div class="card"><h2>프로젝트오피스 PO</h2>${table(db.po,["rid","inid","job","type","file","status"])}</div>`)}

function transfer(){
  layout(`<div class="card narrow"><h2>BOUND 전환전달팀</h2><input id="rid" placeholder="Request ID"><input id="customLink" placeholder="고객맞춤 시안 링크"><select id="callTeam"><option>callA</option><option>callB</option><option>callC</option><option>callD</option><option>callE</option></select><button class="primary" onclick="transferToCall()">치환 완료 → 콜팀 전달 + 영업 알림</button></div><div class="card">${table(db.transfer,["rid","inid","job","file","status","customLink","callTeam","callSent","salesAlert"])}</div>`);
}
function transferToCall(){
  if(!req(["전환전달팀"]))return;
  let t=db.transfer.find(x=>x.rid===v("rid"));
  if(!t)return alert("전환전달 건 없음");
  t.customLink=v("customLink");t.callTeam=v("callTeam");t.status="전달완료";t.callSent="Y";t.salesAlert="Y";
  let callRow=db[t.callTeam].find(x=>x.rid===t.rid);
  if(callRow){callRow.result="시안링크전달대기";callRow.memo="전환전달팀 링크: "+t.customLink}
  db.sales.unshift({kind:"아웃바운드",rid:t.rid,inid:"",customer:"",kakao:"",sianLink:t.customLink,quoteLink:"",status:"시안링크공유",reserve:"",pay:"",hqSent:"N"});
  notify("콜팀","고객 발송용 시안 링크 도착: "+t.rid,t.rid);
  notify("영업","시안 링크 공유 완료, 고객 접촉 필요: "+t.rid,t.rid);
  log("TRANSFER","시안 링크 치환/콜팀전달/영업알림",t.rid);
  save();render();
}

function sales(){
  layout(`<div class="card narrow"><h2>본사 마케팅영업</h2><select id="kind"><option>아웃바운드</option><option>인바운드</option></select><input id="id" placeholder="Request ID 또는 IN-Request ID"><input id="customer" placeholder="고객 식별명"><input id="kakao" placeholder="고객 카톡ID"><button class="primary" onclick="makeQuote()">고객용 견적/예약금 링크 생성</button><button class="primary" onclick="sendHQ()">본부장 자동전달</button></div><div class="card">${table(db.sales,["kind","rid","inid","customer","kakao","sianLink","quoteLink","status","reserve","pay","hqSent"])}</div>`);
}
function makeQuote(){
  if(!req(["영업"]))return;
  let id=v("id"),isIn=id.startsWith("IN-"),link=location.origin+location.pathname+"?quote="+encodeURIComponent(id);
  let s=db.sales.find(x=>same(x,id));
  if(!s){s={kind:v("kind"),rid:isIn?"":id,inid:isIn?id:"",sianLink:""};db.sales.unshift(s)}
  Object.assign(s,{customer:v("customer"),kakao:v("kakao"),quoteLink:link,status:"고객작성대기"});
  notify("영업","고객용 링크 생성됨: "+id,id);
  log("LINK","고객용 견적/예약금 링크 생성",id);
  save();
  alert("고객에게 보낼 링크:\\n"+link);
  render();
}
function customerQuote(id){
  root.innerHTML=`<div class="card narrow"><h2>고객용 견적요청·예약금 결제</h2><input id="qname" placeholder="고객명/상호"><input id="qphone" placeholder="연락처"><textarea id="qcontent" placeholder="요청내용"></textarea><input id="qreserve" placeholder="예약금"><select id="qpay"><option>삼성페이</option><option>카드결제</option><option>계좌이체</option><option>현금</option></select><button class="primary" onclick="submitQuotePay('${id}')">예약금 결제 완료</button><p class="small">index 확인용 결제 시뮬레이션입니다.</p></div>`;
}
function submitQuotePay(id){
  let isIn=id.startsWith("IN-"),s=db.sales.find(x=>same(x,id));
  if(!s){s={kind:isIn?"인바운드":"아웃바운드",rid:isIn?"":id,inid:isIn?id:""};db.sales.unshift(s)}
  Object.assign(s,{customer:v("qname"),status:"예약금결제",reserve:v("qreserve"),pay:v("qpay"),hqSent:"Y"});
  db.finance.unshift({id:seq("PAY"),payType:"예약금",rid:isIn?"":id,inid:isIn?id:"",customer:v("qname"),amount:v("qreserve"),method:v("qpay"),status:"확인대기"});
  db.hq.unshift({kind:s.kind,rid:s.rid,inid:s.inid,customer:v("qname"),request:`연락처:${v("qphone")} / 요청:${v("qcontent")} / 예약금:${v("qreserve")} / 결제:${v("qpay")}`,internal:"치환 대기",scope:"",amount:v("qreserve"),status:"본부장검토",vpSent:"N"});
  notify("경영지원","예약금 결제 확인 필요: "+id,id);
  notify("감사","예약금 결제 건 예외 여부 확인 가능: "+id,id);
  notify("본부장","고객 견적요청서 제출: "+id,id);
  log("PAY","고객 예약금 결제/본부장 전달",id);
  save();
  alert("예약금 결제 완료");
  location.href=location.origin+location.pathname;
}
function sendHQ(){
  if(!req(["영업"]))return;
  let id=v("id"),s=db.sales.find(x=>same(x,id));
  if(!s)return alert("영업건 없음");
  if(!db.hq.some(x=>same(x,id)))db.hq.unshift({kind:s.kind,rid:s.rid,inid:s.inid,customer:s.customer,request:"영업 수동 전달",internal:"치환 대기",scope:"",amount:s.reserve,status:"본부장검토",vpSent:"N"});
  s.hqSent="Y";
  notify("본부장","영업 수동 본부장 전달: "+id,id);
  log("AUTO","영업→본부장 전달",id);
  save();render();
}

function hq(){
  layout(`<div class="card narrow"><h2>본부장 회사용 견적요청서 치환</h2><select id="kind"><option>아웃바운드</option><option>인바운드</option></select><input id="id" placeholder="Request ID 또는 IN-Request ID"><textarea id="internal" placeholder="회사용 견적요청서 치환내용"></textarea><input id="scope" placeholder="계약 범위"><input id="amount" placeholder="계약 예상금액"><button class="primary" onclick="hqToContract()">부대표 전달</button></div><div class="card">${table(db.hq,["kind","rid","inid","customer","request","internal","scope","amount","status","vpSent"])}</div>`);
}
function hqToContract(){
  if(!req(["본부장"]))return;
  let id=v("id"),h=db.hq.find(x=>same(x,id));
  if(!h)return alert("본부장 건 없음");
  h.internal=v("internal");h.scope=v("scope");h.amount=v("amount")||h.amount;h.status="부대표전달";h.vpSent="Y";
  db.contract.unshift({kind:h.kind,rid:h.rid,inid:h.inid,customer:h.customer,kakao:"",status:"계약대기",contractNo:seq("CT"),contractLink:"",scope:h.scope,amount:h.amount,balance:"",pay:"",signStatus:"서명대기"});
  notify("부대표","계약대기 건 도착: "+id,id);
  log("AUTO","본부장→부대표 계약대기",id);
  save();render();
}

function contract(){
  layout(`<div class="card narrow"><h2>부대표 계약</h2><input id="id" placeholder="Request ID 또는 IN-Request ID"><input id="amount" placeholder="최종 계약금액"><input id="balance" placeholder="잔금"><select id="pay"><option>삼성페이</option><option>카드결제</option><option>계좌이체</option><option>현금</option></select><button class="primary" onclick="issueContract()">계약서 링크 발행</button><button class="primary" onclick="balancePaid()">잔금 결제 완료</button><button class="primary" onclick="contractToExec()">전무이사 전달</button></div><div class="card">${table(db.contract,["rid","inid","customer","status","contractNo","contractLink","scope","amount","balance","pay","signStatus"])}</div>`);
}
function issueContract(){
  if(!req(["부대표"]))return;
  let id=v("id"),c=db.contract.find(x=>same(x,id));
  if(!c)return alert("계약건 없음");
  c.contractLink=location.origin+location.pathname+"?contract="+encodeURIComponent(id);
  c.amount=v("amount")||c.amount;c.balance=v("balance")||c.balance;c.pay=v("pay");c.status="계약링크발행";
  notify("영업","고객 계약서 링크 전달 필요: "+id,id);
  log("LINK","부대표 계약서 링크 발행",id);
  save();
  alert(c.contractLink);
  render();
}
function customerContract(id){
  let c=db.contract.find(x=>same(x,id))||{};
  root.innerHTML=`<main><div class="contract-paper"><h1>계약서</h1><p><b>계약번호:</b> ${c.contractNo||""}</p><p><b>ID:</b> ${id}</p><p><b>고객:</b> ${c.customer||""}</p><p><b>범위:</b> ${c.scope||""}</p><p><b>금액:</b> ${c.amount||""}</p><input id="signer" placeholder="서명자"><canvas id="signCanvas" class="signbox"></canvas><button class="ghost no-print" onclick="clearSign()">서명 지우기</button><button class="primary no-print" onclick="finishSign('${id}')">전자서명 완료</button><button class="primary no-print" onclick="window.print()">PDF 저장/인쇄</button></div></main>`;
  initCanvas();
}
function initCanvas(){
  let c=document.getElementById("signCanvas"),ctx=c.getContext("2d");
  c.width=c.offsetWidth;c.height=c.offsetHeight;ctx.lineWidth=3;ctx.lineCap="round";
  let d=false,p=e=>{let r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}};
  c.onmousedown=c.ontouchstart=e=>{d=true;let q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y);e.preventDefault()};
  c.onmousemove=c.ontouchmove=e=>{if(!d)return;let q=p(e);ctx.lineTo(q.x,q.y);ctx.stroke();e.preventDefault()};
  c.onmouseup=c.onmouseleave=c.ontouchend=()=>d=false;
  signPad=c;
}
function clearSign(){signPad.getContext("2d").clearRect(0,0,signPad.width,signPad.height)}
function finishSign(id){
  let c=db.contract.find(x=>same(x,id));
  c.signStatus="서명완료";c.status="서명완료";c.signer=v("signer");c.signedAt=now();c.signature=signPad.toDataURL("image/png");
  notify("부대표","고객 전자서명 완료: "+id,id);
  log("SIGN","고객 전자서명 완료",id);
  save();
  alert("서명 완료");
}
function balancePaid(){
  if(!req(["부대표"]))return;
  let id=v("id"),c=db.contract.find(x=>same(x,id));
  if(!c)return alert("계약건 없음");
  c.balance=v("balance");c.pay=v("pay");c.status="잔금결제";
  db.finance.unshift({id:seq("PAY"),payType:"잔금",rid:c.rid,inid:c.inid,customer:c.customer,amount:c.balance,method:c.pay,status:"확인대기"});
  notify("경영지원","잔금 결제 확인 필요: "+id,id);
  notify("감사","잔금 결제 건 예외 여부 확인 가능: "+id,id);
  log("PAY","잔금 결제 완료",id);
  save();render();
}
function contractToExec(){
  if(!req(["부대표","경영지원","감사"]))return;
  let id=v("id"),c=db.contract.find(x=>same(x,id));
  if(!c)return alert("계약건 없음");
  db.executive.unshift({rid:c.rid,inid:c.inid,contract:"계약완료",finance:"확인필요",audit:"확인필요",status:"전무대기",judge:"대기"});
  notify("전무이사","실행 승인 대기: "+id,id);
  log("AUTO","계약→전무 전달",id);
  save();render();
}

function finance(){
  layout(`<div class="card narrow"><h2>경영지원 결제확인</h2><input id="payId" placeholder="결제ID"><select id="status"><option>확인완료</option><option>이슈</option><option>확인대기</option></select><button class="primary" onclick="financeConfirm()">결제 확인 처리</button></div><div class="card">${table(db.finance,["id","payType","rid","inid","customer","amount","method","status"])}</div>`);
}
function financeConfirm(){
  if(!req(["경영지원"]))return;
  let p=db.finance.find(x=>x.id===v("payId"));
  if(!p)return alert("결제ID 없음");
  p.status=v("status");
  if(p.status==="이슈"){
    db.audit.unshift({id:seq("AUD"),rid:p.rid,inid:p.inid,type:p.payType,reason:"경영지원 결제 이슈",risk:"중",status:"검토중"});
    notify("감사","경영지원 결제 이슈 검토 필요: "+(p.rid||p.inid),p.rid||p.inid);
  }
  log("FINANCE","결제 확인 처리",p.id);
  save();render();
}
function audit(){
  layout(`<div class="card narrow"><h2>감사 예외검토</h2><input id="audId" placeholder="감사ID"><select id="status"><option>검토완료</option><option>이슈</option><option>반려</option></select><input id="memo" placeholder="검토 메모"><button class="primary" onclick="auditConfirm()">감사 처리</button></div><div class="card">${table(db.audit,["id","rid","inid","type","reason","risk","status","memo"])}</div>`);
}
function auditConfirm(){
  if(!req(["감사"]))return;
  let a=db.audit.find(x=>x.id===v("audId"));
  if(!a)return alert("감사ID 없음");
  a.status=v("status");a.memo=v("memo");
  notify("대표","감사 처리 완료: "+a.id,a.id);
  log("AUDIT","감사 검토 처리",a.id);
  save();render();
}

function executive(){
  layout(`<div class="card narrow"><h2>전무이사 실행통제</h2><input id="id" placeholder="Request ID 또는 IN-Request ID"><select id="judge"><option>승인</option><option>보류</option><option>차단</option></select><button class="primary" onclick="execApprove()">실행 승인 → 2차 실행팀 작업생성</button></div><div class="card">${table(db.executive,["rid","inid","contract","finance","audit","status","judge"])}</div>`);
}
function execApprove(){
  if(!req(["전무이사"]))return;
  let id=v("id"),e=db.executive.find(x=>same(x,id));
  if(!e)return alert("전무대기 건 없음");
  e.judge=v("judge");e.status=v("judge")==="승인"?"실행승인":"보류";
  if(v("judge")==="승인"){
    db.execution2.unshift({rid:e.rid,inid:e.inid,type:"2차진행",status:"작업요청",file:"",po:"N"});
    notify("실행팀","2차 진행 작업요청: "+id,id);
  }
  log("EXEC","전무 실행판정",id);
  save();render();
}
function execution2(){
  layout(`<div class="card narrow"><h2>실행팀 2차 진행</h2><input id="id" placeholder="Request ID 또는 IN-Request ID"><input id="file" placeholder="최종 산출물"><button class="primary" onclick="finishExec2()">완료 → 최종 PO 적재</button></div><div class="card">${table(db.execution2,["rid","inid","type","status","file","po"])}</div>`);
}
function finishExec2(){
  if(!req(["실행팀"]))return;
  let id=v("id"),w=db.execution2.find(x=>same(x,id));
  if(!w)return alert("작업 없음");
  w.status="완료";w.file=v("file");w.po="Y";
  db.po.unshift({rid:w.rid,inid:w.inid,job:seq("JOB"),type:"2차진행",file:v("file"),status:"PO적재"});
  notify("PO","최종 산출물 PO 적재: "+id,id);
  log("AUTO","2차 실행 완료 및 PO 적재",id);
  save();render();
}

function inbound(){
  layout(`<div class="card narrow"><h2>인바운드 접수</h2><input id="customer" placeholder="고객명/코드"><input id="channel" placeholder="유입경로"><input id="product" placeholder="상품/요청유형"><textarea id="summary" placeholder="요청요약"></textarea><select id="urgent"><option>보통</option><option>긴급</option><option>낮음</option></select><button class="primary" onclick="addInbound()">접수 → 기획조정 자동전달</button></div><div class="card">${table(db.inbound,["inid","customer","channel","product","summary","urgent","status"])}</div>`);
}
function addInbound(){
  if(!req(["관리자","영업","기획조정"]))return;
  let inid=seq("IN");
  db.inbound.unshift({inid,customer:v("customer"),channel:v("channel"),product:v("product"),summary:v("summary"),urgent:v("urgent"),status:"기획조정대기"});
  db.planning.unshift({inid,customer:v("customer"),product:v("product"),summary:v("summary"),route:"",status:"대기"});
  notify("기획조정","인바운드 신규 접수: "+inid,inid);
  log("INBOUND","인바운드 접수",inid);
  save();render();
}
function planning(){
  layout(`<div class="card narrow"><h2>기획조정팀</h2><input id="inid" placeholder="IN-Request ID"><select id="route"><option>영업</option><option>대표토큰</option><option>보류</option><option>제외</option></select><button class="primary" onclick="routeInbound()">분배 처리</button></div><div class="card">${table(db.planning,["inid","customer","product","summary","route","status"])}</div>`);
}
function routeInbound(){
  if(!req(["기획조정"]))return;
  let p=db.planning.find(x=>x.inid===v("inid"));
  if(!p)return alert("기획조정 건 없음");
  p.route=v("route");p.status="분배완료";
  if(p.route==="영업"){
    db.sales.unshift({kind:"인바운드",rid:"",inid:p.inid,customer:p.customer,kakao:"",sianLink:"",quoteLink:"",status:"영업대기",reserve:"",pay:"",hqSent:"N"});
    notify("영업","인바운드 영업 배정: "+p.inid,p.inid);
  }
  if(p.route==="대표토큰") notify("대표","인바운드 토큰 판단 필요: "+p.inid,p.inid);
  log("PLANNING","인바운드 분배",p.inid);
  save();render();
}

function notifications(){
  layout(`<div class="card narrow"><h2>알림센터</h2><button class="primary" onclick="requestNotifyPermission()">브라우저 알림 권한 요청</button><input id="nid" placeholder="관련 ID"><button class="primary" onclick="markRead()">관련 ID 알림 읽음처리</button></div><div class="card">${table(db.notifications,["time","role","msg","id","kind","read"])}</div>`);
}
function markRead(){
  let id=v("nid");
  db.notifications.forEach(n=>{if(n.id===id)n.read="Y"});
  log("NOTIFY","알림 읽음 처리",id);
  save();render();
}
function logs(){
  layout(`<div class="card"><h2>감사 로그</h2>${table(db.logs,["time","user","role","type","msg","id","page"])}<button class="red" onclick="if(confirm('전체 초기화?')){localStorage.removeItem(KEY);location.reload()}">전체 초기화</button></div>`);
}

render();
</script>
