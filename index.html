<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HVIRAL ERP BACKOFFICE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;font-family:Arial,'Noto Sans KR',sans-serif;color:#1e2430}
header{height:62px;background:#fff;border-bottom:1px solid #dfe5f0;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.app{display:grid;grid-template-columns:250px 1fr;height:calc(100vh - 62px)}
nav{background:#17213a;padding:12px;overflow:auto}nav button{width:100%;padding:10px;margin:4px 0;border:0;border-radius:9px;background:#263654;color:#fff;text-align:left;cursor:pointer}
nav button.on{background:#4f6dff}main{padding:18px;overflow:auto}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:9px}input,select,textarea{width:100%;padding:9px;border:1px solid #d5dceb;border-radius:8px}textarea{min-height:70px}
button.primary{background:#4f6dff;color:#fff;border:0;border-radius:9px;padding:10px 13px;cursor:pointer}.danger{background:#c0392b;color:#fff;border:0;border-radius:9px;padding:9px 12px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid #edf0f6;text-align:left;vertical-align:top}th{background:#eef2fb;position:sticky;top:0}
.badge{padding:4px 8px;border-radius:999px;font-size:11px;display:inline-block}.ok{background:#d9f7e6}.warn{background:#fff2c6}.bad{background:#ffd9d9}.small{font-size:12px;color:#68738a;line-height:1.6}
.login{max-width:420px;margin:70px auto}.search{max-width:240px;margin-bottom:10px}.flow{display:flex;gap:7px;flex-wrap:wrap}.flow span{background:#eef2fb;border-radius:999px;padding:8px 11px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const KEY="HVIRAL_ERP_FULL_INDEX_V2";
const now=()=>new Date().toLocaleString();
const id=p=>p+"-"+new Date().getFullYear()+"-"+String(Date.now()).slice(-6);
const roles=["대표","부대표","전무이사","본부장","영업","운영지원","콜팀","경영지원","감사","실행팀","PO","관리자"];
let user=null, view="dash";
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{
outDB:[],call:[],consent:[],token:[],execution:[],po:[],
inbound:[],planning:[],sales:[],hq:[],contract:[],exec:[],logs:[]
};
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const log=(type,msg,ref="")=>{db.logs.unshift({일시:now(),사용자:user?.name||"",권한:user?.role||"",구분:type,내용:msg,참조:ref});save()};
const root=document.getElementById("root");
const v=x=>document.getElementById(x)?.value||"";
function b(x){let c=["Y","승인","완료","사용중","가능","PO적재","출고완료","검증완료","계약완료"].includes(x)?"ok":["대기","보류","검토중","진행중","출고대기"].includes(x)?"warn":["N","반려","차단","이슈","거절","불가"].includes(x)?"bad":"";return `<span class="badge ${c}">${x||""}</span>`}
function table(rows,cols){return `<input class="search" placeholder="검색" onkeyup="f(this)"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${b(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table>`}
function f(el){let q=el.value.toLowerCase();el.parentElement.querySelectorAll("tbody tr").forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?"":"none")}
function add(k,o,m){db[k].unshift(o);log("CREATE",m,o["Request ID"]||o["IN-Request ID"]||o["토큰ID"]||o["유닛ID"]);save();render()}
function login(){root.innerHTML=`<div class="login card"><h2>HVIRAL ERP 로그인</h2><p class="small">INDEX 테스트용 로그인입니다. 실제 서버/DB 버전에서는 계정 DB와 세션 인증으로 교체됩니다.</p><input id="nm" placeholder="이름" value="이재현"><br><br><select id="rl">${roles.map(r=>`<option>${r}</option>`).join("")}</select><br><br><button class="primary" onclick="user={name:v('nm'),role:v('rl')};log('LOGIN','로그인');render()">입장</button></div>`}
function layout(content){let menu=[
["dash","대시보드"],["outDB","BOUND 운영지원 DB"],["call","콜팀"],["consent","동의자 작업요청"],["token","대표 토큰·승인"],
["execution","실행팀 통합"],["po","프로젝트오피스 PO"],["inbound","인바운드 접수"],["planning","기획조정팀"],
["sales","마케팅·영업"],["hq","사업본부 본부장"],["contract","부대표·경영지원·감사"],["exec","전무이사 실행통제"],["logs","감사 로그"]];
root.innerHTML=`<header><b>HVIRAL ERP·CRM BACKOFFICE</b><span>${user.name} · ${user.role} <button class="danger" onclick="user=null;render()">로그아웃</button></span></header><div class="app"><nav>${menu.map(m=>`<button class="${view==m[0]?'on':''}" onclick="view='${m[0]}';render()">${m[1]}</button>`).join("")}</nav><main>${content}</main></div>`}
function dash(){layout(`<div class="card"><h2>하비럴 전체 운영 흐름</h2><div class="flow"><span>BOUND DB</span><span>콜팀</span><span>동의자</span><span>대표 토큰</span><span>시안 실행</span><span>PO</span><span>영업</span><span>본부장</span><span>부대표</span><span>경영지원/감사</span><span>전무</span><span>진행 실행</span><span>PO</span></div><hr><div class="flow"><span>인바운드 접수</span><span>기획조정</span><span>영업</span><span>본부장</span><span>부대표</span><span>전무</span><span>실행팀</span><span>PO</span></div></div><div class="grid">${Object.keys(db).filter(k=>k!="logs").map(k=>`<div class="card"><b>${k}</b><h2>${db[k].length}</h2></div>`).join("")}</div>`)}

function outDB(){let cols=["Request ID","수집일","업체명","연락처","업종","지역","콜상태","콜담당자","배정일시","차단여부","차단사유","재접촉금지","중복기준","메모"];layout(`<div class="card"><h2>BOUND 운영지원 DB</h2><div class="grid">${cols.slice(2,6).map(c=>`<input id="${c}" placeholder="${c}">`).join("")}</div><br><button class="primary" onclick="add('outDB',{'Request ID':id('OUT'),'수집일':now(),'업체명':v('업체명'),'연락처':v('연락처'),'업종':v('업종'),'지역':v('지역'),'콜상태':'미연락','차단여부':'N','재접촉금지':'N'},'BOUND DB 등록')">등록</button></div><div class="card">${table(db.outDB,cols)}</div>`)}
function call(){let cols=["Request ID","업체명","연락처","콜담당자","연락결과","동의여부","거부사유","재연락여부","최초통화일시","콜메모","시안상태","URL링크","토큰전달여부","토큰전달일시"];layout(`<div class="card"><h2>콜팀</h2><div class="grid"><input id="rid" placeholder="Request ID"><input id="caller" placeholder="콜담당자"><select id="result"><option>연락완료</option><option>부재</option><option>거절</option></select><select id="agree"><option>Y</option><option>N</option></select><input id="reason" placeholder="거부사유"><input id="memo" placeholder="콜메모"></div><br><button class="primary" onclick="add('call',{'Request ID':v('rid'),'콜담당자':v('caller'),'연락결과':v('result'),'동의여부':v('agree'),'거부사유':v('reason'),'재연락여부':'N','최초통화일시':now(),'콜메모':v('memo'),'토큰전달여부':'N'},'콜팀 결과 입력')">저장</button></div><div class="card">${table(db.call,cols)}</div>`)}
function consent(){let cols=["Request ID","요청일자","요청번호","고객/업체명","상품/작업유형","요청내용","요청부서","요청자","콜담당자","동의확인","차단검토","재접촉금지검토","승인요청상태"];layout(`<div class="card"><h2>동의자 작업요청</h2><div class="grid"><input id="rid" placeholder="Request ID"><input id="biz" placeholder="고객/업체명"><input id="type" placeholder="상품/작업유형"><input id="work" placeholder="요청내용"><input id="user" placeholder="요청자"><input id="caller" placeholder="콜담당자"></div><br><button class="primary" onclick="add('consent',{'Request ID':v('rid'),'요청일자':now(),'요청번호':id('REQ'),'고객/업체명':v('biz'),'상품/작업유형':v('type'),'요청내용':v('work'),'요청부서':'운영지원','요청자':v('user'),'콜담당자':v('caller'),'동의확인':'Y','차단검토':'N','재접촉금지검토':'N','승인요청상태':'대기'},'동의자 작업요청')">등록</button></div><div class="card">${table(db.consent,cols)}</div>`)}
function token(){let cols=["Request ID","CEO Reference","토큰ID","요청일자","요청번호","유닛ID","유닛기준","고객/업체명","상품/작업유형","요청내용","동의확인","차단검토","재접촉금지검토","승인상태","승인일시","승인자","토큰생성일시","토큰상태","유효기한","프로젝트오피스 전달여부","전달일시","완료보고수령","토큰해제여부"];layout(`<div class="card"><h2>대표 토큰·승인</h2><div class="grid"><input id="rid" placeholder="Request ID / IN-Request ID"><input id="unit" placeholder="유닛ID"><select id="unitType"><option>고객단위</option><option>상품단위</option></select><input id="biz" placeholder="고객/업체명"><input id="work" placeholder="요청내용"><select id="ap"><option>대기</option><option>승인</option><option>반려</option><option>보류</option></select></div><br><button class="primary" onclick="let ap=v('ap');add('token',{'Request ID':v('rid'),'CEO Reference':id('CEO-REF'),'토큰ID':ap=='승인'?id('TK'):'','요청일자':now(),'요청번호':id('REQ'),'유닛ID':v('unit'),'유닛기준':v('unitType'),'고객/업체명':v('biz'),'상품/작업유형':'시안/진행','요청내용':v('work'),'동의확인':'Y','차단검토':'N','재접촉금지검토':'N','승인상태':ap,'승인일시':ap=='승인'?now():'','승인자':user.name,'토큰생성일시':ap=='승인'?now():'','토큰상태':ap=='승인'?'사용중':'대기','프로젝트오피스 전달여부':'N','토큰해제여부':'N'},'대표 토큰 승인')">기록</button></div><div class="card">${table(db.token,cols)}</div>`)}
function execution(){let cols=["Request ID","IN-Request ID","토큰ID","유닛ID","CEO Reference","파이프라인구분","작업구분","파이프라인단계","고객/업체명","상품명","요청내용","작업부서","부서팀장","작업자","입력권한구분","이전부서","현재부서","다음부서","USB 바구니함 상태","현재위치","다음위치","산출물 파일명","저장경로","완료보고","정합성","범위준수","원본저장","팀장검수","PO전달가능","PO전달여부"];layout(`<div class="card"><h2>실행팀 통합</h2><div class="grid"><input id="rid" placeholder="Request ID"><input id="inid" placeholder="IN-Request ID"><input id="tk" placeholder="토큰ID"><input id="unit" placeholder="유닛ID"><select id="type"><option>시안</option><option>진행</option><option>유지관리</option></select><select id="dept"><option>디자인팀</option><option>마케팅영업팀</option><option>Web/App개발팀</option><option>프로듀서팀</option></select><input id="worker" placeholder="작업자"><input id="file" placeholder="산출물 파일명"></div><br><button class="primary" onclick="if(!v('tk'))alert('토큰ID 없는 실행 금지');else add('execution',{'Request ID':v('rid'),'IN-Request ID':v('inid'),'토큰ID':v('tk'),'유닛ID':v('unit'),'파이프라인구분':v('type')=='시안'?'1차-시안':'2차-진행','작업구분':v('type'),'파이프라인단계':'작업요청','작업부서':v('dept'),'작업자':v('worker'),'입력권한구분':'팀장입력','현재부서':v('dept'),'USB 바구니함 상태':'작업요청','산출물 파일명':v('file'),'완료보고':'X','정합성':'X','범위준수':'X','원본저장':'X','팀장검수':'X','PO전달가능':'불가','PO전달여부':'N'},'실행팀 작업 등록')">등록</button></div><div class="card">${table(db.execution,cols)}</div>`)}
function po(){let cols=["Request ID","IN-Request ID","토큰ID","유닛ID","유입경로","작업코드","상품명","고객 식별명","작업유형","요청내용","작업지시 확인","프로젝트 담당자","상품 담당자","외주 여부","산출물 파일명","산출물 형식","링크 생성 여부","링크","완료보고 수령","정합성","범위준수","원본저장","저장경로","출고상태","출고대상","출고일시","출고자","전달방식","확인여부","AS 여부","유지관리 여부","토큰연계 여부","특이사항"];layout(`<div class="card"><h2>프로젝트오피스 PO</h2><div class="grid"><input id="rid" placeholder="Request ID"><input id="inid" placeholder="IN-Request ID"><input id="tk" placeholder="토큰ID"><input id="unit" placeholder="유닛ID"><select id="type"><option>시안</option><option>진행</option><option>유지관리</option></select><input id="file" placeholder="산출물 파일명"><input id="path" placeholder="저장경로"><select id="st"><option>PO적재</option><option>출고대기</option><option>출고완료</option><option>회수완료</option><option>보류</option><option>반려</option></select></div><br><button class="primary" onclick="add('po',{'Request ID':v('rid'),'IN-Request ID':v('inid'),'토큰ID':v('tk'),'유닛ID':v('unit'),'작업유형':v('type'),'산출물 파일명':v('file'),'저장경로':v('path'),'출고상태':v('st'),'완료보고 수령':'O','정합성':'O','범위준수':'O','원본저장':'O','토큰연계 여부':v('tk')?'Y':'N'},'PO 적재')">적재</button></div><div class="card">${table(db.po,cols)}</div>`)}
function inbound(){let cols=["IN-Request ID","인바운드 유형","유입경로","고객코드","소개자코드","연락채널","업종","상품코드","상품옵션","요청요약","긴급도","우선순위점수","기획조정 전달","기획조정 상태","분배유형","토큰요청","토큰ID","접수일시","접수자","접촉로그","비고"];layout(`<div class="card"><h2>인바운드 접수처</h2><div class="grid"><select id="tp"><option>A</option><option>B</option></select><input id="ch" placeholder="유입경로"><input id="code" placeholder="고객코드"><input id="prod" placeholder="상품코드"><input id="sum" placeholder="요청요약"><select id="urgent"><option>낮음</option><option>보통</option><option>긴급</option></select></div><br><button class="primary" onclick="add('inbound',{'IN-Request ID':id('IN'),'인바운드 유형':v('tp'),'유입경로':v('ch'),'고객코드':v('code'),'상품코드':v('prod'),'요청요약':v('sum'),'긴급도':v('urgent'),'기획조정 전달':'N','기획조정 상태':'대기','토큰요청':'N','접수일시':now(),'접수자':user.name},'인바운드 접수')">접수</button></div><div class="card">${table(db.inbound,cols)}</div>`)}
function planning(){let cols=["IN-Request ID","고객코드","업종","상품코드","상품옵션","요청요약","난이도","예상금액레벨","전환가능성","우선순위점수","판단근거","분배유형","담당팀","담당자","분배일시","처리기한","토큰요청","토큰ID","상태","기록자","로그"];layout(`<div class="card"><h2>기획조정팀</h2><div class="grid"><input id="inid" placeholder="IN-Request ID"><select id="route"><option>영업</option><option>본부장</option><option>부대표</option><option>보류</option><option>제외</option></select><input id="score" placeholder="우선순위점수"><input id="reason" placeholder="판단근거"><input id="owner" placeholder="담당자"></div><br><button class="primary" onclick="add('planning',{'IN-Request ID':v('inid'),'우선순위점수':v('score'),'판단근거':v('reason'),'분배유형':v('route'),'담당팀':v('route'),'담당자':v('owner'),'분배일시':now(),'토큰요청':'N','상태':'분배완료','기록자':user.name},'기획조정 분배')">분배</button></div><div class="card">${table(db.planning,cols)}</div>`)}
function sales(){let cols=["유입구분","Request ID","IN-Request ID","토큰ID","유닛ID","고객 식별명","고객코드","업종","주소","시안 발송 여부","최초 접촉 여부","고객 반응 상태","견적 요청 유도 여부","견적요청서 수령","착수금 결제 여부","결제 금액","결제 일시","부대표 계약 요청","본부장 전달 여부","담당 영업자","진행 상태","특이사항"];layout(`<div class="card"><h2>마케팅·영업</h2><div class="grid"><select id="kind"><option>아웃바운드</option><option>인바운드</option></select><input id="rid" placeholder="Request ID"><input id="inid" placeholder="IN-Request ID"><input id="unit" placeholder="유닛ID"><input id="cust" placeholder="고객 식별명/코드"><select id="st"><option>미접촉</option><option>상담중</option><option>견적요청</option><option>계약요청</option><option>보류</option><option>거절</option></select></div><br><button class="primary" onclick="add('sales',{'유입구분':v('kind'),'Request ID':v('rid'),'IN-Request ID':v('inid'),'유닛ID':v('unit'),'고객 식별명':v('cust'),'고객코드':v('cust'),'시안 발송 여부':'N','최초 접촉 여부':'Y','고객 반응 상태':v('st'),'견적 요청 유도 여부':'Y','견적요청서 수령':'N','착수금 결제 여부':'N','부대표 계약 요청':'N','본부장 전달 여부':'N','담당 영업자':user.name,'진행 상태':v('st')},'영업 기록')">저장</button></div><div class="card">${table(db.sales,cols)}</div>`)}
function hq(){let cols=["유입구분","Request ID","IN-Request ID","토큰ID","유닛ID","고객 식별명","고객코드","고객용 견적요청서 수령","고객 요청 원본","회사 견적요청서 치환","계약 범위 확정","제외 범위","예상 금액","특이사항","부대표 전달 여부","전달일시"];layout(`<div class="card"><h2>사업본부 본부장</h2><div class="grid"><select id="kind"><option>아웃바운드</option><option>인바운드</option></select><input id="rid" placeholder="Request ID"><input id="inid" placeholder="IN-Request ID"><input id="unit" placeholder="유닛ID"><textarea id="raw" placeholder="고객 요청 원본"></textarea><textarea id="fix" placeholder="회사 견적요청서 치환"></textarea><input id="scope" placeholder="계약 범위"><input id="exclude" placeholder="제외 범위"></div><br><button class="primary" onclick="add('hq',{'유입구분':v('kind'),'Request ID':v('rid'),'IN-Request ID':v('inid'),'유닛ID':v('unit'),'고객용 견적요청서 수령':'Y','고객 요청 원본':v('raw'),'회사 견적요청서 치환':v('fix'),'계약 범위 확정':v('scope'),'제외 범위':v('exclude'),'부대표 전달 여부':'Y','전달일시':now()},'본부장 치환')">저장</button></div><div class="card">${table(db.hq,cols)}</div>`)}
function contract(){let cols=["유입구분","IN-Request ID","Request ID","토큰ID","유닛ID","고객 식별명","고객코드","계약상태","계약일","계약서 번호","계약서 파일/경로","고객견적요청서 수령","내부견적서 확인","최종 계약금액","착수금액","입금확인","입금일시","경영지원 확인","감사 확인상태","부대표 실행승인","전무이사 전달여부","작업지시 발급여부"];layout(`<div class="card"><h2>부대표·경영지원·감사</h2><div class="grid"><select id="kind"><option>아웃바운드</option><option>인바운드</option></select><input id="rid" placeholder="Request ID"><input id="inid" placeholder="IN-Request ID"><input id="tk" placeholder="토큰ID"><input id="unit" placeholder="유닛ID"><input id="amount" placeholder="계약금액"><select id="pay"><option>Y</option><option>N</option></select><select id="audit"><option>검증완료</option><option>감사대기</option><option>이슈</option></select></div><br><button class="primary" onclick="add('contract',{'유입구분':v('kind'),'Request ID':v('rid'),'IN-Request ID':v('inid'),'토큰ID':v('tk'),'유닛ID':v('unit'),'계약상태':'계약완료','계약일':now(),'계약서 번호':id('CT'),'고객견적요청서 수령':'Y','내부견적서 확인':'Y','최종 계약금액':v('amount'),'입금확인':v('pay'),'입금일시':v('pay')=='Y'?now():'','경영지원 확인':v('pay'),'감사 확인상태':v('audit'),'부대표 실행승인':'Y','전무이사 전달여부':'Y','작업지시 발급여부':'N'},'계약/입금/감사')">저장</button></div><div class="card">${table(db.contract,cols)}</div>`)}
function exec(){let cols=["유입구분","IN-Request ID","Request ID","토큰ID","유닛ID","CEO Reference","계약상태","착수금 확인","입금확인","경영지원 확인","감사 확인상태","부대표 실행승인","전무이사 전달여부","작업지시 발급여부","실행시작 가능여부","전무이사 실행판정","코어상태","인터페이스 바구니함 상태","현재위치","다음위치","유닛 전달여부","PO 전달여부","PO 회수여부","완료보고 수령","토큰해제 요청","완료여부"];layout(`<div class="card"><h2>전무이사 실행통제</h2><div class="grid"><select id="kind"><option>아웃바운드</option><option>인바운드</option></select><input id="rid" placeholder="Request ID"><input id="inid" placeholder="IN-Request ID"><input id="tk" placeholder="토큰ID"><input id="unit" placeholder="유닛ID"><select id="judge"><option>대기</option><option>승인</option><option>보류</option><option>차단</option></select></div><br><button class="primary" onclick="if(!v('tk'))alert('토큰ID 필수');else add('exec',{'유입구분':v('kind'),'Request ID':v('rid'),'IN-Request ID':v('inid'),'토큰ID':v('tk'),'유닛ID':v('unit'),'계약상태':'계약완료','착수금 확인':'Y','입금확인':'Y','경영지원 확인':'Y','감사 확인상태':'검증완료','부대표 실행승인':'Y','전무이사 전달여부':'Y','작업지시 발급여부':v('judge')=='승인'?'Y':'N','실행시작 가능여부':v('judge')=='승인'?'가능':'불가','전무이사 실행판정':v('judge'),'코어상태':'대기','인터페이스 바구니함 상태':'작업요청','현재위치':'전무이사','다음위치':'실행팀','유닛 전달여부':'N','PO 전달여부':'N','완료보고 수령':'N','토큰해제 요청':'N','완료여부':'N'},'전무 실행통제')">판정</button></div><div class="card">${table(db.exec,cols)}</div>`)}
function logs(){layout(`<div class="card"><h2>감사 로그</h2>${table(db.logs,["일시","사용자","권한","구분","내용","참조"])}<br><button class="danger" onclick="if(confirm('전체 초기화?')){localStorage.removeItem(KEY);location.reload()}">초기화</button></div>`)}
function render(){if(!user)return login();({dash,outDB,call,consent,token,execution,po,inbound,planning,sales,hq,contract,exec,logs}[view])()}
render();
</script>
