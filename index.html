<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HVIRAL FINAL ERP</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f6f7fb}
header{height:60px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #ddd}
.menu-btn{font-size:22px;border:0;background:none}
.sidebar{position:fixed;left:-260px;top:0;width:250px;height:100%;background:#111c36;padding:10px;transition:.3s}
.sidebar.open{left:0}
.sidebar button{width:100%;padding:12px;margin:4px 0;background:#263a60;border:0;color:#fff;border-radius:10px;text-align:left}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none}
.overlay.show{display:block}
main{padding:15px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
input,select,textarea{width:100%;padding:10px;margin-bottom:8px;border:1px solid #ddd;border-radius:10px}
button.primary{width:100%;padding:12px;background:#4f6dff;color:#fff;border:0;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid #eee;padding:6px}
</style>
</head>

<body>

<header>
<button class="menu-btn" onclick="toggleMenu()">☰</button>
<b>HVIRAL ERP</b>
<div id="userBox"></div>
</header>

<div id="menu" class="sidebar"></div>
<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<main id="root"></main>

<script>

/* ===== 기본 ===== */
const PW="5858";
const KEY="HVIRAL_FINAL_ALL";
let unlocked=false,user=null,view="dash";

let db=JSON.parse(localStorage.getItem(KEY)||"null")||{
  bound:[],callA:[],callB:[],callC:[],callD:[],callE:[],
  sales:[],contract:[],reviews:[],contents:[],logs:[]
};

const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const now=()=>new Date().toLocaleString();
const seq=p=>p+"-"+Date.now();

/* ===== 로그 ===== */
function log(type,msg,id=""){
  db.logs.unshift({time:now(),user:user?.name||"",role:user?.role||"",type,msg,id});
  save();
}

/* ===== 메뉴 ===== */
const menus=[
 ["dash","대시보드"],
 ["bound","BOUND"],
 ["callA","콜A"],["callB","콜B"],["callC","콜C"],["callD","콜D"],["callE","콜E"],
 ["sales","영업"],
 ["contract","계약"],
 ["review","리뷰"],
 ["content","콘텐츠"],
 ["logs","로그"]
];

function drawMenu(){
  menu.innerHTML=menus.map(m=>`<button onclick="go('${m[0]}')">${m[1]}</button>`).join("");
}
function toggleMenu(){
  menu.classList.toggle("open");
  overlay.classList.toggle("show");
}
function go(v){view=v;toggleMenu();render();}

/* ===== 로그인 ===== */
function lock(){
  root.innerHTML=`
  <div class="card">
  <h2>접속 비밀번호</h2>
  <input id="pw" type="password">
  <button class="primary" onclick="check()">접속</button>
  </div>`;
}
function check(){
  if(document.getElementById("pw").value===PW){
    unlocked=true;render();
  }else alert("틀림");
}
function login(){
  root.innerHTML=`
  <div class="card">
  <h2>로그인</h2>
  <input id="name" placeholder="이름">
  <select id="role">
  <option>대표</option><option>영업</option><option>콜팀</option>
  </select>
  <button class="primary" onclick="doLogin()">로그인</button>
  </div>`;
}
function doLogin(){
  user={name:name.value,role:role.value};
  log("LOGIN","로그인");
  render();
}

/* ===== 대시보드 ===== */
function dash(){
  root.innerHTML=`<div class="card">
  <h2>전체 흐름</h2>
  BOUND → 콜 → 영업 → 계약 → 리뷰 → 콘텐츠
  </div>`;
}

/* ===== BOUND ===== */
function bound(){
  root.innerHTML=`
  <div class="card">
  <input id="biz" placeholder="업체명">
  <select id="team">
  <option>callA</option><option>callB</option><option>callC</option><option>callD</option><option>callE</option>
  </select>
  <button class="primary" onclick="addBound()">등록</button>
  </div>
  ${table(db.bound,["id","biz","team"])}
  `;
}
function addBound(){
  let id=seq("OUT");
  db.bound.unshift({id,biz:biz.value,team:team.value});
  db[team.value].unshift({id,biz:biz.value,result:"대기"});
  log("CREATE","BOUND 등록",id);
  save();render();
}

/* ===== 콜 ===== */
function callUI(t){
  root.innerHTML=`
  <div class="card">
  <input id="rid">
  <select id="res"><option>동의</option><option>거절</option></select>
  <button class="primary" onclick="saveCall('${t}')">저장</button>
  </div>
  ${table(db[t],["id","biz","result"])}
  `;
}
function callA(){callUI("callA")}
function callB(){callUI("callB")}
function callC(){callUI("callC")}
function callD(){callUI("callD")}
function callE(){callUI("callE")}

function saveCall(t){
  let r=db[t].find(x=>x.id===rid.value);
  if(!r)return alert("없음");
  r.result=res.value;
  log("CALL","콜결과",rid.value);
  save();render();
}

/* ===== 영업 ===== */
function sales(){
  root.innerHTML=`
  <div class="card">
  <input id="rid">
  <input id="cust">
  <button class="primary" onclick="addSale()">등록</button>
  </div>
  ${table(db.sales,["rid","cust"])}
  `;
}
function addSale(){
  db.sales.unshift({rid:rid.value,cust:cust.value});
  log("SALE","영업등록",rid.value);
  save();render();
}

/* ===== 계약 ===== */
function contract(){
  root.innerHTML=`
  <div class="card">
  <input id="rid">
  <button class="primary" onclick="addContract()">계약</button>
  </div>
  ${table(db.contract,["rid","status"])}
  `;
}
function addContract(){
  db.contract.unshift({rid:rid.value,status:"완료"});
  log("CONTRACT","계약완료",rid.value);
  save();render();
}

/* ===== 리뷰 ===== */
function review(){
  root.innerHTML=`
  <div class="card">
  <input id="rid">
  <textarea id="txt"></textarea>
  <button class="primary" onclick="addReview()">등록</button>
  </div>
  ${table(db.reviews,["rid","txt"])}
  `;
}
function addReview(){
  db.reviews.unshift({rid:rid.value,txt:txt.value});
  log("REVIEW","리뷰등록",rid.value);
  save();render();
}

/* ===== 콘텐츠 ===== */
function content(){
  root.innerHTML=`
  <div class="card">
  <input id="rid">
  <button class="primary" onclick="makeContent()">생성</button>
  </div>
  ${table(db.contents,["rid","title"])}
  `;
}
function makeContent(){
  db.contents.unshift({rid:rid.value,title:"콘텐츠-"+rid.value});
  log("CONTENT","콘텐츠생성",rid.value);
  save();render();
}

/* ===== 로그 ===== */
function logs(){
  root.innerHTML=table(db.logs,["time","user","type","msg","id"]);
}

/* ===== 공통 ===== */
function table(rows,cols){
  return `<div class="card"><table>
  <tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr>
  ${rows.map(r=>`<tr>${cols.map(c=>`<td>${r[c]||""}</td>`).join("")}</tr>`).join("")}
  </table></div>`;
}

/* ===== 렌더 ===== */
function render(){
  if(!unlocked)return lock();
  if(!user)return login();

  userBox.innerHTML=user.name;

  drawMenu();

  ({
    dash,bound,callA,callB,callC,callD,callE,
    sales,contract,review,content,logs
  }[view])();
}

render();

</script>
</body>
</html>
