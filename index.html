<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>청년보도</title>

<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans KR',sans-serif;background:#f5f5f5}
header{background:#fff;border-bottom:1px solid #ddd}
.top{max-width:1100px;margin:auto;display:flex;justify-content:space-between;padding:14px}
.logo{font-size:30px;font-weight:900}.logo span{color:#c00}
.nav{background:#111;color:#fff}
.nav div{max-width:1100px;margin:auto;display:flex;gap:15px;padding:10px;font-size:14px;overflow:auto}
.wrap{max-width:1100px;margin:auto;padding:14px}
.card{background:#fff;border:1px solid #ddd;padding:14px;margin-bottom:12px;cursor:pointer}
.card h3{margin:0 0 8px;font-size:17px}
.meta{font-size:12px;color:#777}
.article{max-width:900px;margin:auto;background:#fff;padding:20px;border:1px solid #ddd}
.body{white-space:pre-wrap;line-height:1.8}
.admin{display:none;max-width:900px;margin:auto;background:#fff;padding:20px;border:1px solid #ddd}
input,textarea,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc}
button{padding:10px;background:#111;color:#fff;border:0;cursor:pointer}
footer{background:#222;color:#ccc;padding:20px;margin-top:30px}
.pages{text-align:center;margin:20px}
.pages button{margin:2px}
.badge{display:inline-block;background:#c00;color:#fff;font-size:12px;padding:3px 6px;margin-bottom:6px}
</style>
</head>

<body>

<header>
<div class="top">
  <div class="logo" onclick="home()">청년<span>보도</span></div>
  <div>
    <button onclick="home()">홈</button>
    <button onclick="openAdmin()">관리자</button>
  </div>
</div>
<div class="nav"><div id="nav"></div></div>
</header>

<div id="app"></div>

<div class="admin" id="admin">
<h2>백오피스</h2>
<input id="pw" placeholder="비밀번호">
<button onclick="login()">로그인</button>

<div id="editor" style="display:none">
<input id="title" placeholder="제목">
<select id="cat"></select>
<select id="type">
<option>일반</option>
<option>협찬/광고</option>
</select>
<textarea id="content"></textarea>
<button onclick="save()">기사 등록</button>
</div>
</div>

<footer>
<div>
청년보도 | 발행인: 청년보도 편집부<br>
※ 본 사이트는 콘텐츠 기반 정보 제공 사이트이며 일부 콘텐츠에는 광고성 내용이 포함될 수 있습니다.<br>
※ 협찬/광고 콘텐츠는 별도로 표기됩니다.
</div>
</footer>

<script>
const cats=["전체","뉴스","리포트","보도자료","협찬/광고"];

function gen(){
 let arr=[];
 for(let i=1;i<=100;i++){
  arr.push({
   title:"청년 마케팅 현장 변화 "+i,
   cat:cats[i%cats.length],
   type:i%7==0?"협찬/광고":"일반",
   date:"2026.05."+String((i%28)+1).padStart(2,"0"),
   content:"청년 시장에서 마케팅 방식이 변화하고 있다.\n\n단순 노출보다 흐름과 연결이 중요해지는 추세다.\n\n콘텐츠 기반 접근이 늘어나고 있다."
  });
 }
 return arr;
}

function get(){
 let d=localStorage.getItem("news");
 if(!d){localStorage.setItem("news",JSON.stringify(gen()));return gen()}
 return JSON.parse(d);
}
function set(a){localStorage.setItem("news",JSON.stringify(a))}

function nav(){
 document.getElementById("nav").innerHTML=
 cats.map(c=>`<span onclick="list('${c}',1)">${c}</span>`).join("");
 document.getElementById("cat").innerHTML=
 cats.filter(c=>c!="전체").map(c=>`<option>${c}</option>`).join("");
}

function home(){list("전체",1)}

function list(c,page){
 let all=get().filter(v=>c=="전체"||v.cat==c);
 let per=10,start=(page-1)*per;
 let arr=all.slice(start,start+per);

 document.getElementById("app").innerHTML=
 `<div class="wrap">
 ${arr.map((v,i)=>`
  <div class="card" onclick="view(${start+i})">
    ${v.type=="협찬/광고"?'<div class="badge">광고</div>':''}
    <h3>${v.title}</h3>
    <div class="meta">${v.cat} | ${v.date}</div>
  </div>`).join("")}
 <div class="pages">
 ${Array.from({length:Math.ceil(all.length/per)},(_,i)=>`<button onclick="list('${c}',${i+1})">${i+1}</button>`).join("")}
 </div>
 </div>`;
}

function view(i){
 let v=get()[i];
 document.getElementById("app").innerHTML=
 `<div class="article">
 ${v.type=="협찬/광고"?'<div class="badge">협찬/광고</div>':''}
 <h1>${v.title}</h1>
 <div class="meta">${v.cat} | ${v.date}</div>
 <div class="body">${v.content}</div>
 ${v.type=="협찬/광고"?'<p style="font-size:12px;color:#777;margin-top:20px">※ 본 콘텐츠는 광고성 내용을 포함하고 있습니다.</p>':''}
 </div>`;
}

function openAdmin(){
 document.getElementById("admin").style.display="block";
 document.getElementById("app").innerHTML="";
}

function login(){
 if(pw.value=="1234")editor.style.display="block";
 else alert("비번 틀림");
}

function save(){
 let a=get();
 a.unshift({
  title:title.value,
  cat:cat.value,
  type:type.value,
  date:"2026.05.10",
  content:content.value
 });
 set(a);
 alert("등록 완료");
 home();
}

nav();
home();
</script>

</body>
</html>
