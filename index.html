iv>`)}function mapManager(exec){return{"작업시작":"작업요청","진행중":"처리중","제출완료":"제출완료","반려":"수정요청","PO 회수":"PO적재"}[exec]||exec}function lineUpdate(key){if(!req(["라인"]))return;let id=v("id"),w=db[key].find(x=>same(x,id));if(!w)return alert("라인 작업 없음");w.execView=v("next");w.managerView=mapManager(v("next"));w.usb=v("usb")||w.usb;w.file=v("file")||w.file;w.status=w.managerView;addUsb(w,key);save();render()}function addUsb(w,line){let id=w.usb||w.unit||"UNIT-"+String(db.usb.length+1).padStart(2,"0");w.usb=id;let u=db.usb.find(x=>x.usb===id&&x.rid===(w.rid||w.inid));if(!u)db.usb.unshift({usb:id,rid:w.rid,inid:w.inid,line,service:w.service,execView:w.execView,managerView:w.managerView,file:w.file,status:w.managerView});else{u.execView=w.execView;u.managerView=w.managerView;u.file=w.file;u.status=w.managerView}}function poDuplicate(row){return db.po.some(x=>(x.rid===row.rid&&x.inid===row.inid&&x.type===row.type&&x.file===row.file))}function lineToPO(key){if(!req(["라인"]))return;let id=v("id"),w=db[key].find(x=>same(x,id));if(!w)return alert("라인 작업 없음");if(w.po==="Y")return alert("이미 처리되었습니다.");w.execView="PO 회수";w.managerView="PO적재";w.status="PO적재";w.usb=v("usb")||w.usb;w.file=v("file")||w.file;let poRow={rid:w.rid,inid:w.inid,job:seq("JOB"),type:key==="lineA"?"라인 ONE - A":"라인 TWO - B",service:w.service,serviceCode:w.serviceCode,taxText:w.taxText,usb:w.usb,file:w.file,status:"PO적재"};if(poDuplicate(poRow))return alert("이미 처리되었습니다.");w.po="Y";db.po.unshift(poRow);db.transfer.unshift({rid:w.rid,inid:w.inid,job:poRow.job,file:w.file,status:"회수대기",customLink:"",callTeam:"",callSent:"N",salesAlert:"N"});addUsb(w,key);notify("PO","라인 산출물 PO 적재: "+id,id);notify("전환전달팀","PO 산출물 회수 필요: "+id,id);save();render()}
function usbInterface(){let mode=user?.role==="라인"?"exec":"manager",statuses=mode==="exec"?["작업시작","진행중","제출완료","반려","PO 회수"]:["작업요청","처리중","제출완료","수정요청","PO적재"];layout(`<div class="card"><h2>인터페이스 USB 캐리어</h2><div class="flow"><span>실행 라인: 작업시작 · 진행중 · 제출완료 · 반려 · PO 회수</span><span>관리 방향: 작업요청 · 처리중 · 제출완료 · 수정요청 · PO적재</span></div></div><div class="card"><div class="usb-grid">${statuses.map(s=>`<div class="usb-col"><b>${s}</b>${db.usb.filter(u=>(mode==="exec"?u.execView:u.managerView)===s).map(u=>`<div class="usb-card"><b>${u.usb}</b><br>${u.rid||u.inid}<br>${u.line}<br>${u.service||""}<br>${badge(mode==="exec"?u.execView:u.managerView)}<br><span class="small">${u.file||""}</span></div>`).join("")}</div>`).join("")}</div></div>`)}function po(){layout(`<div class="card"><h2>프로젝트오피스 PO</h2>${table(db.po,["rid","inid","job","type","service","serviceCode","taxText","usb","file","status"])}</div>`)}
function transfer(){layout(`<div class="card narrow"><h2>BOUND 전환전달팀</h2><input id="rid" placeholder="Request ID"><input id="customLink" placeholder="고객맞춤 시안 링크"><select id="callTeam"><option>callA</option><option>callB</option><option>callC</option><option>callD</option><option>callE</option></select><button class="primary" onclick="transferToCall()">치환 완료 → 콜팀 전달 + 영업 알림</button></div><div class="card">${table(db.transfer,["rid","inid","job","file","status","customLink","callTeam","callSent","salesAlert"])}</div>`)}function transferToCall(){if(!req(["전환전달팀"]))return;let t=db.transfer.find(x=>x.rid===v("rid"));if(!t)return alert("전환전달 건 없음");if(t.status==="전달완료")return alert("이미 처리되었습니다.");t.customLink=v("customLink");t.callTeam=v("callTeam");t.status="전달완료";t.callSent="Y";t.salesAlert="Y";let callRow=db[t.callTeam].find(x=>x.rid===t.rid);if(callRow){callRow.result="시안링크전달대기";callRow.memo="전환전달팀 링크: "+t.customLink}if(!db.sales.some(x=>x.rid===t.rid&&x.status==="시안링크공유"))db.sales.unshift({kind:"아웃바운드",rid:t.rid,inid:"",customer:"",kakao:"",sianLink:t.customLink,quoteLink:"",status:"시안링크공유",reserve:"",pay:"",hqSent:"N"});notify("콜팀","고객 발송용 시안 링크 도착: "+t.rid,t.rid);notify("영업","시안 링크 공유 완료, 고객 접촉 필요: "+t.rid,t.rid);save();render()}
function sales(){layout(`<div class="card narrow"><h2>HVIRAL 마케팅ㆍ영업팀</h2><select id="kind"><option>아웃바운드</option><option>인바운드</option></select><input id="id" placeholder="Request ID 또는 IN-Request ID"><input id="customer" placeholder="고객 식별명"><input id="kakao" placeholder="고객 카톡ID"><h4>상품 복수 선택</h4>${serviceCheckboxes("ssvc")}<button class="primary" onclick="makeQuote()">고객용 견적/예약금 링크 생성</button><button class="primary" onclick="sendHQ()">HVIRAL 사업본부 자동전달</button></div><div class="card">${table(db.sales,["kind","rid","inid","customer","kakao","service","serviceCode","sianLink","quoteLink","status","reserve","pay","hqSent"])}</div>`)}function makeQuote(){if(!req(["영업"]))return;let id=v("id"),isIn=id.startsWith("IN-"),link=location.origin+location.pathname+"?quote="+encodeURIComponent(id),s=db.sales.find(x=>same(x,id)),meta=combinedMeta(selectedServices("ssvc"));if(!s){s={kind:v("kind"),rid:isIn?"":id,inid:isIn?id:"",sianLink:""};db.sales.unshift(s)}Object.assign(s,{customer:v("customer"),kakao:v("kakao"),...meta,quoteLink:link,status:"고객작성대기"});notify("영업","고객용 링크 생성됨: "+id,id);save();alert("고객에게 보낼 링크:\n"+link);render()}
function customerQuote(id){topHeader.style.display="none";root.innerHTML=`<div class="client-hero"><div class="client-wrap"><div class="client-logo"><h1>HVIRAL</h1><p>견적요청 · 예약금 결제</p></div><div class="client-card"><h3>고객용 견적요청</h3><input id="qname" placeholder="고객명/상호"><input id="qphone" placeholder="연락처"><select id="qindustry">${industryOptions()}</select><h4>상품 복수 선택</h4>${serviceCheckboxes("qsvc")}<textarea id="qcontent" placeholder="요청내용"></textarea><input id="qreserve" placeholder="예약금"><select id="qpay"><option>삼성페이</option><option>카드결제</option><option>계좌이체</option><option>현금</option></select>${legalHtml()}<button class="primary" onclick="submitQuotePay('${id}')">전체 안내 확인 후 예약금 결제 완료</button><p class="small">index 확인용 결제 시뮬레이션입니다.</p></div></div></div>`}function submitQuotePay(id){if(!requiredLegalOk())return;let isIn=id.startsWith("IN-"),s=db.sales.find(x=>same(x,id)),meta=combinedMeta(selectedServices("qsvc"));if(!s){s={kind:isIn?"인바운드":"아웃바운드",rid:isIn?"":id,inid:isIn?id:""};db.sales.unshift(s)}Object.assign(s,{customer:v("qname"),industry:v("qindustry"),...meta,status:"예약금결제",reserve:v("qreserve"),pay:v("qpay"),hqSent:"Y",legal:JSON.stringify(legalSnapshot())});let pay={id:seq("PAY"),payType:"예약금",rid:isIn?"":id,inid:isIn?id:"",customer:v("qname"),industry:v("qindustry"),...meta,amount:v("qreserve"),method:v("qpay"),status:"확인대기"};db.finance.unshift(pay);db.hq.unshift({kind:s.kind,rid:s.rid,inid:s.inid,customer:v("qname"),industry:v("qindustry"),...meta,request:`연락처:${v("qphone")} / 요청:${v("qcontent")} / 예약금:${v("qreserve")} / 결제:${v("qpay")}`,internal:"치환 대기",scope:meta.service,amount:v("qreserve"),status:"본부장검토",vpSent:"N"});createAccountRequests(s.rid||s.inid,v("qname"),meta);if(meta.service.includes("블로그 체험단"))createCampaignFromPay(s.rid||s.inid,v("qname"),meta.service);notify("경영지원","예약금 결제 확인 필요: "+(pay.rid||pay.inid),pay.id);notify("감사","예약금 결제 건 예외 여부 확인 가능: "+(pay.rid||pay.inid),pay.id);notify("본부장","고객 견적요청서 제출: "+id,id);save();alert("예약금 결제 완료");location.href=location.origin+location.pathname}function sendHQ(){if(!req(["영업"]))return;let id=v("id"),s=db.sales.find(x=>same(x,id));if(!s)return alert("영업건 없음");if(!db.hq.some(x=>same(x,id)))db.hq.unshift({kind:s.kind,rid:s.rid,inid:s.inid,customer:s.customer,service:s.service,serviceCode:s.serviceCode,taxText:s.taxText,request:"영업 수동 전달",internal:"치환 대기",scope:s.service,amount:s.reserve,status:"본부장검토",vpSent:"N"});s.hqSent="Y";notify("본부장","영업 수동 HVIRAL 사업본부 전달: "+id,id);save();render()}
function createAccountRequests(id,customer,meta){let platforms=(meta.platforms||"").split(",").filter(Boolean);platforms.forEach(p=>{if(!db.accountRequests.some(x=>(x.rid===id||x.inid===id)&&x.platform===p)){let g=PLATFORM_GUIDES[p]||{label:p,link:"#",guide:"관리자 권한 요청"},accId=seq("ACC");db.accountRequests.unshift({accessId:accId,rid:id.startsWith("OUT-")?id:"",inid:id.startsWith("IN-")?id:"",customer,service:meta.service,platform:p,platformLabel:g.label,accessType:p==="EXPERIENCE_CAMPAIGN"?"모집링크":"관리자초대",requestLink:location.origin+location.pathname+"?account="+encodeURIComponent(accId+"_"+p+"_"+id),status:"고객초대대기",hviralAccount:"hviral@hviral.co.kr",guide:g.guide,platformUrl:g.link})}});if(platforms.length)notify("영업","플랫폼 계정권한 요청 생성: "+id,id)}function accountAccess(){layout(`<div class="card narrow"><h2>플랫폼 계정권한 관리</h2><input id="accId" placeholder="권한요청 ID"><select id="accStatus"><option>고객초대대기</option><option>초대완료</option><option>하비럴수락완료</option><option>작업가능</option><option>권한회수</option><option>보류</option></select><button class="primary" onclick="updateAccountStatus()">상태 변경</button></div><div class="card">${table(db.accountRequests,["accessId","rid","inid","customer","service","platformLabel","accessType","hviralAccount","status","requestLink","guide"])}</div>`)}function updateAccountStatus(){if(!req(["영업","관리자"]))return;let a=db.accountRequests.find(x=>x.accessId===v("accId"));if(!a)return alert("권한요청 ID 없음");a.status=v("accStatus");notify("영업","계정권한 상태 변경: "+a.accessId,a.accessId);save();render()}function customerAccountGuide(token){topHeader.style.display="none";let parts=decodeURIComponent(token).split("_"),p=parts[1],id=parts.slice(2).join("_"),g=PLATFORM_GUIDES[p]||{label:p,link:"#",guide:"관리자 권한 요청"};root.innerHTML=`<div class="client-hero"><div class="client-wrap"><div class="client-logo"><h1>HVIRAL</h1><p>계정 권한 요청 안내</p></div><div class="client-card"><h3>${g.label}</h3><p class="small"><b>Request:</b> ${id}</p><p>${g.guide}</p><p class="small">아이디/비밀번호 function createCampaignFromPay(id,customer,service){if(db.campaigns.some(x=>x.rid===id||x.inid===id))return;let campId=seq("CAMP");db.campaigns.unshift({campId,rid:id.startsWith("OUT-")?id:"",inid:id.startsWith("IN-")?id:"",customer,service,status:"모집중",applyLink:location.origin+location.pathname+"?campaign="+encodeURIComponent(campId),selected:"0",submitted:"0"});notify("영업","블로그 체험단 모집 링크 생성: "+campId,campId)}function campaigns(){layout(`<div class="card narrow"><h2>블로그 체험단 관리</h2><input id="campId" placeholder="캠페인 ID"><select id="campStatus"><option>모집중</option><option>선정</option><option>후기수집중</option><option>후기검수완료</option><option>완료</option></select><button class="primary" onclick="updateCampaign()">캠페인 상태 변경</button></div><div class="card"><h2>캠페인</h2>${table(db.campaigns,["campId","rid","inid","customer","service","status","applyLink","selected","submitted"])}</div><div class="card"><h2>신청자 / 후기 제출</h2>${table(db.applicants,["appId","campId","name","phone","blogUrl","instaUrl","schedule","wish","status","reviewUrl"])}</div>`)}function updateCampaign(){if(!req(["영업","관리자"]))return;let c=db.campaigns.find(x=>x.campId===v("campId"));if(!c)return alert("캠페인 없음");c.status=v("campStatus");save();render()}function campaignApply(campId){topHeader.style.display="none";let c=db.campaigns.find(x=>x.campId===campId)||{};root.innerHTML=`<div class="client-hero"><div class="client-wrap"><div class="client-logo"><h1>HVIRAL</h1><p>블로그 체험단 신청</p></div><div class="client-card"><h3>${c.customer||""} 체험단 신청</h3><input id="aname" placeholder="이름/닉네임"><input id="aphone" placeholder="연락처"><input id="ablog" placeholder="블로그 URL"><input id="ainsta" placeholder="인스타 URL 선택"><input id="aschedule" placeholder="방문 가능 일정"><input id="awish" placeholder="체험 희망 상품"><textarea id="anote" placeholder="기타"></textarea><button class="primary" onclick="submitApplicant('${campId}')">신청하기</button></div></div></div>`}function submitApplicant(campId){db.applicants.unshift({appId:seq("APP"),campId,name:v("aname"),phone:v("aphone"),blogUrl:v("ablog"),instaUrl:v("ainsta"),schedule:v("aschedule"),wish:v("awish"),status:"신청완료",reviewUrl:""});notify("영업","체험단 신청 접수: "+campId,campId);save();alert("신청 완료");location.href=location.origin+location.pathname}
function hq(){layout(`<div class="card narrow"><h2>HVIRAL 사업본부</h2><select id="kind"><option>아웃바운드</option><option>인바운드</option></select><input id="id" placeholder="Request ID 또는 IN-Request ID"><textarea id="internal" placeholder="회사용 견적요청서 치환내용"></textarea><input id="scope" placeholder="계약 범위"><input id="amount" placeholder="계약 예상금액"><button class="primary" onclick="hqToContract()">부대표 전달</button></div><div class="card">${table(db.hq,["kind","rid","inid","customer","industry","service","serviceCode","taxText","request","internal","scope","amount","status","vpSent"])}</div>`)}function hqToContract(){if(!req(["본부장"]))return;let id=v("id"),h=db.hq.find(x=>same(x,id));if(!h)return alert("사업본부 건 없음");h.internal=v("internal");h.scope=v("scope")||h.scope;h.amount=v("amount")||h.amount;h.status="부대표전달";h.vpSent="Y";if(!db.contract.some(x=>same(x,id)))db.contract.unshift({kind:h.kind,rid:h.rid,inid:h.inid,customer:h.customer,industry:h.industry,service:h.service,serviceCode:h.serviceCode,taxText:h.taxText,kakao:"",status:"계약대기",contractNo:seq("CT"),contractLink:"",scope:h.scope,amount:h.amount,balance:"",pay:"",signStatus:"서명대기"});notify("부대표","계약대기 건 도착: "+id,id);save();render()}function contract(){layout(`<div class="card narrow"><h2>부대표 검토ㆍ승인</h2><input id="id" placeholder="Request ID 또는 IN-Request ID"><input id="amount" placeholder="최종 계약금액"><input id="balance" placeholder="잔금"><select id="pay"><option>삼성페이</option><option>카드결제</option><option>계좌이체</option><option>현금</option></select><button class="primary" onclick="issueContract()">계약서 링크 발행</button><button class="primary" onclick="balancePaid()">잔금 결제 완료</button><button class="primary" onclick="contractToExec()">전무이사 전달</button></div><div class="card">${table(db.contract,["rid","inid","customer","industry","service","serviceCode","taxText","status","contractNo","contractLink","scope","amount","balance","pay","signStatus"])}</div>`)}function issueContract(){if(!req(["부대표"]))return;let id=v("id"),c=db.contract.find(x=>same(x,id));if(!c)return alert("계약건 없음");c.contractLink=location.origin+location.pathname+"?contract="+encodeURIComponent(id);c.amount=v("amount")||c.amount;c.balance=v("balance")||c.balance;c.pay=v("pay");c.status="계약링크발행";notify("영업","고객 계약서 링크 전달 필요: "+id,id);save();alert(c.contractLink);render()}function customerContract(id){topHeader.style.display="none";let c=db.contract.find(x=>same(x,id))||{};root.innerHTML=`<main><div class="contract-paper"><h1>계약서</h1><p><b>계약번호:</b> ${c.contractNo||""}</p><p><b>ID:</b> ${id}</p><p><b>고객:</b> ${c.customer||""}</p><p><b>업종:</b> ${c.industry||""}</p><p><b>서비스:</b> ${c.service||""}</p><p><b>정관/세무 코드:</b> ${c.serviceCode||""}</p><p><b>세금계산서 문구:</b> ${c.taxText||""}</p><p><b>범위:</b> ${c.scope||""}</p><p><b>금액:</b> ${c.amount||""}</p><hr><p class="small">본 계약은 고객이 견적/결제 전 확인한 통합 법률·거래 안내 및 서비스별 업무범위에 따라 진행됩니다.</p><input id="signer" placeholder="서명자"><canvas id="signCanvas" class="signbox"></canvas><button class="ghost no-print" onclick="clearSign()">서명 지우기</button><button class="primary no-print" onclick="finishSign('${id}')">전자서명 완료</button><button class="primary no-print" onclick="window.print()">PDF 저장/인쇄</button></div></main>`;initCanvas()}function initCanvas(){let c=document.getElementById("signCanvas"),ctx=c.getContext("2d");c.width=c.offsetWidth;c.height=c.offsetHeight;ctx.lineWidth=3;ctx.lineCap="round";let d=false,p=e=>{let r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}};c.onmousedown=c.ontouchstart=e=>{d=true;let q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y);e.preventDefault()};c.onmousemove=c.ontouchmove=e=>{if(!d)return;let q=p(e);ctx.lineTo(q.x,q.y);ctx.stroke();e.preventDefault()};c.onmouseup=c.onmouseleave=c.ontouchend=()=>d=false;signPad=c}function clearSign(){signPad.getContext("2d").clearRect(0,0,signPad.width,signPad.height)}function finishSign(id){let c=db.contract.find(x=>same(x,id));c.signStatus="서명완료";c.status="서명완료";c.signer=v("signer");c.signedAt=now();c.signature=signPad.toDataURL("image/png");notify("부대표","고객 전자서명 완료: "+id,id);save();alert("서명 완료")}function balancePaid(){if(!req(["부대표"]))return;let id=v("id"),c=db.contract.find(x=>same(x,id));if(!c)return alert("계약건 없음");c.balance=v("balance");c.pay=v("pay");c.status="잔금결제";let pay={id:seq("PAY"),payType:"잔금",rid:c.rid,inid:c.inid,customer:c.customer,industry:c.industry,service:c.service,serviceCode:c.serviceCode,taxText:c.taxText,amount:c.balance,method:c.pay,status:"확인대기"};db.finance.unshift(pay);createAccountRequests(c.rid||c.inid,c.customer,{service:c.service,platforms:(c.platforms||""),serviceCode:c.serviceCode,taxText:c.taxText});notify("경영지원","잔금 결제 확인 필요: "+(pay.rid||pay.inid),pay.id);notify("감사","잔금 결제 건 예외 여부 확인 가능: "+(pay.rid||pay.inid),pay.id);save();render()}function contractToExec(){if(!req(["부대표","경영지원","감사"]))return;let id=v("id"),c=db.contract.find(x=>same(x,id));if(!c)return alert("계약건 없음");if(!db.executive.some(x=>same(x,id)))db.executive.unshift({rid:c.rid,inid:c.inid,service:c.service,contract:"계약완료",finance:"확인필요",audit:"확인필요",status:"전무대기",judge:"대기"});notify("전무이사","실행 승인 대기: "+id,id);save();render()}function finance(){layout(`<div class="card narrow"><h2>HVIRAL 경영지원팀</h2><input id="payId" placeholder="결제ID"><select id="status"><option>확인완료</option><option>이슈</option><option>확인대기</option></select><button class="primary" onclick="financeConfirm()">결제 확인 처리</button></div><div class="card">${table(db.finance,["id","payType","rid","inid","customer","industry","service","serviceCode","taxText","amount","method","status"])}</div>`)}function financeConfirm(){if(!req(["경영지원"]))return;let p=db.finance.find(x=>x.id===v("payId"));if(!p)return alert("결제ID 없음");p.status=v("status");if(p.status==="이슈"){db.audit.unshift({id:seq("AUD"),rid:p.rid,inid:p.inid,type:p.payType,reason:"경영지원 결제 이슈",risk:"중",status:"검토중"});notify("감사","경영지원 결제 이슈 검토 필요: "+(p.rid||p.inid),p.rid||p.inid)}save();render()}function audit(){layout(`<div class="card narrow"><h2>감사 예외검토</h2><input id="audId" placeholder="감사ID"><select id="status"><option>검토완료</option><option>이슈</option><option>반려</option></select><input id="memo" placeholder="검토 메모"><button class="primary" onclick="auditConfirm()">감사 처리</button></div><div class="card">${table(db.audit,["id","rid","inid","type","reason","risk","status","memo"])}</div>`)}function auditConfirm(){if(!req(["감사"]))return;let a=db.audit.find(x=>x.id===v("audId"));if(!a)return alert("감사ID 없음");a.status=v("status");a.memo=v("memo");notify("대표","감사 처리 완료: "+a.id,a.id);save();render()}function executive(){layout(`<div class="card narrow"><h2>전무이사 실행ㆍ승인</h2><input id="id" placeholder="Request ID 또는 IN-Request ID"><select id="judge"><option>승인</option><option>보류</option><option>차단</option></select><select id="line"><option>lineA</option><option>lineB</option></select><button class="primary" onclick="execApprove()">실행 승인 → 라인 작업생성</button></div><div class="card">${table(db.executive,["rid","inid","service","contract","finance","audit","status","judge"])}</div>`)}function execApprove(){if(!req(["전무이사"]))return;let id=v("id"),e=db.executive.find(x=>same(x,id));if(!e)return alert("전무대기 건 없음");e.judge=v("judge");e.status=v("judge")==="승인"?"실행승인":"보류";let line=v("line"),meta=combinedMeta((e.service||SERVICES[0].name).split(" + "));if(v("judge")==="승인"&&!db[line].some(x=>same(x,id)&&x.status==="작업요청")){db[line].unshift({rid:e.rid,inid:e.inid,token:"",unit:seq("UNIT"),...meta,type:"계약후작업",status:"작업요청",execView:"작업시작",managerView:"작업요청",usb:"",file:"",po:"N"});notify("라인","계약 후 라인 작업요청: "+id,id)}save();render()}
function inbound(){layout(`<div class="card narrow"><h2>HVIRAL 접수처</h2><input id="customer" placeholder="고객명/코드"><input id="channel" placeholder="유입경로"><select id="industry">${industryOptions()}</select><h4>상품 복수 선택</h4>${serviceCheckboxes("isvc")}<textarea id="summary" placeholder="요청요약"></textarea><select id="urgent"><option>보통</option><option>긴급</option><option>낮음</option></select><button class="primary" onclick="addInbound()">IN-Request ID 발급 → 기획조정 자동전달</button></div><div class="card">${table(db.inbound,["inid","customer","channel","industry","product","serviceCode","taxText","summary","urgent","status"])}</div>`)}function addInbound(){if(!req(["관리자","영업","기획조정"]))return;let inid=seq("IN"),meta=combinedMeta(selectedServices("isvc"));db.inbound.unshift({inid,customer:v("customer"),channel:v("channel"),industry:v("industry"),product:meta.service,serviceCode:meta.serviceCode,taxText:meta.taxText,summary:v("summary"),urgent:v("urgent"),status:"접수완료"});db.planning.unshift({inid,customer:v("customer"),industry:v("industry"),product:meta.service,serviceCode:meta.serviceCode,taxText:meta.taxText,summary:v("summary"),route:"",status:"대기"});notify("기획조정","인바운드 신규 접수: "+inid,inid);save();render()}function planning(){layout(`<div class="card narrow"><h2>HVIRAL 기획조정팀</h2><input id="inid" placeholder="IN-Request ID"><select id="route"><option>영업</option><option>대표토큰</option><option>보류</option><option>제외</option></select><button class="primary" onclick="routeInbound()">분배 처리</button></div><div class="card">${table(db.planning,["inid","customer","industry","product","serviceCode","taxText","summary","route","status"])}</div>`)}function routeInbound(){if(!req(["기획조정"]))return;let p=db.planning.find(x=>x.inid===v("inid"));if(!p)return alert("기획조정 건 없음");p.route=v("route");p.status="분배완료";if(p.route==="영업"&&!db.sales.some(x=>x.inid===p.inid)){db.sales.unshift({kind:"인바운드",rid:"",inid:p.inid,customer:p.customer,industry:p.industry,kakao:"",service:p.product,serviceCode:p.serviceCode,taxText:p.taxText,sianLink:"",quoteLink:"",status:"영업대기",reserve:"",pay:"",hqSent:"N"});notify("영업","인바운드 영업 배정: "+p.inid,p.inid)}if(p.route==="대표토큰")notify("대표","인바운드 토큰 판단 필요: "+p.inid,p.inid);save();render()}
function notifications(){layout(`<div class="card narrow"><h2>알림센터</h2><button class="primary" onclick="requestNotifyPermission()">브라우저 알림 권한 요청</button><input id="nid" placeholder="관련 ID"><button class="primary" onclick="markRead()">관련 ID 알림 읽음처리</button></div><div class="card">${table(db.notifications,["time","role","msg","id","kind","read"])}</div>`)}function markRead(){let id=v("nid");db.notifications.forEach(n=>{if(n.id===id)n.read="Y"});save();render()}function logs(){layout(`<div class="card"><h2>감사 로그</h2>${table(db.logs,["time","user","role","type","msg","id","page"])}<button class="red" onclick="if(confirm('전체 초기화?')){localStorage.removeItem(KEY);location.reload()}">전체 초기화</button></div>`)}render();
</script>
</body>
