<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>HVIRAL ERP·CRM CONTRACT SYSTEM</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#202633;--muted:#6b7280;--nav:#1e2a44;--nav2:#2f3d60;--blue:#4f6dff;--red:#e14b42;--line:#e8ecf3;--ok:#dff7e8;--warn:#fff2c7;--bad:#ffe0e0;--gray:#edf1f7}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#eef2ff,#f8fafc);font-family:Arial,'Noto Sans KR',sans-serif;color:var(--ink)}
header{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:1000}
.app{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 62px)}
nav{background:var(--nav);padding:12px;overflow:auto}
nav button{width:100%;padding:13px;margin:5px 0;border:0;border-radius:15px;background:var(--nav2);color:#fff;text-align:left;font-size:14px;cursor:pointer}
nav button.on{background:var(--blue)}
main{padding:18px;overflow:auto}
.card{background:var(--card);border-radius:26px;padding:18px;margin:0 auto 18px;max-width:1080px;box-shadow:0 10px 30px rgba(0,0,0,.07);animation:up .28s ease}
@keyframes up{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:none}}
.narrow{max-width:680px}
.small{font-size:12px;color:var(--muted);line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
input,select,textarea{width:100%;padding:14px;border:1px solid #dde3ef;border-radius:17px;margin-bottom:10px;background:#fff;font-size:15px}
textarea{min-height:92px;resize:vertical}
button.primary{width:100%;padding:15px;border:0;border-radius:18px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button.red{padding:9px 12px;border:0;border-radius:13px;background:var(--red);color:#fff;cursor:pointer}
button.ghost{padding:10px 12px;border:1px solid #dde3ef;border-radius:13px;background:#fff;cursor:pointer;margin:2px}
.flow{display:flex;gap:8px;flex-wrap:wrap}.flow span{background:var(--gray);border-radius:999px;padding:8px 12px;font-size:13px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi .card{margin:0;max-width:none}
.table-wrap{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:9px;text-align:left;vertical-align:top;white-space:nowrap}
th{background:#f0f3fa;position:sticky;top:0;z-index:1}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;background:var(--gray)}
.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}
.search{max-width:360px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.contract-paper{background:#fff;border:1px solid #ddd;border-radius:18px;padding:28px;max-width:850px;margin:auto;line-height:1.8}
.contract-paper h1{text-align:center;margin-top:0}
.signbox{border:1px dashed #aaa;border-radius:12px;background:#fafafa;width:100%;height:180px;touch-action:none}
.preview-img{max-width:160px;max-height:100px;border:1px solid #ddd;border-radius:10px;margin:6px 0}
@media(max-width:768px){
.app{display:block;height:auto}nav{position:fixed;top:0;left:-100%;width:280px;height:100%;z-index:2000;transition:.25s}nav.open{left:0}
main{padding:14px}.card{max-width:100%;border-radius:24px;padding:18px}.grid,.kpi{grid-template-columns:1fr}
header b{font-size:15px}header div:last-child{font-size:12px}
table,thead,tbody,tr,th,td{display:block;width:100%}thead{display:none}
tbody tr{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:14px;box-shadow:0 6px 18px rgba(0,0,0,.05)}
td{border:0;display:flex;justify-content:space-between;gap:12px;padding:8px 0;white-space:normal;font-size:14px}
td::before{content:attr(data-label);font-weight:800;color:var(--muted);min-width:115px}
}
@media print{
body{background:#fff}header,nav,.no-print,.app>nav{display:none!important}.app{display:block;height:auto}main{padding:0}.card{box-shadow:none;border:0}.contract-paper{border:0;border-radius:0}
}
</style>
</head>
<body>
<div id="root"></div>

<script>
const KEY="HVIRAL_ERP_CRM_CONTRACT_FULL_V1";
const PW="2580";
const now=()=>new Date().toLocaleString("ko-KR");
const yr=()=>new Date().getFullYear();
const seq=p=>`${p}-${yr()}-${String(Date.now()).slice(-6)}`;

let unlocked=false,user=null,view="dash";
const blank={outDB:[],call:[],consent:[],token:[],execution:[],po:[],inbound:[],planning:[],sales:[],hq:[],contract:[],executive:[],logs:[]};
let db=JSON.parse(localStorage.getItem(KEY)||"null")||blank;

const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const v=id=>document.getElementById(id)?.value?.trim()||"";
const byId=(arr,id)=>db[arr].find(r=>r.id==id||r["Request ID"]===id||r["IN-Request ID"]===id);
const exists=(arr,p)=>db[arr].some(p);
const update=(arr,k,x,p)=>db[arr].forEach(r=>{if(r[k]===x)Object.assign(r,p)});
const sameFlow=(r,id)=>r["Request ID"]===id||r["IN-Request ID"]===id||r.id==id;
const log=(구분,내용,참조="")=>{db.logs.unshift({일시:now(),사용자:user?.name||"",권한:user?.role||"",구분,내용,참조});save()};
function requireRole(roles){if(!user||!roles.includes(user.role)){alert("권한 없음: "+roles.join(", ")+" 권한 필요");return false}return true}
function sync(id,patches){Object.entries(patches).forEach(([arr,patch])=>db[arr].forEach(r=>{if(sameFlow(r,id)||r["토큰ID"]===id||r["유닛ID"]===id)Object.assign(r,patch)}))}
function hasExecution(id,type,stage){return db.execution.some(x=>sameFlow(x,id)&&x["작업구분"]===type&&x["파이프라인단계"]===stage)}
function hasPO(id,type){return db.po.some(x=>sameFlow(x,id)&&x["작업유형"]===type)}
const cls=x=>["Y","승인","완료","사용중","가능","PO적재","출고완료","계약완료","검증완료","동의","분배완료","작업요청","콜완료","서명완료","발행완료"].includes(x)?"ok":["대기","보류","검토중","진행중","출고대기","미연락","감사대기","승인대기","계약대기","서명대기"].includes(x)?"warn":["N","반려","차단","이슈","거절","불가","제외"].includes(x)?"bad":"";
const badge=x=>`<span class="badge ${cls(x)}">${x??""}</span>`;
function table(rows,cols){return`<input class="search no-print" placeholder="검색" onkeyup="filterRows(this)"><div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td data-label="${c}">${badge(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function filterRows(i){let q=i.value.toLowerCase();i.parentElement.querySelectorAll("tbody tr").forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?"":"none")}
function toggleMenu(){document.querySelector("nav")?.classList.toggle("open")}
function go(x){view=x;render()}
function add(arr,row,msg,ref){db[arr].unshift(row);log("CREATE",msg,ref||row["Request ID"]||row["IN-Request ID"]||row.id||"");save();render()}

const C={
outDB:["Request ID","수집일","업체명","연락처","업종","지역","콜상태","콜담당자","배정일시","차단여부","차단사유","재접촉금지","중복기준","메모"],
call:["Request ID","업체명","연락처","콜담당자","연락결과","동의여부","거부사유","재연락여부","최초통화일시","콜메모","시안상태","URL링크","토큰전달여부","토큰전달일시"],
consent:["Request ID","요청일자","요청번호","고객/업체명","상품/작업유형","요청내용","요청부서","요청자","콜담당자","동의확인","차단검토","재접촉금지검토","승인요청상태"],
token:["Request ID","IN-Request ID","CEO Reference","토큰ID","요청일자","요청번호","유닛ID","유닛기준","고객/업체명","상품/작업유형","요청내용","요청부서","요청자","콜담당자","동의확인","차단검토","재접촉금지검토","승인상태","승인일시","승인자","토큰생성일시","토큰상태","유효기한","반려사유","프로젝트오피스 전달여부","전달일시","완료보고수령","토큰해제여부","토큰해제일시","특이사항"],
execution:["Request ID","IN-Request ID","토큰ID","유닛ID","CEO Reference","파이프라인구분","작업구분","파이프라인단계","고객/업체명","상품명","요청내용","작업부서","부서팀장","작업자","입력권한구분","이전부서","현재부서","다음부서","USB 바구니함 상태","현재위치","다음위치","산출물 파일명","산출물 형식","저장경로","완료보고","정합성","범위준수","원본저장","팀장검수","PO전달가능","PO전달여부","PO전달일시"],
po:["Request ID","IN-Request ID","토큰ID","유닛ID","유입경로","작업코드","상품명","고객 식별명","작업유형","요청내용","작업지시 확인","프로젝트 담당자","상품 담당자","외주 여부","산출물 파일명","산출물 형식","링크 생성 여부","링크","완료보고 수령","정합성","범위준수","원본저장","저장경로","출고상태","출고대상","출고일시","출고자","전달방식","확인여부","AS 여부","유지관리 여부","토큰연계 여부","특이사항"],
inbound:["IN-Request ID","인바운드 유형","유입경로","고객코드","소개자코드","연락채널","업종","상품코드","상품옵션","요청요약","긴급도","우선순위점수","기획조정 전달","기획조정 상태","분배유형","토큰요청","토큰ID","접수일시","접수자","접촉로그","비고"],
planning:["IN-Request ID","고객코드","업종","상품코드","상품옵션","요청요약","난이도","예상금액레벨","전환가능성","우선순위점수","판단근거","분배유형","담당팀","담당자","분배일시","처리기한","토큰요청","토큰ID","상태","기록자","로그"],
sales:["유입구분","Request ID","IN-Request ID","토큰ID","유닛ID","고객 식별명","고객코드","업종","주소","시안 발송 여부","최초 접촉 여부","고객 반응 상태","견적 요청 유도 여부","견적요청서 수령","착수금 결제 여부","착수금액","결제 일시","견적요청 링크","견적요청 상태","부대표 계약 요청","본부장 전달 여부","담당 영업자","진행 상태","특이사항"],
hq:["유입구분","Request ID","IN-Request ID","토큰ID","유닛ID","고객 식별명","고객코드","고객용 견적요청서 수령","고객 요청 원본","회사 견적요청서 치환","계약 범위 확정","제외 범위","예상 금액","특이사항","부대표 전달 여부","전달일시"],
contract:["유입구분","IN-Request ID","Request ID","토큰ID","유닛ID","고객 식별명","고객코드","계약상태","계약일","계약서 번호","계약서 링크","계약서 파일/경로","고객견적요청서 수령","내부견적서 확인","최종 계약금액","착수금액","입금확인","입금일시","결제방식","경영지원 확인","감사 확인상태","부대표 실행승인","전무이사 전달여부","작업지시 발급여부","전자서명 상태","서명자","서명일시","도장저장","서명저장"],
executive:["유입구분","IN-Request ID","Request ID","토큰ID","유닛ID","CEO Reference","계약상태","착수금 확인","입금확인","경영지원 확인","감사 확인상태","부대표 실행승인","전무이사 전달여부","작업지시 발급여부","실행시작 가능여부","전무이사 실행판정","코어상태","인터페이스 바구니함 상태","현재위치","다음위치","유닛 전달여부","PO 전달여부","PO 회수여부","완료보고 수령","토큰해제 요청","완료여부"],
logs:["일시","사용자","권한","구분","내용","참조"]
};

function lockScreen(){document.getElementById("root").innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px"><div class="card narrow"><h2>접근 제한</h2><p class="small">하비럴 ERP·CRM 테스트 백오피스입니다.</p><input id="pw" type="password" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')checkPw()"><button class="primary" onclick="checkPw()">접속</button></div></div>`}
function checkPw(){if(v("pw")===PW){unlocked=true;renderApp()}else alert("비밀번호 틀림")}
function login(){document.getElementById("root").innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px"><div class="card narrow"><h1>HVIRAL ERP 로그인</h1><p class="small">INDEX 단일파일 테스트용 로그인입니다. 실제 직원 동시사용은 서버/DB 버전으로 전환해야 합니다.</p><input id="loginName" value="이재현" placeholder="이름"><select id="loginRole"><option>대표</option><option>전무이사</option><option>부대표</option><option>본부장</option><option>운영지원</option><option>콜팀</option><option>영업</option><option>실행팀</option><option>PO</option><option>경영지원</option><option>감사</option></select><button class="primary" onclick="user={name:v('loginName'),role:v('loginRole')};log('LOGIN','로그인');render()">입장</button></div></div>`}

function layout(content){const menus=[["dash","대시보드"],["outDB","BOUND 운영지원 DB"],["call","콜팀"],["consent","동의자 작업요청"],["token","대표 토큰·승인"],["execution","실행팀 통합"],["po","프로젝트오피스 PO"],["inbound","인바운드 접수처"],["planning","기획조정팀"],["sales","마케팅·영업"],["hq","사업본부 본부장"],["contract","부대표·계약/서명"],["executive","전무이사 실행통제"],["logs","감사 로그"]];document.getElementById("root").innerHTML=`<header><div style="display:flex;align-items:center;gap:10px"><button class="red no-print" onclick="toggleMenu()">☰</button><b>HVIRAL ERP·CRM</b></div><div class="no-print">${user.name} · ${user.role} <button class="red" onclick="user=null;render()">로그아웃</button></div></header><div class="app"><nav class="no-print">${menus.map(m=>`<button class="${view===m[0]?'on':''}" onclick="view='${m[0]}';toggleMenu();render()">${m[1]}</button>`).join("")}</nav><main>${content}</main></div>`}

function dash(){layout(`<div class="card"><h2>하비럴 전체 흐름 시스템</h2><div class="flow"><span>영업: 견적요청 링크</span><span>고객: 견적요청 작성</span><span>본부장: 회사용 치환</span><span>부대표: 계약링크 발행</span><span>고객: 전자서명/도장</span><span>전무: 실행통제</span><span>실행팀</span><span>PO</span></div><hr><p class="small">계약 링크 발행과 전자서명 관리는 부대표 권한입니다. PDF는 계약서 화면에서 브라우저 인쇄 → PDF 저장 방식입니다.</p></div><div class="kpi">${Object.keys(db).filter(k=>k!=="logs").map(k=>`<div class="card"><b>${k}</b><h2>${db[k].length}</h2></div>`).join("")}</div>`)}

function outDB(){layout(`<div class="card narrow"><h2>BOUND 운영지원 DB</h2><input id="biz" placeholder="업체명"><input id="phone" placeholder="연락처"><input id="industry" placeholder="업종"><input id="area" placeholder="지역(주소 아님)"><input id="memo" placeholder="메모"><button class="primary" onclick="addOut()">타깃 등록</button></div><div class="card">${table(db.outDB,C.outDB)}</div>`)}
function addOut(){if(!requireRole(["대표","운영지원"]))return;add("outDB",{"Request ID":seq("OUT"),"수집일":now(),"업체명":v("biz"),"연락처":v("phone"),"업종":v("industry"),"지역":v("area"),"콜상태":"미연락","콜담당자":"","배정일시":"","차단여부":"N","차단사유":"","재접촉금지":"N","중복기준":"","메모":v("memo")},"아웃바운드 타깃 등록")}

function call(){layout(`<div class="card narrow"><h2>콜팀 결과 입력</h2><input id="rid" placeholder="Request ID"><input id="caller" placeholder="콜담당자"><select id="result"><option>동의</option><option>거절</option><option>부재</option><option>재접촉</option><option>차단</option></select><input id="reject" placeholder="거부사유"><input id="memo" placeholder="콜메모"><button class="primary" onclick="addCall()">콜결과 저장</button></div><div class="card">${table(db.call,C.call)}</div>`)}

function contractCustomerPage(id){const c=db.contract.find(x=>sameFlow(x,id))||{};document.getElementById("root").innerHTML=`<main style="padding:20px"><div class="contract-paper" id="paper"><h1>계약서</h1><p><b>계약번호:</b> ${c["계약서 번호"]||seq("CT")}</p><p><b>계약대상:</b> ${c["고객 식별명"]||id}</p><p><b>계약금액:</b> ${c["최종 계약금액"]||"-"}</p><p><b>착수금:</b> ${c["착수금액"]||"-"}</p><hr><p>본 계약은 고객 요청에 따른 디지털 마케팅/웹/콘텐츠/운영 관련 업무 수행을 목적으로 하며, 세부 범위는 견적요청서 및 회사 내부 확정 범위에 따릅니다.</p><p>고객은 본 계약 내용을 확인하고 전자서명 및 도장 이미지를 제출함으로써 계약 의사를 표시합니다.</p><hr><input id="signer" placeholder="서명자 이름"><p class="small">아래 칸에 손가락 또는 마우스로 서명하세요.</p><canvas id="signCanvas" class="signbox"></canvas><button class="ghost no-print" onclick="clearSign()">서명 지우기</button><p class="small">도장 이미지가 있다면 업로드하세요.</p><input class="no-print" type="file" id="stampFile" accept="image/*" onchange="loadStamp(event)"><div id="stampPreview"></div><button class="primary no-print" onclick="finishSign('${id}')">전자서명 완료</button><button class="primary no-print" onclick="window.print()">PDF 저장/인쇄</button></div></main>`;initCanvas()}
let signPad=null,stampData="";
function initCanvas(){const c=document.getElementById("signCanvas");const ctx=c.getContext("2d");function resize(){c.width=c.offsetWidth;c.height=c.offsetHeight;ctx.lineWidth=3;ctx.lineCap="round"}resize();let drawing=false;const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}};c.onmousedown=c.ontouchstart=e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()};c.onmousemove=c.ontouchmove=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()};c.onmouseup=c.onmouseleave=c.ontouchend=()=>drawing=false;signPad=c}
function clearSign(){const c=signPad;c.getContext("2d").clearRect(0,0,c.width,c.height)}
function loadStamp(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{stampData=r.result;document.getElementById("stampPreview").innerHTML=`<img class="preview-img" src="${stampData}">`};r.readAsDataURL(f)}
function finishSign(id){const c=db.contract.find(x=>sameFlow(x,id));if(!c)return alert("계약 정보를 찾을 수 없습니다.");const signData=signPad.toDataURL("image/png");Object.assign(c,{"계약상태":"계약완료","전자서명 상태":"서명완료","서명자":v("signer"),"서명일시":now(),"서명저장":"Y","도장저장":stampData?"Y":"N","signatureData":signData,"stampData":stampData});log("SIGN","고객 전자서명 완료",id);save();alert("전자서명이 완료되었습니다. 필요 시 PDF 저장/인쇄 버튼으로 저장하세요.");}

function addInbound(){if(!requireRole(["대표","영업","본부장","운영지원"]))return;const inid=seq("IN");db.inbound.unshift({"IN-Request ID":inid,"인바운드 유형":v("type"),"유입경로":v("channel"),"고객코드":v("code"),"소개자코드":v("intro"),"연락채널":v("contact"),"업종":v("industry"),"상품코드":v("product"),"상품옵션":v("option"),"요청요약":v("summary"),"긴급도":v("urgent"),"우선순위점수":"","기획조정 전달":"Y","기획조정 상태":"대기","분배유형":"","토큰요청":"N","토큰ID":"","접수일시":now(),"접수자":user.name,"접촉로그":"","비고":""});db.planning.unshift({"IN-Request ID":inid,"고객코드":v("code"),"업종":v("industry"),"상품코드":v("product"),"상품옵션":v("option"),"요청요약":v("summary"),"난이도":"","예상금액레벨":"","전환가능성":"","우선순위점수":"","판단근거":"","분배유형":"","담당팀":"","담당자":"","분배일시":"","처리기한":"","토큰요청":"N","토큰ID":"","상태":"대기","기록자":user.name,"로그":"접수 자동 생성"});log("AUTO","인바운드 접수 및 기획조정 대기 생성",inid);save();render()}

function planning(){layout(`<div class="card narrow"><h2>기획조정팀</h2><input id="pin" placeholder="IN-Request ID"><input id="score" placeholder="우선순위점수"><input id="reason" placeholder="판단근거"><select id="route"><option>영업</option><option>본부장</option><option>부대표</option><option>보류</option><option>제외</option></select><input id="owner" placeholder="담당자"><button class="primary" onclick="routeInbound()">분배 처리</button></div><div class="card">${table(db.planning,C.planning)}</div>`)}
function routeInbound(){if(!requireRole(["대표","본부장"]))return;const inid=v("pin"),route=v("route");if(!inid)return alert("IN-Request ID 필요");update("inbound","IN-Request ID",inid,{"기획조정 상태":"분배완료","분배유형":route});db.planning.unshift({"IN-Request ID":inid,"고객코드":"","업종":"","상품코드":"","상품옵션":"","요청요약":"","난이도":"","예상금액레벨":"","전환가능성":"","우선순위점수":v("score"),"판단근거":v("reason"),"분배유형":route,"담당팀":route,"담당자":v("owner"),"분배일시":now(),"처리기한":"","토큰요청":"N","토큰ID":"","상태":"분배완료","기록자":user.name,"로그":"분배 처리"});if(route==="영업"&&!exists("sales",x=>x["IN-Request ID"]===inid)){db.sales.unshift({"유입구분":"인바운드","Request ID":"","IN-Request ID":inid,"토큰ID":"","유닛ID":"","고객 식별명":"","고객코드":"","업종":"","주소":"","시안 발송 여부":"N","최초 접촉 여부":"N","고객 반응 상태":"미접촉","견적 요청 유도 여부":"N","견적요청서 수령":"N","착수금 결제 여부":"N","착수금액":"","결제 일시":"","견적요청 링크":"","견적요청 상태":"","부대표 계약 요청":"N","본부장 전달 여부":"N","담당 영업자":v("owner"),"진행 상태":"미접촉","특이사항":""});log("AUTO","인바운드 영업행 자동 생성",inid)}save();render()}

function logs(){layout(`<div class="card"><h2>감사 로그</h2>${table(db.logs,C.logs)}<br><button class="red" onclick="if(confirm('전체 데이터 초기화?')){localStorage.removeItem(KEY);location.reload()}">전체 초기화</button></div>`)}

function routePublic(){const url=new URL(location.href);const q=url.searchParams.get("quote"),c=url.searchParams.get("contract");if(q){customerQuotePage(q);return true}if(c){contractCustomerPage(c);return true}return false}
function renderApp(){if(routePublic())return;if(!user)return login();({dash,outDB,call,consent,token,execution,po,inbound,planning,sales,hq,contract,executive,logs}[view])()}
function render(){if(routePublic())return;if(!unlocked){lockScreen();return}renderApp()}
render();
</script>
</body>
