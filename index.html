function token(){layout(`<div class="card narrow"><h2>대표 토큰·승인</h2><input id="rid" placeholder="Request ID 또는 IN-Request ID"><input id="customer" placeholder="고객/업체명"><h4>상품 복수 선택</h4>${serviceCheckboxes("tsvc")}<input id="work" placeholder="작업내용"><select id="decision"><option>승인</option><option>반려</option><option>보류</option></select><button class="primary" onclick="issueToken()">토큰 처리</button></div><div class="card">${table(db.token,["rid","inid","token","unit","customer","service","work","status"])}</div>`)}function issueToken(){let id=v("rid"),meta=combinedMeta(selectedServices("tsvc")),isInbound=isIn(id),tk=seq("TK"),unit=seq("UNIT");db.token.unshift({rid:isInbound?"":id,inid:isInbound?id:"",token:tk,unit,customer:v("customer"),service:meta.service,taxText:meta.taxText,platforms:meta.platforms,work:v("work"),status:v("decision")});if(v("decision")==="승인"){db.teamJobs.unshift({rid:isInbound?"":id,inid:isInbound?id:"",token:tk,unit,service:meta.service,taxText:meta.taxText,platforms:meta.platforms,stage:"디자인팀",execView:"작업시작",managerView:"작업요청",usb:unit,status:"작업요청",designFile:"",marketingFile:"",devFile:"",po:"N"});}save();render()}

function mapManager(x){return{"작업시작":"작업요청","진행중":"처리중","제출완료":"제출완료","반려":"수정요청","PO 회수":"PO적재"}[x]||x}function nextStage(team){return team==="디자인팀"?"마케팅영업팀":team==="마케팅영업팀"?"개발팀":"PO"}function stageField(team){return team==="디자인팀"?"designFile":team==="마케팅영업팀"?"marketingFile":"devFile"}
function teamUpload(team){let id=v("rid_"+team), job=db.teamJobs.find(x=>same(x,id));if(!job)return alert("작업 ID 없음");let input=document.getElementById("file_"+team), f=input.files[0], usb=v("usb_"+team)||job.usb, link=v("link_"+team), memo=v("memo_"+team), status=v("next_"+team);let fileName=(job.rid||job.inid)+"_"+team+"_"+(db.uploads.filter(x=>(x.rid||x.inid)===(job.rid||job.inid)&&x.team===team).length+1);let reader=new FileReader();let saveUpload=(dataUrl,mime)=>{let up={uploadId:seq("UP"),rid:job.rid,inid:job.inid,unit:job.unit,team,fileName,original:f?f.name:"",mime:mime||"link",dataUrl:dataUrl||"",link,memo,usb,time:now(),status};db.uploads.unshift(up);job[stageField(team)]=fileName;job.usb=usb;job.execView=status;job.managerView=mapManager(status);job.status=job.managerView;addUsb(job,"WORKFLOW");if(status==="제출완료")job.stage=nextStage(team);if(team==="개발팀"&&status==="PO 회수")moveJobToPO(job,up);save();render();};if(f){reader.onload=e=>saveUpload(e.target.result,f.type);reader.readAsDataURL(f)}else saveUpload("","")}

function moveJobToPO(job,up){if(job.po==="Y")return alert("이미 처리되었습니다.");db.po.unshift({rid:job.rid,inid:job.inid,job:seq("JOB"),type:"디자인→마케팅→개발 최종",service:job.service,taxText:job.taxText,usb:job.usb,file:up.fileName,status:"PO적재"});job.po="Y";job.stage="PO";job.status="PO적재";notify("PO","개발팀 최종 산출물 PO 적재: "+(job.rid||job.inid),job.rid||job.inid)}

function createCampaignFromPay(id,customer,service){if(db.campaigns.some(x=>x.rid===id||x.inid===id))return;let campId=seq("CAMP");db.campaigns.unshift({campId,rid:id.startsWith("OUT-")?id:"",inid:id.startsWith("IN-")?id:"",customer,service,status:"모집중",applyLink:location.origin+location.pathname+"?campaign="+encodeURIComponent(campId),selected:"0",submitted:"0"})}function campaigns(){layout(`<div class="card narrow"><h2>블로그 체험단 관리</h2><p class="small">캠페인 ID는 체험단 모집 1건을 구분하는 내부번호입니다.</p><input id="campId" placeholder="캠페인 ID"><select id="campStatus"><option>모집중</option><option>선정</option><option>후기수집중</option><option>후기검수완료</option><option>완료</option></select><button class="primary" onclick="updateCampaign()">캠페인 상태 변경</button></div><div class="card"><h2>캠페인</h2>${table(db.campaigns,["campId","rid","inid","customer","service","status","applyLink","selected","submitted"])}</div><div class="card"><h2>신청자 / 후기 제출</h2>${table(db.applicants,["appId","campId","name","phone","blogUrl","instaUrl","schedule","wish","status","reviewUrl"])}</div>`)}function updateCampaign(){let c=db.campaigns.find(x=>x.campId===v("campId"));if(!c)return alert("캠페인 없음");c.status=v("campStatus");save();render()}function campaignApply(campId){topHeader.style.display="none";root.innerHTML=`<div class="client-hero"><div class="client-wrap"><div class="client-logo"><h1>HVIRAL</h1><p>블로그 체험단 신청</p></div><div class="client-card"><h3>체험단 신청</h3><input id="aname" placeholder="이름/닉네임"><input id="aphone" placeholder="연락처"><input id="ablog" placeholder="블로그 URL"><input id="ainsta" placeholder="인스타 URL 선택"><input id="aschedule" placeholder="방문 가능 일정"><input id="awish" placeholder="체험 희망 상품"><button class="primary" onclick="submitApplicant('${campId}')">신청하기</button></div></div></div>`}function submitApplicant(campId){db.applicants.unshift({appId:seq("APP"),campId,name:v("aname"),phone:v("aphone"),blogUrl:v("ablog"),instaUrl:v("ainsta"),schedule:v("aschedule"),wish:v("awish"),status:"신청완료",reviewUrl:""});save();alert("신청 완료");location.href=location.origin+location.pathname}
function hq(){layout(`<div class="card narrow"><h2>HVIRAL 사업본부</h2><input id="id" placeholder="Request ID 또는 IN-Request ID"><textarea id="internal" placeholder="회사용 견적요청서 치환내용"></textarea><input id="scope" placeholder="계약 범위"><input id="amount" placeholder="계약 예상금액"><button class="primary" onclick="hqToContract()">부대표 전달</button></div><div class="card">${table(db.hq,["kind","rid","inid","customer","industry","service","taxText","request","internal","scope","amount","status","vpSent"])}</div>`)}function hqToContract(){let id=v("id"),h=db.hq.find(x=>same(x,id));if(!h)return alert("사업본부 건 없음");h.internal=v("internal");h.scope=v("scope")||h.scope;h.amount=v("amount")||h.amount;h.status="부대표전달";h.vpSent="Y";db.contract.unshift({kind:h.kind,rid:h.rid,inid:h.inid,customer:h.customer,industry:h.industry,service:h.service,taxText:h.taxText,platforms:h.platforms,status:"계약대기",contractNo:seq("CT"),contractLink:"",scope:h.scope,amount:h.amount,balance:"",pay:"",signStatus:"서명대기"});save();render()}
function contract(){layout(`<div class="card narrow"><h2>부대표 검토ㆍ승인</h2><input id="id" placeholder="Request ID 또는 IN-Request ID"><input id="amount" placeholder="최종 계약금액"><input id="balance" placeholder="잔금"><input id="payer" placeholder="입금자명"><select id="pay"><option>계좌이체</option><option>현금</option><option>삼성페이</option><option>카드결제</option></select><button class="primary" onclick="issueContract()">계약서 링크 발행</button><button class="primary" onclick="balancePaid()">잔금 결제 완료</button><button class="primary" onclick="contractToExec()">전무이사 전달</button></div><div class="card">${table(db.contract,["rid","inid","customer","industry","service","taxText","status","contractNo","contractLink","scope","amount","balance","pay","signStatus"])}</div>`)}function issueContract(){let id=v("id"),c=db.contract.find(x=>same(x,id));if(!c)return alert("계약건 없음");c.contractLink=location.origin+location.pathname+"?contract="+encodeURIComponent(id);c.amount=v("amount")||c.amount;c.balance=v("balance")||c.balance;c.pay=v("pay");c.status="계약링크발행";db.links.push({type:"contract",id,status:"active",created:Date.now()});save();alert("고객에게 보낼 1회성 계약 링크:\n"+c.contractLink);render()}function customerContract(id){topHeader.style.display="none";let c=db.contract.find(x=>same(x,id))||{};root.innerHTML=`<main><div class="contract-paper"><h1>계약서</h1><p><b>계약번호:</b> ${c.contractNo||""}</p><p><b>ID:</b> ${id}</p><p><b>고객:</b> ${c.customer||""}</p><p><b>업종:</b> ${c.industry||""}</p><p><b>서비스:</b> ${c.service||""}</p><p><b>세금계산서 문구:</b> ${c.taxText||""}</p><p><b>범위:</b> ${c.scope||""}</p><p><b>금액:</b> ${c.amount||""}</p><input id="signer" placeholder="서명자"><canvas id="signCanvas" class="signbox"></canvas><button class="primary" onclick="finishSign('${id}')">전자서명 완료</button></div></main>`;initCanvas()}function initCanvas(){let c=document.getElementById("signCanvas"),ctx=c.getContext("2d");c.width=c.offsetWidth;c.height=c.offsetHeight;ctx.lineWidth=3;ctx.lineCap="round";let d=false,p=e=>{let r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}};c.onmousedown=c.ontouchstart=e=>{d=true;let q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y);e.preventDefault()};c.onmousemove=c.ontouchmove=e=>{if(!d)return;let q=p(e);ctx.lineTo(q.x,q.y);ctx.stroke();e.preventDefault()};c.onmouseup=c.onmouseleave=c.ontouchend=()=>d=false;signPad=c}function finishSign(id){let c=db.contract.find(x=>same(x,id));c.signStatus="서명완료";c.status="서명완료";c.signer=v("signer");c.signedAt=now();c.signature=signPad.toDataURL("image/png");expireLink("contract",id);save();alert("서명 완료");expiredPage()}function balancePaid(){let id=v("id"),c=db.contract.find(x=>same(x,id));if(!c)return alert("계약건 없음");c.balance=v("balance");c.pay=v("pay");c.status="잔금결제";db.finance.unshift({id:seq("PAY"),payType:"잔금",rid:c.rid,inid:c.inid,customer:c.customer,industry:c.industry,service:c.service,taxText:c.taxText,amount:c.balance,method:c.pay,payer:v("payer"),status:"확인대기"});createAccountRequests(c.rid||c.inid,c.customer,{service:c.service,platforms:c.platforms||"",taxText:c.taxText});save();render()}function contractToExec(){let id=v("id"),c=db.contract.find(x=>same(x,id));if(!c)return alert("계약건 없음");db.executive.unshift({rid:c.rid,inid:c.inid,service:c.service,contract:"계약완료",finance:"확인필요",audit:"확인필요",status:"전무대기",judge:"대기"});save();render()}
function finance(){layout(`<div class="card narrow"><h2>HVIRAL 경영지원팀</h2><p class="small">고객에게는 정관코드가 보이지 않습니다. 경영지원/감사 화면에서만 상품·결제·세금계산서 문구·내부 정관코드 매칭을 확인합니다.</p><input id="payId" placeholder="결제ID"><select id="status"><option>확인완료</option><option>이슈</option><option>확인대기</option></select><button class="primary" onclick="financeConfirm()">결제 확인 처리</button></div><div class="card">${table(db.finance,["id","payType","rid","inid","customer","industry","service","taxText","amount","method","payer","status"])}</div>`)}function financeConfirm(){let p=db.finance.find(x=>x.id===v("payId"));if(!p)return alert("결제ID 없음");p.status=v("status");if(p.status==="이슈")db.audit.unshift({id:seq("AUD"),rid:p.rid,inid:p.inid,type:p.payType,reason:"경영지원 결제 이슈",risk:"중",status:"검토중"});save();render()}function audit(){layout(`<div class="card narrow"><h2>감사 예외검토</h2><input id="audId" placeholder="감사ID"><select id="status"><option>검토완료</option><option>이슈</option><option>반려</option></select><input id="memo" placeholder="검토 메모"><button class="primary" onclick="auditConfirm()">감사 처리</button></div><div class="card">${table(db.audit,["id","rid","inid","type","reason","risk","status","memo"])}</div>`)}function auditConfirm(){let a=db.audit.find(x=>x.id===v("audId"));if(!a)return alert("감사ID 없음");a.status=v("status");a.memo=v("memo");save();render()}function executive(){layout(`<div class="card narrow"><h2>전무이사 실행ㆍ승인</h2><input id="id" placeholder="Request ID 또는 IN-Request ID"><select id="judge"><option>승인</option><option>보류</option><option>차단</option></select><button class="primary" onclick="execApprove()">실행 승인 → 디자인팀 작업생성</button></div><div class="card">${table(db.executive,["rid","inid","service","contract","finance","audit","status","judge"])}</div>`)}function execApprove(){let id=v("id"),e=db.executive.find(x=>same(x,id));if(!e)return alert("전무대기 건 없음");e.judge=v("judge");e.status=v("judge")==="승인"?"실행승인":"보류";let meta=combinedMeta((e.service||SERVICES[0].name).split(" + "));if(v("judge")==="승인")db.teamJobs.unshift({rid:e.rid,inid:e.inid,token:"",unit:seq("UNIT"),service:meta.service,taxText:meta.taxText,platforms:meta.platforms,stage:"디자인팀",execView:"작업시작",managerView:"작업요청",usb:"",status:"작업요청",designFile:"",marketingFile:"",devFile:"",po:"N"});save();render()}
function inbound(){layout(`<div class="card narrow"><h2>HVIRAL 접수처</h2><input id="customer" placeholder="고객명/코드"><input id="channel" placeholder="유입경로">${industryList("industryListI")}<h4>상품 복수 선택</h4>${serviceCheckboxes("isvc")}<textarea id="summary" placeholder="요청요약"></textarea><select id="urgent"><option>보통</option><option>긴급</option><option>낮음</option></select><button class="primary" onclick="addInbound()">IN-Request ID 발급 → 기획조정 자동전달</button></div><div class="card">${table(db.inbound,["inid","customer","channel","industry","product","taxText","summary","urgent","status"])}</div>`)}function addInbound(){let inid=seq("IN"),meta=combinedMeta(selectedServices("isvc"));db.inbound.unshift({inid,customer:v("customer"),channel:v("channel"),industry:v("industry"),product:meta.service,taxText:meta.taxText,platforms:meta.platforms,summary:v("summary"),urgent:v("urgent"),status:"접수완료"});db.planning.unshift({inid,customer:v("customer"),industry:v("industry"),product:meta.service,taxText:meta.taxText,platforms:meta.platforms,summary:v("summary"),route:"",status:"대기"});save();render()}function planning(){layout(`<div class="card narrow"><h2>HVIRAL 기획조정팀</h2><input id="inid" placeholder="IN-Request ID"><select id="route"><option>영업</option><option>대표토큰</option><option>보류</option><option>제외</option></select><button class="primary" onclick="routeInbound()">분배 처리</button></div><div class="card">${table(db.planning,["inid","customer","industry","product","taxText","summary","route","status"])}</div>`)}function routeInbound(){let p=db.planning.find(x=>x.inid===v("inid"));if(!p)return alert("기획조정 건 없음");p.route=v("route");p.status="분배완료";if(p.route==="영업")db.sales.unshift({kind:"인바운드",rid:"",inid:p.inid,customer:p.customer,industry:p.industry,kakao:"",service:p.product,taxText:p.taxText,platforms:p.platforms,sianLink:"",quoteLink:"",status:"영업대기",reserve:"",pay:"",hqSent:"N"});save();render()}
function notifications(){layout(`<div class="card narrow"><h2>알림센터</h2><button class="primary" onclick="requestNotifyPermission()">브라우저 알림 권한 요청</button><input id="nid" placeholder="관련 ID"><button class="primary" onclick="markRead()">관련 ID 알림 읽음처리</button></div><div class="card">${table(db.notifications,["time","role","msg","id","kind","read"])}</div>`)}function markRead(){let id=v("nid");db.notifications.forEach(n=>{if(n.id===id)n.read="Y"});save();render()}function logs(){layout(`<div class="card"><h2>감사 로그</h2>${table(db.logs,["time","user","role","type","msg","id","page"])}<button class="red primary" onclick="if(confirm('전체 초기화?')){localStorage.removeItem(KEY);location.reload()}">전체 초기화</button></div>`)}
render();
</script>
</body>
</html>
