function serviceCheckboxes(p){return `<div class="checkGrid">${SERVICES.map(s=>`<label class="checkItem"><input type="checkbox" class="${p}" value="${s.name}"><span>${s.name}<br><small>${s.tax}</small></span></label>`).join('')}</div>`}function selectedServices(p){let a=[...document.querySelectorAll('.'+p+':checked')].map(x=>x.value);return a.length?a:[SERVICES[0].name]}function combinedMeta(names){let items=names.map(n=>SERVICES.find(s=>s.name===n)||SERVICES[0]);return{service:names.join(' + '),taxText:[...new Set(items.map(s=>s.tax))].join(' / '),team:[...new Set(items.map(s=>s.team))].join(','),platforms:[...new Set(items.flatMap(s=>(s.platforms||'').split(',').filter(Boolean)))].join(',')}}function industryList(id){return `<input list="${id}" id="industry" placeholder="업종 선택 또는 검색"><datalist id="${id}">${INDUSTRIES.map(x=>`<option value="${x}">`).join('')}</datalist>`}

function lock(){layout(`<div class="card narrow"><h2>접근 제한</h2><input id="pw" type="password" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')check()"><button class="primary" onclick="check()">접속</button><p class="small">승인된 인원만 접근 가능합니다.</p></div>`)}function check(){if(v('pw')===PW){unlocked=true;sessionStorage.setItem(SESSION,'1');log('ACCESS','접속 성공');render()}else alert('비밀번호 틀림')}function login(){layout(`<div class="card narrow"><h2>HVIRAL 임ㆍ직원 로그인</h2><input id="name" value="이재현"><select id="role"><option>대표</option><option>관리자</option><option>운영지원</option><option>콜팀</option><option>전환전달팀</option><option>영업</option><option>본부장</option><option>부대표</option><option>경영지원</option><option>감사</option><option>전무이사</option><option>라인</option><option>PO</option><option>기획조정</option></select><button class="primary" onclick="user={name:v('name'),role:v('role')};log('LOGIN','로그인');requestNotifyPermission();render()">입장</button></div>`)}function logout(){user=null;unlocked=false;sessionStorage.removeItem(SESSION);render()}
function legalHtml(){return `<div class="legalBox"><div class="legalTop"><label class="legalItem"><input type="checkbox" id="law_all" onchange="toggleAllLegal(this)"><span><b>약관✔️ 전체 동의 및 확인</b><br>필수·선택 약관을 확인 하였습니다. 필수 동의가 없으면 다음 단계로 진행할 수 없습니다.</span></label></div>${LEGALS.map(l=>`<label class="legalItem"><input type="checkbox" class="lawChk" id="law_${l.id}" ${l.required?"data-required='1'":''}><span><b>${l.required?'[필수]':'[선택]'} ${l.title}</b><br><b>근거:</b> ${l.law}<br>${l.body}</span></label>`).join('')}</div>`}function toggleAllLegal(chk){document.querySelectorAll('.lawChk').forEach(x=>x.checked=chk.checked)}function requiredLegalOk(){let r=[...document.querySelectorAll("input[data-required='1']")];if(r.some(x=>!x.checked)){alert('필수 약관을 모두 확인해야 진행할 수 있습니다.');return false}return true}function legalSnapshot(){let o={};LEGALS.forEach(l=>o[l.id]=!!document.getElementById('law_'+l.id)?.checked);return JSON.stringify(o)}
function dash(){layout(`<div class="card"><h2>HVIRAL 전체 운영 흐름</h2><div class="flow"><span>복수 상품 선택</span><span>법률 약관 전체동의</span><span>BOUND 콜팀</span><span>대표 토큰</span><span>라인</span><span>USB 캐리어</span><span>PO</span><span>전환전달</span><span>예약금/잔금</span><span>경영지원</span><span>감사</span><span>계정권한</span><span>체험단</span></div></div><div class="card"><button class="primary" onclick="requestNotifyPermission()">브라우저 알림 권한 켜기</button><button class="primary" onclick="location.href='?client=1'">고객용 홈 화면 보기</button></div>`)}function serviceMaster(){layout(`<div class="card"><h2>서비스 상품 마스터</h2><p class="small">고객 화면에는 정관코드를 노출하지 않습니다. 경영지원팀에서 상품별 세금계산서 문구를 자동 분석합니다.</p>${table(SERVICES,['name','tax','team','platforms'])}</div>`)}function clientPreview(){layout(`<div class="card narrow"><h2>고객용 화면 미리보기</h2><button class="primary" onclick="location.href='?client=1'">고객용 화면 열기</button></div>`)}function admin(){layout(`<div class="card narrow"><h2>관리자 페이지</h2><button class="primary" onclick="notify('대표','관리자 점검 알림 테스트','ADMIN')">관리자 알림 테스트</button><button class="red" onclick="if(confirm('전체 데이터 초기화?')){localStorage.removeItem(KEY);location.reload()}">전체 데이터 초기화</button></div>`)}function clientHome(){topHeader.style.display='none';root.innerHTML=`<div class="client-hero"><div class="client-wrap"><div class="client-logo"><h1>HVIRAL</h1><p>간편 견적 · 계약 · 결제 안내</p></div><div class="client-card"><h3>견적 요청하기</h3><input id="cname" placeholder="고객명 / 상호"><input id="cphone" placeholder="연락처"><input list="industryList" id="cindustry" placeholder="업종 선택 또는 검색"><datalist id="industryList">${INDUSTRIES.map(x=>`<option value="${x}">`).join('')}</datalist><h4>상품 복수 선택</h4>${serviceCheckboxes('csvc')}<textarea id="ccontent" placeholder="요청 내용"></textarea>${legalHtml()}<button class="primary" onclick="clientRequest()">견적 요청 접수</button><p id="cmsg" class="small"></p></div><div class="client-card"><h3>계약서 확인</h3><input id="crid" placeholder="Request ID 또는 IN-Request ID"><button class="primary" onclick= function boundDB(){layout(`<div class="card narrow"><h2>BOUND 운영지원 DB</h2><input id="biz" placeholder="업체명"><input id="phone" placeholder="연락처"><input id="industry" placeholder="업종"><input id="area" placeholder="지역"><h4>상품 복수 선택</h4>${serviceCheckboxes('bsvc')}<select id="team"><option>callA</option><option>callB</option><option>callC</option><option>callD</option><option>callE</option></select><button class="primary" onclick="addBound()">타깃 등록·콜팀 배정</button></div><div class="card">${table(db.boundDB,['rid','biz','phone','industry','area','service','team','status'])}</div>`)}function addBound(){if(!req(['운영지원']))return;let rid=seq('OUT'),meta=combinedMeta(selectedServices('bsvc')),team=v('team');let row={rid,biz:v('biz'),phone:v('phone'),industry:v('industry'),area:v('area'),service:meta.service,taxText:meta.taxText,platforms:meta.platforms,team,status:'미연락'};db.boundDB.unshift(row);db[team].unshift({rid,biz:row.biz,phone:row.phone,service:meta.service,result:'미연락',memo:''});notify('콜팀','신규 콜 배정: '+rid,rid);save();render()}function callA(){callUI('callA','BOUND 콜팀 A')}function callB(){callUI('callB','BOUND 콜팀 B')}function callC(){callUI('callC','BOUND 콜팀 C')}function callD(){callUI('callD','BOUND 콜팀 D')}function callE(){callUI('callE','BOUND 콜팀 E')}function callUI(team,title){layout(`<div class="card narrow"><h2>${title}</h2><input id="rid" placeholder="Request ID"><select id="result"><option>동의</option><option>거절</option><option>부재</option><option>재접촉</option><option>차단</option></select><input id="memo" placeholder="콜메모"><button class="primary" onclick="saveCall('${team}')">콜결과 저장</button></div><div class="card">${table(db[team],['rid','biz','phone','service','result','memo'])}</div>`)}function saveCall(team){if(!req(['콜팀']))return;let rid=v('rid'),row=db[team].find(x=>x.rid===rid);if(!row)return alert('배정 ID 없음');row.result=v('result');row.memo=v('memo');let b=db.boundDB.find(x=>x.rid===rid);if(b)b.status=v('result');if(v('result')==='동의'&&!db.consent.some(x=>x.ri function token(){layout(`<div class="card narrow"><h2>대표 토큰·승인</h2><input id="rid" placeholder="Request ID 또는 IN-Request ID"><input id="customer" placeholder="고객/업체명"><h4>상품 복수 선택</h4>${serviceCheckboxes('tsvc')}<input id="work" placeholder="작업내용"><select id="decision"><option>승인</option><option>반려</option><option>보류</option></select><select id="line"><option>lineA</option><option>lineB</option></select><button class="primary" onclick="issueToken()">토큰 처리</button></div><div class="card">${table(db.token,['rid','inid','token','unit','customer','service','work','status','line'])}</div>`)}function issueToken(){let id=v('rid'),isIn=id.startsWith('IN-'),tk=seq('TK'),unit=seq('UNIT'),line=v('line'),meta=combinedMeta(selectedServices('tsvc'));db.token.unshift({rid:isIn?'':id,inid:isIn?id:'',token:tk,unit,customer:v('customer'),service:meta.service,taxText:meta.taxText,platforms:meta.platforms,work:v('work'),status:v('decision'),line});if(v('decision')==='승인')db[line].unshift({rid:isIn?'':id,inid:isIn?id:'',token:tk,unit,service:meta.service,taxText:meta.taxText,type:'라인작업',status:'작업요청',execView:'작업시작',managerView:'작업요청',usb:'',file:'',po:'N'});save();render()}function lineA(){lineUI('lineA','라인 ONE - A')}function lineB(){lineUI('lineB','라인 TWO - B')}function lineUI(key,title){layout(`<div class="card narrow"><h2>${title}</h2><select id="team"><option>HVIRAL 디자인팀</option><option>HVIRAL 개발팀</option><option>HVIRAL 마케팅 영업팀</option></select><input id="id" placeholder="Request ID 또는 IN-Request ID"><input id="usb" placeholder="USB NO 예: UNIT-01"><input id="file" placeholder="산출물 파일/링크"><select id="next"><option>작업시작</option><option>진행중</option><option>제출완료</option><option>반려</option><option>PO 회수</option></select><button class="primary" onclick="lineUpdate('${key}')">라인 상태 저장</button><button class="primary" onclick="lineToPO('${key}')">제출완료 → PO 적재</button></div><div class="card">${table(db[key],['rid','inid','token','unit','service','type','execView','managerView','usb','file','po'])}</div>`)}function mapManager(x){return{'작업시작':'작업요청','진행중':'처리중','제출완료':'제출완료','반려':'수정요청','PO 회수':'PO적재'}[x]||x}function lineUpdate(key){let id=v('id'),w=db[key].find(x=>same(x,id));if(!w)return alert('라인 작업 없음');w.execView=v('next');w.managerView=mapManager(v('next'));w.usb=v('usb')||w.usb;w.file=v('file')||w.file;addUsb(w,key);save();render()}function addUsb(w,line){let id=w.usb||w.unit;w.usb=id;let u=db.usb.find(x=>x.usb===id&&x.rid===(w.rid||w.inid));if(!u)db.usb.unshift({usb:id,rid:w.rid,inid:w.inid,line,service:w.service,execView:w.execView,managerView:w.managerView,file:w.file,status:w.managerView});else{u.execView=w.execView;u.managerView=w.managerView;u.file=w.file;u.status=w.managerView}}function lineToPO(key){let id=v('id'),w=db[key].find(x=>same(x,id));if(!w)return alert('라인 작업 없음');if(w.po==='Y')return alert('이미 처리되었습니다.');w.execView='PO 회수';w.managerView='PO적재';w.usb=v('usb')||w.usb;w.file=v('file')||w.file;w.po='Y';let job=seq('JOB');db.po.unshift({rid:w.rid,inid:w.inid,job,type:key==='lineA'?'라인 ONE - A':'라인 TWO - B',service:w.service,taxText:w.taxText,usb:w.usb,file:w.file,status:'PO적재'});db.transfer.unshift({rid:w.rid,inid:w.inid,job,file:w.file,status:'회수대기',customLink:'',callTeam:'',callSent:'N',salesAlert:'N'});addUsb(w,key);save();render()}function usbInterface(){let mode=user?.role==='라인'?'exec':'manager',sts=mode==='exec'?['작업시작','진행중','제출완료','반려','PO 회수']:['작업요청','처리중','제출완료','수정요청','PO적재'];layout(`<div class="card"><h2>인터페이스 USB 캐리어</h2><p class="small">실행 라인과 관리 방향은 같은 상태를 다르게 봅니다.</p></div><div class="card"><div class="usb-grid">${sts.map(s=>`<div class="usb-col"><b>${s}</b>${db.usb.filter(u=>(mode==='exec'?u.execView:u.managerView)===s).map(u=>`<div class="usb-card"><b>${u.usb}</b><br>${u.rid||u.inid}<br>${u.line}<br>${u.service||''}<br>${badge(mode==='exec'?u.execView:u.managerView)}</div>`).join('')}</div>`).join('')}</div></div>`)}function po(){layout(`<div class="card"><h2>프로젝트오피스 PO</h2>${table(db.po,['rid','inid','job','type','service','taxText','usb','file','status'])}</div>`)}function transfer(){layout(`<div class="card narrow"><h2>BOUND 전환전달팀</h2><input id="rid" placeholder="Request ID"><input id="customLink" placeholder="고객맞춤 시안 링크"><select id="callTeam"><option>callA</option><option>callB</option><option>callC</option><option>callD</option><option>callE</option></select><button class="primary" onclick="transferToCall()">치환 완료 → 콜팀 전달 + 영업 알림</button></div><div class="card">${table(db.transfer,['rid','inid','job','file','status','customLink','callTeam','callSent','salesAlert'])}</div>`)}function transferToCall(){let t=db.transfer.find(x=>x.rid===v('rid'));if(!t)return alert('전환전달 건 없음');if(t.status==='전달완료')return alert('이미 처리되었습니다.');t.customLink=v('customLink');t.callTeam=v('callTeam');t.status='전달완료';t.callSent='Y';t.salesAlert='Y';db.sales.unshift({kind:'아웃바운드',rid:t.rid,inid:'',customer:'',kakao:'',sianLink:t.customLink,quoteLink:'',status:'시안링크공유',reserve:'',pay:'',hqSent:'N'});save();render()}
function sales(){layout(`<div class="card narrow"><h2>HVIRAL 마케팅ㆍ영업팀</h2><select id="kind"><option>아웃바운드</option><option>인바운드</option></select><input id="id" placeholder="Request ID 또는 IN-Request ID"><input id="customer" placeholder="고객 식별명"><input id="kakao" placeholder="고객 카톡ID"><h4>상품 복수 선택</h4>${serviceCheckboxes('ssvc')}<button class="primary" onclick="makeQuote()">고객용 견적/예약금 링크 생성</button><button class="primary" onclick="sendHQ()">HVIRAL 사업본부 자동전달</button></div><div class="card">${table(db.sales,['kind','rid','inid','customer','kakao','service','sianLink','quoteLink','status','reserve','pay','hqSent'])}</div>`)}function makeQuote(){let id=v('id'),isIn=id.startsWith('IN-'),link=location.origin+location.pathname+'?quote='+encodeURIComponent(id),s=db.sales.find(x=>same(x,id)),meta=combinedMeta(selectedServices('ssvc'));if(!s){s={kind:v('kind'),rid:isIn?'':id,inid:isIn?id:'',sianLink:''};db.sales.unshift(s)}Object.assign(s,{customer:v('customer'),kakao:v('kakao'),service:meta.service,taxText:meta.taxText,platforms:meta.platforms,quoteLink:link,status:'고객작성대기'});save();alert('고객에게 보낼 링크:\n'+link);render()}function customerQuote(id){topHeader.style.display='none';root.innerHTML=`<div class="client-hero"><div class="client-wrap"><div class="client-logo"><h1>HVIRAL</h1><p>견적요청 · 예약금 결제</p></div><div class="client-card"><h3>고객용 견적요청</h3><input id="qname" placeholder="고객명/상호"><input id="qphone" placeholder="연락처"><input list="industryListQ" id="qindustry" placeholder="업종 선택 또는 검색"><datalist id="industryListQ">${INDUSTRIES.map(x=>`<option value="${x}">`).join('')}</datalist><h4>상품 복수 선택</h4>${serviceCheckboxes('qsvc')}<textarea id="qcontent" placeholder="요청내용"></textarea><input id="qreserve" placeholder="예약금"><select id="qpay"><option>삼성페이</option><option>카드결제</option><option>계좌이체</option><option>현금</option></select>${legalHtml()}<button class="primary" onclick="submitQuotePay('${id}')">전체 안내 확인 후 예약금 결제 완료</button><p class="small">index 확인용 결제 시뮬레이션입니다.</p></div></div></div>`}function submitQuotePay(id){if(!requiredLegalOk())return;let isIn=id.startsWith('IN-'),s=db.sales.find(x=>same(x,id)),meta=combinedMeta(selectedServices('qsvc'));if(!s){s={kind:isIn?'인바운드':'아웃바운드',rid:isIn?'':id,inid:isIn?id:''};db.sales.unshift(s)}Object.assign(s,{customer:v('qname'),industry:v('qindustry'),service:meta.service,taxText:meta.taxText,platforms:meta.platforms,status:'예약금결제',reserve:v('qreserve'),pay:v('qpay'),hqSent:'Y',legal:legalSnapshot()});db.finance.unshift({id:seq('PAY'),payType:'예약금',rid:s.rid,inid:s.inid,customer:v('qname'),industry:v('qindustry'),service:meta.service,taxText:meta.taxText,amount:v('qreserve'),method:v('qpay'),status:'확인대기'});db.hq.unshift({kind:s.kind,rid:s.rid,inid:s.inid,customer:v('qname'),industry:v('qindustry'),service:meta.service,taxText:meta.taxText,platforms:meta.platforms,request:`연락처:${v('qphone')} / 요청:${v('qcontent')}`,internal:'치환 대기',scope:meta.service,amount:v('qreserve'),status:'본부장검토',vpSent:'N'});createAccountRequests(s.rid||s.inid,v('qname'),meta);if(meta.service.includes('블로그 체험단'))createCampaignFromPay(s.rid||s.inid,v('qname'),meta.service);save();alert('예약금 결제 완료');location.href=location.origin+location.pathname}function sendHQ(){let id=v('id'),s=db.sales.find(x=>same(x,id));if(!s)return alert('영업건 없음');db.hq.unshift({kind:s.kind,rid:s.rid,inid:s.inid,customer:s.customer,service:s.service,taxText:s.taxText,request:'영업 수동 전달',internal:'치환 대기',scope:s.service,amount:s.reserve,status:'본부장검토',vpSent:'N'});s.hqSent='Y';save();render()}
function createAccountRequests(id,customer,meta){(meta.platforms||'').split(',').filter(Boolean).forEach(p=>{if(db.accountRequests.some(x=>(x.rid===id||x.inid===id)&&x.platform===p))return;let g=PLATFORM_GUIDES[p]||[p,'#','관리자 권한 요청'],accessId=seq('ACC');db.accountRequests.unshift({accessId,rid:id.startsWith('OUT-')?id:'',inid:id.startsWith('IN-')?id:'',customer,service:meta.service,platform:p,platformLabel:g[0],accessType:p==='EXPERIENCE_CAMPAIGN'?'모집링크':'관리자초대',requestLink:location.origin+location.pathname+'?account='+encodeURIComponent(accessId+'_'+p+'_'+id),status:'고객초대대기',owner:'영업/전환전달 확인',hviralAccount:'hviral@hviral.co.kr',guide:g[2],platformUrl:g[1]})})}function accountAccess(){layout(`<div class="card narrow"><h2>플랫폼 계정권한 관리</h2><p class="small">권한요청 ID는 고객에게 플랫폼 관리자 초대를 요청하기 위해 자동 생성되는 내부 관리번호입니다. 고객초대대기는 고객이 아직 하비럴 계정을 초대하지 않은 상태입니다. 담당 업무는 영업/전환전달팀이 확인하고, 실제 작업 가능 여부는 라인 투입 전 확인합니다.</p><input id="accId" placeholder="권한요청 ID"><select id="accStatus"><option>고객초대대기</option><option>초대완료</option><option>하비럴수락완료</option><option>작업가능</option><option>권한회수</option><option>보류</option></select><button class="primary" onclick="updateAccountStatus()">상태 변경</button></div><div class="card">${table(db.accountRequests,['accessId','rid','inid','customer','service','platformLabel','accessType','owner','hviralAccount','status','requestLink','guide'])}</div>`)}function updateAccountStatus(){let a=db.accountRequests.find(x=>x.accessId===v('accId'));if(!a)return alert('권한요청 ID 없음');a.status=v('accStatus');save();render()}function customerAccountGuide(token){topHeader.style.display='none';let parts=decodeURIComponent(token).split('_'),p=parts[1],id=parts.slice(2).join('_'),g=PLATFORM_GUIDES[p]||[p,'#','관리자 권한 요청'];root.innerHTML=`<div class="client-hero"><div class="client-wrap"><div class="client-logo"><h1>HVIRAL</h1><p>계정 권한 요청 안내</p></div><div class="client-card"><h3>${g[0]}</h3><p class="small"><b>Request:</b> ${id}</p><p>${g[2]}</p><p class="small">아이디/비밀번호 공유가 아닌 관리자 초대 또는 권한 위임 방식입니다.</p>${g[1]==='#'?'':`<a class="linkBtn" href="${g[1]}" target="_blank">플랫폼 관리 화면으로 이동</a>`}<button class="primary" onclick="alert('초대 완료 확인 요청이 접수되었습니다.');location.href=location.origin+location.pathname">초대 완료</button></div></div></div>`}
function createCampaignFromPay(id,customer,service){if(db.campaigns.some(x=>x.rid===id||x.inid===id))return;let campId=seq('CAMP');db.campaigns.unshift({campId,rid:id.startsWith('OUT-')?id:'',inid:id.startsWith('IN-')?id:'',customer,service,status:'모집중',applyLink:location.origin+location.pathname+'?campaign='+encodeURIComponent(campId),selected:'0',submitted:'0'})}function campaigns(){layout(`<div class="card narrow"><h2>블로그 체험단 관리</h2><p class="small">캠페인 ID는 체험단 모집 1건을 구분하는 내부번호입니다. 고객 결제 후 블로그 체험단 상품이면 자동 생성되고, 신청자 모집 링크가 만들어집니다.</p><input id="campId" placeholder="캠페인 ID"><select id="campStatus"><option>모집중</option><option>선정</option><option>후기수집중</option><option>후기검수완료</option><option>완료</option></select><button class="primary" onclick="updateCampaign()">캠페인 상태 변경</button></div><div class="card"><h2>캠페인</h2>${table(db.campaigns,['campId','rid','inid','customer','service','status','applyLink','selected','submitted'])}</div><div class="card"><h2>신청자 / 후기 제출</h2>${table(db.applicants,['appId','campId','name','phone','blogUrl','instaUrl','schedule','wish','status','reviewUrl'])}</div>`)}function updateCampaign(){let c=db.campaigns.find(x=>x.campId===v('campId'));if(!c)return alert('캠페인 없음');c.status=v('campStatus');save();render()}function campaignApply(campId){topHeader.style.display='none';root.innerHTML=`<div class="client-hero"><div class="client-wrap"><div class="client-logo"><h1>HVIRAL</h1><p>블로그 체험단 신청</p></div><div class="client-card"><h3>체험단 신청</h3><input id="aname" placeholder="이름/닉네임"><input id="aphone" placeholder="연락처"><input id="ablog" placeholder="블로그 URL"><input id="ainsta" placeholder="인스타 URL 선택"><input id="aschedule" placeholder="방문 가능 일정"><input id="awish" placeholder="체험 희망 상품"><button class="primary" onclick="submitApplicant('${campId}')">신청하기</button></div></div></div>`}function submitApplicant(campId){db.applicants.unshift({appId:seq('APP'),campId,name:v('aname'),phone:v('aphone'),blogUrl:v('ablog'),instaUrl:v('ainsta'),schedule:v('aschedule'),wish:v('awish'),status:'신청완료',reviewUrl:''});save();alert('신청 완료');location.href=location.origin+location.pathname}
function hq(){layout(`<div class="card narrow"><h2>HVIRAL 사업본부</h2><input id="id" placeholder="Request ID 또는 IN-Request ID"><textarea id="internal" placeholder="회사용 견적요청서 치환내용"></textarea><input id="scope" placeholder="계약 범위"><input id="amount" placeholder="계약 예상금액"><button class="primary" onclick="hqToContract()">부대표 전달</button></div><div class="card">${table(db.hq,['kind','rid','inid','customer','industry','service','taxText','request','internal','scope','amount','status','vpSent'])}</div>`)}function hqToContract(){let id=v('id'),h=db.hq.find(x=>same(x,id));if(!h)return alert('사업본부 건 없음');h.internal=v('internal');h.scope=v('scope')||h.scope;h.amount=v('amount')||h.amount;h.status='부대표전달';h.vpSent='Y';db.contract.unshift({kind:h.kind,rid:h.rid,inid:h.inid,customer:h.customer,industry:h.industry,service:h.service,taxText:h.taxText,platforms:h.platforms,status:'계약대기',contractNo:seq('CT'),contractLink:'',scope:h.scope,amount:h.amount,balance:'',pay:'',signStatus:'서명대기'});save();render()}function contract(){layout(`<div class="card narrow"><h2>부대표 검토ㆍ승인</h2><input id="id" placeholder="Request ID 또는 IN-Request ID"><input id="amount" placeholder="최종 계약금액"><input id="balance" placeholder="잔금"><select id="pay"><option>삼성페이</option><option>카드결제</option><option>계좌이체</option><option>현금</option></select><button class="primary" onclick="issueContract()">계약서 링크 발행</button><button class="primary" onclick="balancePaid()">잔금 결제 완료</button><button class="primary" onclick="contractToExec()">전무이사 전달</button></div><div class="card">${table(db.contract,['rid','inid','customer','industry','service','taxText','status','contractNo','contractLink','scope','amount','balance','pay','signStatus'])}</div>`)}function issueContract(){let id=v('id'),c=db.contract.find(x=>same(x,id));if(!c)return alert('계약건 없음');c.contractLink=location.origin+location.pathname+'?contract='+encodeURIComponent(id);c.amount=v('amount')||c.amount;c.balance=v('balance')||c.balance;c.pay=v('pay');c.status='계약링크발행';save();alert(c.contractLink);render()}function customerContract(id){topHeader.style.display='none';let c=db.contract.find(x=>same(x,id))||{};root.innerHTML=`<main><div class="contract-paper"><h1>계약서</h1><p><b>계약번호:</b> ${c.contractNo||''}</p><p><b>ID:</b> ${id}</p><p><b>고객:</b> ${c.customer||''}</p><p><b>업종:</b> ${c.industry||''}</p><p><b>서비스:</b> ${c.service||''}</p><p><b>세금계산서 문구:</b> ${c.taxText||''}</p><p><b>범위:</b> ${c.scope||''}</p><p><b>금액:</b> ${c.amount||''}</p><input id="signer" placeholder="서명자"><canvas id="signCanvas" class="signbox"></canvas><button class="primary" onclick="finishSign('${id}')">전자서명 완료</button></div></main>`;initCanvas()}function initCanvas(){let c=document.getElementById('signCanvas'),ctx=c.getContext('2d');c.width=c.offsetWidth;c.height=c.offsetHeight;ctx.lineWidth=3;ctx.lineCap='round';let d=false,p=e=>{let r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}};c.onmousedown=c.ontouchstart=e=>{d=true;let q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y);e.preventDefault()};c.onmousemove=c.ontouchmove=e=>{if(!d)return;let q=p(e);ctx.lineTo(q.x,q.y);ctx.stroke();e.preventDefault()};c.onmouseup=c.onmouseleave=c.ontouchend=()=>d=false;signPad=c}function finishSign(id){let c=db.contract.find(x=>same(x,id));c.signStatus='서명완료';c.status='서명완료';c.signer=v('signer');c.signedAt=now();c.signature=signPad.toDataURL('image/png');save();alert('서명 완료')}function balancePaid(){let id=v('id'),c=db.contract.find(x=>same(x,id));if(!c)return alert('계약건 없음');c.balance=v('balance');c.pay=v('pay');c.status='잔금결제';db.finance.unshift({id:seq('PAY'),payType:'잔금',rid:c.rid,inid:c.inid,customer:c.customer,industry:c.industry,service:c.service,taxText:c.taxText,amount:c.balance,method:c.pay,status:'확인대기'});createAccountRequests(c.rid||c.inid,c.customer,{service:c.service,platforms:c.platforms||'',taxText:c.taxText});save();render()}function contractToExec(){let id=v('id'),c=db.contract.find(x=>same(x,id));if(!c)return alert('계약건 없음');db.executive.unshift({rid:c.rid,inid:c.inid,service:c.service,contract:'계약완료',finance:'확인필요',audit:'확인필요',status:'전무대기',judge:'대기'});save();render()}function finance(){layout(`<div class="card narrow"><h2>HVIRAL 경영지원팀</h2><p class="small">정관코드/세금계산서 문구는 이 단계에서 상품 기준으로 자동 분석됩니다.</p><input id="payId" placeholder="결제ID"><select id="status"><option>확인완료</option><option>이슈</option><option>확인대기</option></select><button class="primary" onclick="financeConfirm()">결제 확인 처리</button></div><div class="card">${table(db.finance,['id','payType','rid','inid','customer','industry','service','taxText','amount','method','status'])}</div>`)}function financeConfirm(){let p=db.finance.find(x=>x.id===v('payId'));if(!p)return alert('결제ID 없음');p.status=v('status');if(p.status==='이슈')db.audit.unshift({id:seq('AUD'),rid:p.rid,inid:p.inid,type:p.payType,reason:'경영지원 결제 이슈',risk:'중',status:'검토중'});save();render()}function audit(){layout(`<div class="card narrow"><h2>감사 예외검토</h2><input id="audId" placeholder="감사ID"><select id="status"><option>검토완료</option><option>이슈</option><option>반려</option></select><input id="memo" placeholder="검토 메모"><button class="primary" onclick="auditConfirm()">감사 처리</button></div><div class="card">${table(db.audit,['id','rid','inid','type','reason','risk','status','memo'])}</div>`)}function auditConfirm(){let a=db.audit.find(x=>x.id===v('audId'));if(!a)return alert('감사ID 없음');a.status=v('status');a.memo=v('memo');save();render()}function executive(){layout(`<div class="card narrow"><h2>전무이사 실행ㆍ승인</h2><input id="id" placeholder="Request ID 또는 IN-Request ID"><select id="judge"><option>승인</option><option>보류</option><option>차단</option></select><select id="line"><option>lineA</option><option>lineB</option></select><button class="primary" onclick="execApprove()">실행 승인 → 라인 작업생성</button></div><div class="card">${table(db.executive,['rid','inid','service','contract','finance','audit','status','judge'])}</div>`)}function execApprove(){let id=v('id'),e=db.executive.find(x=>same(x,id));if(!e)return alert('전무대기 건 없음');e.judge=v('judge');e.status=v('judge')==='승인'?'실행승인':'보류';let line=v('line'),meta=combinedMeta((e.service||SERVICES[0].name).split(' + '));if(v('judge')==='승인')db[line].unshift({rid:e.rid,inid:e.inid,token:'',unit:seq('UNIT'),service:meta.service,taxText:meta.taxText,type:'계약후작업',status:'작업요청',execView:'작업시작',managerView:'작업요청',usb:'',file:'',po:'N'});save();render()}
function inbound(){layout(`<div class="card narrow"><h2>HVIRAL 접수처</h2><input id="customer" placeholder="고객명/코드"><input id="channel" placeholder="유입경로"><input list="industryListI" id="industry" placeholder="업종 선택 또는 검색"><datalist id="industryListI">${INDUSTRIES.map(x=>`<option value="${x}">`).join('')}</datalist><h4>상품 복수 선택</h4>${serviceCheckboxes('isvc')}<textarea id="summary" placeholder="요청요약"></textarea><select id="urgent"><option>보통</option><option>긴급</option><option>낮음</option></select><button class="primary" onclick="addInbound()">IN-Request ID 발급 → 기획조정 자동전달</button></div><div class="card">${table(db.inbound,['inid','customer','channel','industry','product','taxText','summary','urgent','status'])}</div>`)}function addInbound(){let inid=seq('IN'),meta=combinedMeta(selectedServices('isvc'));db.inbound.unshift({inid,customer:v('customer'),channel:v('channel'),industry:v('industry'),product:meta.service,taxText:meta.taxText,summary:v('summary'),urgent:v('urgent'),status:'접수완료'});db.planning.unshift({inid,customer:v('customer'),industry:v('industry'),product:meta.service,taxText:meta.taxText,summary:v('summary'),route:'',status:'대기'});save();render()}function planning(){layout(`<div class="card narrow"><h2>HVIRAL 기획조정팀</h2><input id="inid" placeholder="IN-Request ID"><select id="route"><option>영업</option><option>대표토큰</option><option>보류</option><option>제외</option></select><button class="primary" onclick="routeInbound()">분배 처리</button></div><div class="card">${table(db.planning,['inid','customer','industry','product','taxText','summary','route','status'])}</div>`)}function routeInbound(){let p=db.planning.find(x=>x.inid===v('inid'));if(!p)return alert('기획조정 건 없음');p.route=v('route');p.status='분배완료';if(p.route==='영업')db.sales.unshift({kind:'인바운드',rid:'',inid:p.inid,customer:p.customer,industry:p.industry,kakao:'',service:p.product,taxText:p.taxText,sianLink:'',quoteLink:'',status:'영업대기',reserve:'',pay:'',hqSent:'N'});save();render()}function notifications(){layout(`<div class="card narrow"><h2>알림센터</h2><button class="primary" onclick="requestNotifyPermission()">브라우저 알림 권한 요청</button><input id="nid" placeholder="관련 ID"><button class="primary" onclick="markRead()">관련 ID 알림 읽음처리</button></div><div class="card">${table(db.notifications,['time','role','msg','id','kind','read'])}</div>`)}function markRead(){let id=v('nid');db.notifications.forEach(n=>{if(n.id===id)n.read='Y'});save();render()}function logs(){layout(`<div class="card"><h2>감사 로그</h2>${table(db.logs,['time','user','role','type','msg','id','page'])}<button class="red" onclick="if(confirm('전체 초기화?')){localStorage.removeItem(KEY);location.reload()}">전체 초기화</button></div>`)}render();</script></body></html
