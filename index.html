<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HVIRAL ERP·CRM</title>

<style>
body{margin:0;font-family:Arial;background:#f5f6fa}
header{height:60px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 15px}
.app{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 60px)}
nav{background:#1f2a44;padding:10px}
nav button{width:100%;padding:12px;margin:4px 0;border:0;border-radius:10px;background:#2e3d5f;color:#fff;text-align:left}
nav button.on{background:#4f6dff}
main{padding:15px;overflow:auto}
.card{background:#fff;padding:15px;border-radius:15px;margin-bottom:15px}
input,select{width:100%;padding:12px;margin-bottom:10px;border:1px solid #ddd;border-radius:10px}
button.primary{width:100%;padding:12px;background:#4f6dff;color:#fff;border:0;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{border-bottom:1px solid #eee;padding:8px;text-align:left}
th{background:#f0f3fa}
</style>
</head>

<body>
<div id="root"></div>

<script>
const KEY="HVIRAL_FINAL";
let unlocked=false,user=null,view="dash";
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{
outDB:[],call:[],consent:[],token:[],execution:[],po:[]
};

const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const now=()=>new Date().toLocaleString();
const id=(p)=>p+"-"+Date.now();

function lock(){
root.innerHTML=`
<div style="display:flex;height:100vh;align-items:center;justify-content:center">
<div class="card">
<h2>접근 제한</h2>
<input id="pw" placeholder="비밀번호">
<button class="primary" onclick="check()">접속</button>
</div></div>`;
}

function check(){
if(pw.value==="2580"){unlocked=true;render();}
else alert("비번 틀림");
}

function login(){
root.innerHTML=`
<div style="display:flex;height:100vh;align-items:center;justify-content:center">
<div class="card">
<h2>로그인</h2>
<input id="name" value="이재현">
<select id="role"><option>대표</option><option>콜팀</option><option>실행팀</option></select>
<button class="primary" onclick="user={name:name.value,role:role.value};render()">입장</button>
</div></div>`;
}

function layout(html){
root.innerHTML=`
<header>${user.name} <button onclick="user=null;render()">로그아웃</button></header>
<div class="app">
<nav>
<button onclick="view='dash';render()">대시</button>
<button onclick="view='out';render()">DB</button>
<button onclick="view='call';render()">콜</button>
<button onclick="view='token';render()">토큰</button>
<button onclick="view='exec';render()">실행</button>
<button onclick="view='po';render()">PO</button>
</nav>
<main>${html}</main>
</div>`;
}

function dash(){
layout(`<div class="card">
<h2>흐름</h2>
BOUND → 콜 → 토큰 → 실행 → PO
</div>`);
}

function out(){
layout(`
<div class="card">
<input id="biz" placeholder="업체명">
<button class="primary" onclick="addOut()">등록</button>
</div>
${table(db.outDB)}
`);
}
function addOut(){
db.outDB.unshift({id:id("OUT"),업체명:biz.value,상태:"대기"});
save();render();
}

function call(){
layout(`
<div class="card">
<input id="rid" placeholder="ID">
<select id="res"><option>동의</option><option>거절</option></select>
<button class="primary" onclick="addCall()">저장</button>
</div>
${table(db.call)}
`);
}
function addCall(){
db.call.unshift({id:rid.value,결과:res.value});
db.outDB.forEach(x=>{if(x.id===rid.value)x.상태="콜완료"});
if(res.value==="동의"){
db.token.unshift({id:rid.value,상태:"대기"});
}
save();render();
}

function token(){
layout(`
<div class="card">
<input id="tid" placeholder="ID">
<button class="primary" onclick="approve()">승인</button>
</div>
${table(db.token)}
`);
}
function approve(){
db.token.forEach(x=>{
if(x.id===tid.value){
x.상태="승인";
db.execution.unshift({id:x.id,상태:"작업요청"});
}
});
save();render();
}

function exec(){
layout(`
<div class="card">
<input id="eid" placeholder="ID">
<button class="primary" onclick="finish()">완료</button>
</div>
${table(db.execution)}
`);
}
function finish(){
db.execution.forEach(x=>{
if(x.id===eid.value){
x.상태="완료";
db.po.unshift({id:x.id,상태:"적재"});
}
});
save();render();
}

function po(){
layout(`<div class="card">${table(db.po)}</div>`);
}

function table(arr){
if(!arr.length)return "<div class='card'>데이터없음</div>";
let keys=Object.keys(arr[0]);
return `<div class="card"><table>
<tr>${keys.map(k=>"<th>"+k+"</th>").join("")}</tr>
${arr.map(r=>"<tr>"+keys.map(k=>"<td>"+r[k]+"</td>").join("")+"</tr>").join("")}
</table></div>`;
}

function render(){
if(!unlocked)return lock();
if(!user)return login();
({dash,out,call,token,exec,po}[view])();
}
render();
</script>
</body>
</html>
