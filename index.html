<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>HVIRAL FINAL FULL SYSTEM</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font-family:Arial;background:#f4f6fb}
header{background:#020617;color:#fff;padding:16px}
nav{display:flex;flex-wrap:wrap;background:#111827}
nav button{flex:1;padding:10px;border:0;color:#fff;background:#1f2937}
nav button:hover{background:#2563eb}
section{display:none;padding:18px}
.active{display:block}
input,select{width:100%;padding:7px;margin-bottom:6px}
button{padding:7px;background:#2563eb;color:#fff;border:0;margin:3px}
table{width:100%;background:#fff;border-collapse:collapse;margin-top:6px}
td,th{padding:6px;border-bottom:1px solid #ddd}
</style>
</head>
<body>

<header><h2>HVIRAL FULL ERP SYSTEM</h2></header>

<nav>
<button onclick="show('lead')">동의자</button>
<button onclick="show('call')">콜팀</button>
<button onclick="show('crm')">CRM</button>
<button onclick="show('request')">Request</button>
<button onclick="show('token')">토큰</button>
<button onclick="show('contract')">계약</button>
<button onclick="show('unit')">실행</button>
<button onclick="show('po')">PO</button>
<button onclick="show('usb')">USB</button>
<button onclick="show('domain')">도메인</button>
<button onclick="show('log')">로그</button>
</nav>

<!-- 동의자 -->
<section id="lead" class="active">
<h3>동의자</h3>
<input id="lName" placeholder="이름">
<input id="lPhone" placeholder="연락처">
<select id="lAgree"><option>대기</option><option>동의</option></select>
<button onclick="addLead()">등록</button>
<table id="leadTable"></table>
</section>

<!-- 콜팀 -->
<section id="call">
<h3>콜팀</h3>
<select id="callLead"></select>
<select id="callStatus">
<option>미콜</option><option>관심</option><option>동의</option><option>거절</option>
</select>
<button onclick="saveCall()">저장</button>
<table id="callTable"></table>
</section>

<!-- CRM -->
<section id="crm">
<h3>CRM</h3>
<input id="cName" placeholder="고객명">
<button onclick="addCRM()">등록</button>
<table id="crmTable"></table>
</section>

<!-- Request -->
<section id="request">
<h3>Request</h3>
<select id="rType">
<option>OUT</option>
<option>IN</option>
</select>
<select id="rTarget"></select>
<button onclick="addRequest()">생성</button>
<table id="reqTable"></table>
</section>

<!-- 토큰 -->
<section id="token">
<h3>토큰</h3>
<select id="tReq"></select>
<select id="tStatus"><option>대기</option><option>승인</option><option>반려</option></select>
<button onclick="addToken()">저장</button>
<table id="tokenTable"></table>
</section>

<!-- 계약 -->
<section id="contract">
<h3>계약</h3>
<select id="kReq"></select>
<input id="kMoney" placeholder="금액">
<input id="kPaid" placeholder="입금">
<select id="kAudit"><option>대기</option><option>확인</option></select>
<button onclick="addContract()">저장</button>
<table id="contractTable"></table>
</section>

<!-- 실행 -->
<section id="unit">
<h3>실행 (차단 구조)</h3>
<select id="uReq"></select>
<button onclick="addUnit()">실행</button>
<table id="unitTable"></table>
</section>

<!-- PO -->
<section id="po">
<h3>PO</h3>
<select id="pUnit"></select>
<input id="pLoc" placeholder="보관위치">
<button onclick="addPO()">저장</button>
<table id="poTable"></table>
</section>

<!-- USB -->
<section id="usb">
<h3>USB</h3>
<input id="usbId" placeholder="USB ID">
<select id="usbStatus"><option>대기</option><option>사용중</option></select>
<button onclick="addUSB()">저장</button>
<table id="usbTable"></table>
</section>

<!-- 도메인 -->
<section id="domain">
<h3>도메인</h3>
<input id="dName" placeholder="도메인">
<button onclick="addDomain()">저장</button>
<table id="domainTable"></table>
</section>

<!-- 로그 -->
<section id="log">
<h3>로그</h3>
<table id="logTable"></table>
</section>

<script>
let db=JSON.parse(localStorage.getItem("hv_full_final")||'{"lead":[],"call":[],"crm":[],"req":[],"token":[],"contract":[],"unit":[],"po":[],"usb":[],"domain":[],"log":[]}')

function save(){localStorage.setItem("hv_full_final",JSON.stringify(db));render()}
function log(t){db.log.unshift({time:new Date().toLocaleTimeString(),t});save()}

function show(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"))
document.getElementById(id).classList.add("active")
}

function addLead(){db.lead.push({id:Date.now(),name:lName.value,agree:lAgree.value});log("동의자");save()}

function saveCall(){
let l=db.lead.find(x=>x.id==callLead.value)
l.call=callStatus.value
if(callStatus.value=="동의") l.agree="동의"
log("콜");save()
}

function addCRM(){db.crm.push({id:Date.now(),name:cName.value});log("CRM");save()}

function addRequest(){
let target
if(rType.value=="OUT"){
target=db.lead.find(x=>x.id==rTarget.value)
if(!target||target.agree!="동의") return alert("동의자만")
}else{
target=db.crm.find(x=>x.id==rTarget.value)
}
db.req.push({id:Date.now(),name:target.name})
log("Request");save()
}

function addToken(){
let r=db.req.find(x=>x.id==tReq.value)
db.token.push({id:Date.now(),req:r.id,status:tStatus.value})
log("토큰");save()
}

function addContract(){
let r=db.req.find(x=>x.id==kReq.value)
db.contract.push({id:Date.now(),req:r.id,paid:kPaid.value,audit:kAudit.value})
log("계약");save()
}

function canExec(id){
let t=db.token.find(x=>x.req==id && x.status=="승인")
let c=db.contract.find(x=>x.req==id && x.paid>0 && x.audit=="확인")
return t&&c
}

function addUnit(){
let r=db.req.find(x=>x.id==uReq.value)
if(!canExec(r.id)) return alert("차단됨")
db.unit.push({id:Date.now(),req:r.id})
log("실행");save()
}

function addPO(){
let u=db.unit.find(x=>x.id==pUnit.value)
db.po.push({id:Date.now(),unit:u.id,loc:pLoc.value})
log("PO");save()
}

function addUSB(){db.usb.push({id:usbId.value,status:usbStatus.value});log("USB");save()}
function addDomain(){db.domain.push({id:dName.value});log("도메인");save()}

function render(){
leadTable.innerHTML=db.lead.map(l=>`<tr><td>${l.name}</td><td>${l.agree}</td></tr>`).join("")
callTable.innerHTML=db.lead.map(l=>`<tr><td>${l.name}</td><td>${l.call||""}</td></tr>`).join("")
crmTable.innerHTML=db.crm.map(c=>`<tr><td>${c.name}</td></tr>`).join("")
reqTable.innerHTML=db.req.map(r=>`<tr><td>${r.name}</td></tr>`).join("")
tokenTable.innerHTML=db.token.map(t=>`<tr><td>${t.req}</td><td>${t.status}</td></tr>`).join("")
contractTable.innerHTML=db.contract.map(c=>`<tr><td>${c.req}</td><td>${c.paid}</td><td>${c.audit}</td></tr>`).join("")
unitTable.innerHTML=db.unit.map(u=>`<tr><td>${u.req}</td></tr>`).join("")
poTable.innerHTML=db.po.map(p=>`<tr><td>${p.unit}</td><td>${p.loc}</td></tr>`).join("")
usbTable.innerHTML=db.usb.map(u=>`<tr><td>${u.id}</td><td>${u.status}</td></tr>`).join("")
domainTable.innerHTML=db.domain.map(d=>`<tr><td>${d.id}</td></tr>`).join("")
logTable.innerHTML=db.log.map(l=>`<tr><td>${l.time}</td><td>${l.t}</td></tr>`).join("")

rTarget.innerHTML=(rType.value=="OUT"?db.lead:db.crm).map(x=>`<option value=${x.id}>${x.name}</option>`)
tReq.innerHTML=db.req.map(r=>`<option value=${r.id}>${r.name}</option>`)
kReq.innerHTML=tReq.innerHTML
uReq.innerHTML=db.req.filter(r=>canExec(r.id)).map(r=>`<option value=${r.id}>${r.name}</option>`)
pUnit.innerHTML=db.unit.map(u=>`<option value=${u.id}>${u.req}</option>`)
callLead.innerHTML=db.lead.map(l=>`<option value=${l.id}>${l.name}</option>`)
}

render()
</script>

</body>
</html>
