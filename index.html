<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>HVIRAL LINE SYSTEM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:sans-serif;margin:0;background:#f4f7fb}
.wrap{max-width:900px;margin:auto;padding:20px}
.card{background:#fff;padding:20px;border-radius:16px;margin-bottom:20px;box-shadow:0 8px 20px rgba(0,0,0,0.05)}
h2{margin-bottom:10px}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ddd}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#4f6dff;color:#fff;font-weight:bold;margin-top:10px}
.tag{padding:6px 10px;border-radius:20px;background:#eef3ff;display:inline-block;margin:4px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
<h2>라인 ONE - A (시안)</h2>

<input id="rid" placeholder="Request ID">
<select id="step">
<option value="design">디자인</option>
<option value="marketing">마케팅</option>
<option value="dev">개발</option>
</select>

<input type="file" id="file">
<input id="usb" placeholder="USB NO (예: UNIT-01)">

<button onclick="upload()">업로드</button>
<button onclick="receive()">다음단계 수령확인</button>

</div>

<div class="card">
<h2>현재 흐름</h2>
<div id="list"></div>
</div>

</div>

<script>
let DB = JSON.parse(localStorage.getItem("HV_LINE_DB")||"[]");

function save(){
localStorage.setItem("HV_LINE_DB",JSON.stringify(DB));
}

function upload(){
let rid=document.getElementById("rid").value;
let step=document.getElementById("step").value;
let usb=document.getElementById("usb").value;

if(!rid) return alert("RID 필요");

DB.push({
rid:rid,
step:step,
usb:usb,
status:"진행중",
time:new Date().toLocaleString()
});

save();
render();
}

function receive(){
let rid=document.getElementById("rid").value;
let step=document.getElementById("step").value;

let prev = {design:null,marketing:"design",dev:"marketing"};

let prevStep = prev[step];

if(!prevStep){
alert("디자인은 수령 개념 없음");
return;
}

let prevItem = DB.find(x=>x.rid==rid && x.step==prevStep);

if(!prevItem){
alert("이전 단계 없음");
return;
}

// 🔥 핵심: 수령하면 이전단계 자동 제출완료
prevItem.status="제출완료";

DB.push({
rid:rid,
step:step,
status:"작업시작",
time:new Date().toLocaleString()
});

save();
render();
}

function render(){
let html="";
DB.forEach(x=>{
html+=`<div class="tag">${x.rid} | ${x.step} | ${x.status}</div>`;
});
document.getElementById("list").innerHTML=html;
}

render();
</script>

</body>
</html>
