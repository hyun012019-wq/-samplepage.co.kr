.contract-paper{background:white;border:1px solid #ddd;border-radius:18px;padding:24px;max-width:850px;margin:auto;line-height:1.8}
.signbox{border:1px dashed #aaa;border-radius:12px;background:#fafafa;width:100%;height:160px;touch-action:none}
.legalBox{border:1px solid #dce2ee;border-radius:18px;padding:14px;margin:10px 0;background:#f8faff;max-height:240px;overflow:auto}
.legalItem{display:flex;gap:8px;align-items:flex-start;margin:9px 0;font-size:13px;line-height:1.5}
.legalItem input{width:auto;margin-top:4px}
.service-pill{display:inline-block;margin:3px;padding:6px 9px;border-radius:999px;background:#eef2ff;font-size:12px}
@media(max-width:900px){.usb-grid{grid-template-columns:1fr 1fr}}
@media(max-width:768px){
header{height:64px}.brand{font-size:14px}.kpi{grid-template-columns:1fr}.card{border-radius:22px;padding:18px}
.usb-grid{grid-template-columns:1fr}
table,thead,tbody,tr,th,td{display:block;width:100%}thead{display:none}
tr{border:1px solid #e8ecf3;border-radius:14px;margin-bottom:12px;padding:10px}
td{display:flex;justify-content:space-between;white-space:normal;border:0}td:before{content:attr(data-label);font-weight:700;color:#687386}

const LEGALS=[
  {id:"privacy",required:true,title:"개인정보보호법 관련 개인정보 수집·이용 동의",body:"성명, 상호, 연락처, 요청내용, 결제 관련 확인정보를 견적상담, 계약 진행, 결제 확인, 고객지원, 분쟁 대응 목적으로 수집·이용합니다. 보유기간은 계약 및 관계 법령상 보관 필요기간 또는 동의 철회 시까지이며, 필수 동의 거부 시 견적·계약·결제 진행이 제한될 수 있습니다."},
  {id:"network",required:true,title:"정보통신망법 관련 전자적 고지·알림 수신 확인",body:"견적 링크, 계약 링크, 결제 확인, 일정 안내, 서비스 진행 알림 등 거래 이행에 필요한 전자적 고지를 카카오톡, 문자, 이메일, 웹 알림 등으로 받을 수 있음을 확인합니다."},
  {id:"ecommerce",required:true,title:"전자상거래·통신판매 관련 사전 안내 확인",body:"비대면 링크를 통한 견적·계약·결제 진행 시 상품 내용, 금액, 공급 범위, 결제수단, 환불·취소 기준, 청약철회 가능 여부와 제한 사유를 확인한 후 진행합니다. 맞춤형 디지털 제작·광고·콘텐츠 업무는 착수 이후 취소·환불 제한이 발생할 수 있습니다."},
  {id:"door",required:true,title:"방문판매·전화권유판매 관련 안내 확인",body:"영업 방문, 전화 상담, 카카오톡 안내 등으로 계약이 진행되는 경우 계약 전 주요 조건, 금액, 업무범위, 청약철회·취소·환불 기준을 확인합니다."},
  {id:"copyright",required:true,title:"저작권·초상권·상표권·자료제공 책임 확인",body:"고객이 제공하는 로고, 사진, 영상, 문구, 상표, 자료는 고객이 사용할 권한을 보유했음을 전제로 하며, 제3자 권리 침해 자료 제공으로 발생하는 문제는 고객 확인 책임이 포함됩니다. 하비럴 제작 산출물의 사용범위는 계약 범위에 따릅니다."},
  {id:"ad",required:true,title:"광고·콘텐츠 집행 유의사항 확인",body:"광고 매체 정책, 심사 기준, 업종 제한, 플랫폼 알고리즘, 검색 노출 변동, 외부 플랫폼 정책 변경에 따라 집행 결과와 노출량이 변동될 수 있음을 확인합니다."},
  {id:"visit",required:true,title:"현장 촬영·방문 업무 안내 확인",body:"현장 촬영, 인터뷰, 포트폴리오 제작, 방문 업무가 포함될 경우 일정 조율, 촬영 동의, 장소 사용권한, 제3자 초상권 확인이 필요합니다."},
  {id:"tax",required:true,title:"세금계산서·증빙 처리 안내 확인",body:"선택 서비스에 따른 세금계산서 발행 문구와 업종 코드 매칭은 내부 상품 마스터 기준으로 처리되며, 실제 발행 전 경영지원 확인을 거칩니다."},
  {id:"marketing",required:false,title:"마케팅 활용 동의 선택",body:"서비스 사례, 포트폴리오, 후기, 안내 콘텐츠, 유사 서비스 제안 등 마케팅 목적으로 연락처와 서비스 이용 정보를 활용하는 것에 동의합니다. 선택 동의 거부 시에도 견적·계약 진행은 가능합니다."}
];

let db=JSON.parse(localStorage.getItem(KEY)||"null")||{
  boundDB:[],callA:[],callB:[],callC:[],callD:[],callE:[],
  consent:[],token:[],lineA:[],lineB:[],po:[],transfer:[],
  sales:[],hq:[],contract:[],finance:[],audit:[],executive:[],
  inbound:[],planning:[],notifications:[],logs:[],adminActions:[],usb:[]
};

const now=()=>new Date().toLocaleString("ko-KR");
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const v=id=>document.getElementById(id)?.value?.trim()||"";
const seq=p=>`${p}-${new Date().getFullYear()}-${String(Date.now()).slice(-6)}${Math.floor(Math.random()*90+10)}`;
const same=(r,id)=>r.rid===id||r.inid===id||r.token===id||r.unit===id||r.job===id;
const serviceByName=name=>SERVICES.find(s=>s.name===name)||SERVICES[0];
const serviceOptions=()=>SERVICES.map(s=>`<option value="${s.name}">${s.name}</option>`).join("");
function selectedService(id="service"){return serviceByName(v(id))}
function serviceMeta(name){let s=serviceByName(name);return {service:s.name,serviceCode:s.code,taxText:s.tax,team:s.team}}

function log(type,msg,id=""){db.logs.unshift({time:now(),user:user?.name||"SYSTEM",role:user?.role||"SYSTEM",type,msg,id,page:view,device:navigator.userAgent});save()}
function notify(role,msg,id="",kind="INFO"){db.notifications.unshift({time:now(),role,msg,id,kind,read:"N"});try{new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg").play()}catch(e){}if(Notification.permission==="granted")new Notification("HVIRAL 알림",{body:msg});if(navigator.vibrate)navigator.vibrate([180,80,180]);log("NOTIFY",`${role} 알림: ${msg}`,id);save()}
function requestNotifyPermission(){Notification?.requestPermission?.()}
function req(roles){if(user?.role==="대표"||user?.role==="관리자")return true;if(!roles.includes(user?.role)){alert("권한 없음: "+roles.join(", "));return false}return true}
function cls(x){return["완료","Y","승인","동의","예약금결제","잔금결제","PO적재","전달완료","서명완료","계약완료","확인완료","PO 회수"].includes(x)?"ok":["대기","미연락","작성대기","검토중","본부장검토","서명대기","승인대기","작업요청","확인대기","작업시작","진행중","처리중"].includes(x)?"warn":["N","반려","차단","거절","이슈","보류","수정요청"].includes(x)?"bad":""}
function badge(x){return `<span class="badge ${cls(x)}">${x||""}</span>`}
function table(rows,cols){return `<input placeholder="검색" onkeyup="filterRows(this)" style="max-width:340px"><div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td data-label="${c}">${badge(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function filterRows(i){let q=i.value.toLowerCase();i.parentElement.querySelectorAll("tbody tr").forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?"":"none")}
function layout(html){root.innerHTML=html}

function routePublic(){
  let u=new URL(location.href), q=u.searchParams.get("quote"), c=u.searchParams.get("contract"), home=u.searchParams.get("client");
  if(home==="1"){clientHome();return true}
  if(q){customerQuote(q);return true}
  if(c){customerContract(c);return true}
  return false;
}
function toggleMenu(){nav.classList.toggle("open");overlay.classList.toggle("show")}
function go(x){view=x;toggleMenu();render()}
function render(){
  if(routePublic())return;
  topHeader.style.display="flex";
  if(!unlocked)return lock();
  if(!user)return login();
  drawMenu();
  userBox.innerHTML=`${user.name} · ${user.role} <button class="red" onclick="logout()">로그아웃</button>`;
  ({dash,serviceMaster,clientPreview,admin,boundDB,callA,callB,callC,callD,callE,consent,token,lineA,lineB,usbInterface,po,transfer,sales,hq,contract,finance,audit,executive,inbound,planning,notifications,logs}[view])();
}
function drawMenu(){
  const menus=[
    ["dash","대시보드"],["serviceMaster","서비스 상품 마스터"],["clientPreview","고객용 화면 미리보기"],["admin","관리자 페이지"],
    ["boundDB","BOUND 운영지원 DB"],["callA","BOUND 콜팀 A"],["callB","BOUND 콜팀 B"],["callC","BOUND 콜팀 C"],["callD","BOUND 콜팀 D"],["callE","BOUND 콜팀 E"],
    ["consent","동의자 승인요청"],["token","대표 토큰·승인"],
    ["lineA","라인 ONE - A"],["lineB","라인 TWO - B"],["usbInterface","인터페이스 USB 캐리어"],["po","프로젝트오피스 PO"],["transfer","BOUND 전환전달팀"],
    ["sales","HVIRAL 마케팅ㆍ영업팀"],["hq","HVIRAL 사업본부"],["contract","부대표 검토ㆍ승인"],
    ["finance","HVIRAL 경영지원팀"],["audit","감사 예외검토"],["executive","전무이사 실행ㆍ승인"],
    ["inbound","HVIRAL 접수처"],["planning","HVIRAL 기획조정팀"],["notifications","알림센터"],["logs","감사 로그"]
  ];
  nav.innerHTML=menus.map(m=>`<button onclick="go('${m[0]}')">${m[1]}</button>`).join("");
}
function lock(){root.innerHTML=`<div class="card narrow"><h2>접근 제한</h2><input id="pw" type="password" placeholder="비밀번호 입력" autocomplete="off" onkeydown="if(event.key==='Enter')check()"><button class="primary" onclick="check()">접속</button><p class="small">승인된 인원만 접근 가능합니다.</p></div>`}
function check(){if(v("pw")===PW){unlocked=true;sessionStorage.setItem(SESSION,"1");log("ACCESS","접속 성공");render()}else{log("ACCESS_FAIL","접속 실패");alert("비밀번호 틀림")}}
function login(){root.innerHTML=`<div class="card narrow"><h2>HVIRAL 임ㆍ직원 로그인</h2><input id="name" value="이재현"><select id="role"><option>대표</option><option>관리자</option><option>운영지원</option><option>콜팀</option><option>전환전달팀</option><option>영업</option><option>본부장</option><option>부대표</option><option>경영지원</option><option>감사</option><option>전무이사</option><option>라인</option><option>PO</option><option>기획조정</option></select><button class="primary" onclick="user={name:v('name'),role:v('role')};log('LOGIN','로그인');requestNotifyPermission();render()">입장</button></div>`}
function logout(){log("LOGOUT","로그아웃");user=null;unlocked=false;sessionStorage.removeItem(SESSION);render()}

function metrics(){
  let callN=["callA","callB","callC","callD","callE"].reduce((a,k)=>a+db[k].length,0);
  let agree=["callA","callB","callC","callD","callE"].reduce((a,k)=>a+db[k].filter(x=>x.result==="동의").length,0);
  return{callN,agree,agreeRate:callN?Math.round(agree/callN*100):0,sales:db.sales.length,contract:db.contract.length,noti:db.notifications.filter(x=>x.read==="N").length}
}

function legalHtml(){
  return `<div class="legalBox"><b>필수 법률·거래 안내 확인</b>${LEGALS.map(l=>`<label class="legalItem"><input type="checkbox" id="law_${l.id}" ${l.required?"data-required='1'":""}><span><b>${l.required?"[필수]":"[선택]"} ${l.title}</b><br>${l.body}</span></label>`).join("")}</div>`;
}
function requiredLegalOk(){
  let reqs=[...document.querySelectorAll("input[data-required='1']")];
  if(reqs.some(x=>!x.checked)){alert("필수 법률·거래 안내를 모두 확인해야 결제 단계로 진행할 수 있습니다.");return false}
  return true;
}
function legalSnapshot(){
  let out={};
  LEGALS.forEach(l=>out[l.id]=!!document.getElementById("law_"+l.id)?.checked);
  return out;
}

function issueToken(){if(!req(["대표"]))return;let id=v("rid"),isIn=id.startsWith("IN-"),tk=seq("TK"),unit=seq("UNIT"),status=v("decision"),line=v("line"),svc=serviceMeta(v("service"));db.token.unshift({rid:isIn?"":id,inid:isIn?id:"",token:tk,unit,customer:v("customer"),...svc,work:v("work"),status,line});if(status==="승인"){db[line].unshift({rid:isIn?"":id,inid:isIn?id:"",token:tk,unit,...svc,type:"라인작업",status:"작업요청",execView:"작업시작",managerView:"작업요청",usb:"",file:"",po:"N"});notify("라인","라인 작업요청: "+id,id)}log("TOKEN","대표 토큰 처리",id);save();render()}

function lineUI(key,title){layout(`<div class="card narrow"><h2>${title}</h2><select id="team"><option>HVIRAL 디자인팀</option><option>HVIRAL 개발팀</option><option>HVIRAL 마케팅 영업팀</option></select><input id="id" placeholder="Request ID 또는 IN-Request ID"><input id="usb" placeholder="USB NO 예: UNIT-01"><input id="file" placeholder="산출물 파일/링크"><select id="next"><option>작업시작</option><option>진행중</option><option>제출완료</option><option>반려</option><option>PO 회수</option></select><button class="primary" onclick="lineUpdate('${key}')">라인 상태 저장</button><button class="primary" onclick="lineToPO('${key}')">제출완료 → PO 적재</button></div><div class="card">${table(db[key],["rid","inid","token","unit","service","serviceCode","type","execView","managerView","usb","file","po"])}</div>`)}
function mapManager(exec){return{"작업시작":"작업요청","진행중":"처리중","제출완료":"제출완료","반려":"수정요청","PO 회수":"PO적재"}[exec]||exec}
function lineUpdate(key){if(!req(["라인"]))return;let id=v("id"),w=db[key].find(x=>same(x,id));if(!w)return alert("라인 작업 없음");w.execView=v("next");w.managerView=mapManager(v("next"));w.usb=v("usb")||w.usb;w.file=v("file")||w.file;w.status=w.managerView;addUsb(w,key);log("LINE","라인 상태 변경",id);save();render()}
function addUsb(w,line){let id=w.usb||w.unit||"UNIT-"+String(db.usb.length+1).padStart(2,"0");w.usb=id;let u=db.usb.find(x=>x.usb===id&&x.rid===(w.rid||w.inid));if(!u){db.usb.unshift({usb:id,rid:w.rid,inid:w.inid,line,service:w.service,execView:w.execView,managerView:w.managerView,file:w.file,status:w.managerView})}else{u.execView=w.execView;u.managerView=w.managerView;u.file=w.file;u.status=w.managerView}}
function poDuplicate(row){return db.po.some(x=>(x.rid===row.rid&&x.inid===row.inid&&x.type===row.type&&x.file===row.file))}
function lineToPO(key){if(!req(["라인"]))return;let id=v("id"),w=db[key].find(x=>same(x,id));if(!w)return alert("라인 작업 없음");if(w.po==="Y")return alert("이미 처리되었습니다.");w.execView="PO 회수";w.managerView="PO적재";w.status="PO적재";w.usb=v("usb")||w.usb;w.file=v("file")||w.file;let poRow={rid:w.rid,inid:w.inid,job:seq("JOB"),type:key==="lineA"?"라인 ONE - A":"라인 TWO - B",service:w.service,serviceCode:w.serviceCode,taxText:w.taxText,usb:w.usb,file:w.file,status:"PO적재"};if(poDuplicate(poRow))return alert("이미 처리되었습니다.");w.po="Y";db.po.unshift(poRow);db.transfer.unshift({rid:w.rid,inid:w.inid,job:poRow.job,file:w.file,status:"회수대기",customLink:"",callTeam:"",callSent:"N",salesAlert:"N"});addUsb(w,key);notify("PO","라인 산출물 PO 적재: "+id,id);notify("전환전달팀","PO 산출물 회수 필요: "+id,id);log("AUTO","라인 완료 및 PO/전환전달 생성",id);save();render()}

function transfer(){layout(`<div class="card narrow"><h2>BOUND 전환전달팀</h2><input id="rid" placeholder="Request ID"><input id="customLink" placeholder="고객맞춤 시안 링크"><select id="callTeam"><option>callA</option><option>callB</option><option>callC</option><option>callD</option><option>callE</option></select><button class="primary" onclick="transferToCall()">치환 완료 → 콜팀 전달 + 영업 알림</button></div><div class="card">${table(db.transfer,["rid","inid","job","file","status","customLink","callTeam","callSent","salesAlert"])}</div>`)}
function transferToCall(){if(!req(["전환전달팀"]))return;let t=db.transfer.find(x=>x.rid===v("rid"));if(!t)return alert("전환전달 건 없음");if(t.status==="전달완료")return alert("이미 처리되었습니다.");t.customLink=v("customLink");t.callTeam=v("callTeam");t.status="전달완료";t.callSent="Y";t.salesAlert="Y";let callRow=db[t.callTeam].find(x=>x.rid===t.rid);if(callRow){callRow.result="시안링크전달대기";callRow.memo="전환전달팀 링크: "+t.customLink}if(!db.sales.some(x=>x.rid===t.rid&&x.status==="시안링크공유"))db.sales.unshift({kind:"아웃바운드",rid:t.rid,inid:"",customer:"",kakao:"",sianLink:t.customLink,quoteLink:"",status:"시안링크공유",reserve:"",pay:"",hqSent:"N"});notify("콜팀","고객 발송용 시안 링크 도착: "+t.rid,t.rid);notify("영업","시안 링크 공유 완료, 고객 접촉 필요: "+t.rid,t.rid);log("TRANSFER","시안 링크 치환/콜팀전달/영업알림",t.rid);save();render()}
function sales(){layout(`<div class="card narrow"><h2>HVIRAL 마케팅ㆍ영업팀</h2><p class="small">견적요청, 고객 연락, 글 작성/콘텐츠 업무를 함께 수행합니다.</p><select id="kind"><option>아웃바운드</option><option>인바운드</option></select><input id="id" placeholder="Request ID 또는 IN-Request ID"><input id="customer" placeholder="고객 식별명"><input id="kakao" placeholder="고객 카톡ID"><select id="service">${serviceOptions()}</select><button class="primary" onclick="makeQuote()">고객용 견적/예약금 링크 생성</button><button class="primary" onclick="sendHQ()">HVIRAL 사업본부 자동전달</button></div><div class="card">${table(db.sales,["kind","rid","inid","customer","kakao","service","serviceCode","sianLink","quoteLink","status","reserve","pay","hqSent"])}</div>`)}

  topHeader.style.display="none";
  root.innerHTML=`<div class="client-hero"><div class="client-wrap"><div class="client-logo"><h1>HVIRAL</h1><p>견적요청 · 예약금 결제</p></div><div class="client-card"><h3>고객용 견적요청</h3><input id="qname" placeholder="고객명/상호"><input id="qphone" placeholder="연락처"><select id="qservice">${serviceOptions()}</select><textarea id="qcontent" placeholder="요청내용"></textarea><input id="qreserve" placeholder="예약금"><select id="qpay"><option>삼성페이</option><option>카드결제</option><option>계좌이체</option><option>현금</option></select>${legalHtml()}<button class="primary" onclick="submitQuotePay('${id}')">필수 안내 확인 후 예약금 결제 완료</button><p class="small">index 확인용 결제 시뮬레이션입니다.</p></div></div></div>`;

function submitQuotePay(id){
  if(!requiredLegalOk())return;
  let isIn=id.startsWith("IN-"),s=db.sales.find(x=>same(x,id)),svc=serviceMeta(v("qservice"));
  if(!s){s={kind:isIn?"인바운드":"아웃바운드",rid:isIn?"":id,inid:isIn?id:""};db.sales.unshift(s)}
  Object.assign(s,{customer:v("qname"),...svc,status:"예약금결제",reserve:v("qreserve"),pay:v("qpay"),hqSent:"Y",legal:JSON.stringify(legalSnapshot())});
  let pay={id:seq("PAY"),payType:"예약금",rid:isIn?"":id,inid:isIn?id:"",customer:v("qname"),...svc,amount:v("qreserve"),method:v("qpay"),status:"확인대기"};
  db.finance.unshift(pay);
  db.hq.unshift({kind:s.kind,rid:s.rid,inid:s.inid,customer:v("qname"),...svc,request:`연락처:${v("qphone")} / 요청:${v("qcontent")} / 예약금:${v("qreserve")} / 결제:${v("qpay")}`,internal:"치환 대기",scope:svc.service,amount:v("qreserve"),status:"본부장검토",vpSent:"N"});
  notify("경영지원","예약금 결제 확인 필요: "+(pay.rid||pay.inid),pay.id);notify("감사","예약금 결제 건 예외 여부 확인 가능: "+(pay.rid||pay.inid),pay.id);notify("본부장","고객 견적요청서 제출: "+id,id);log("PAY","고객 예약금 결제/사업본부 전달",id);save();alert("예약금 결제 완료");location.href=location.origin+location.pathname;
}
function sendHQ(){if(!req(["영업"]))return;let id=v("id"),s=db.sales.find(x=>same(x,id));if(!s)return alert("영업건 없음");if(!db.hq.some(x=>same(x,id)))db.hq.unshift({kind:s.kind,rid:s.rid,inid:s.inid,customer:s.customer,service:s.service,serviceCode:s.serviceCode,taxText:s.taxText,request:"영업 수동 전달",internal:"치환 대기",scope:s.service,amount:s.reserve,status:"본부장검토",vpSent:"N"});s.hqSent="Y";notify("본부장","영업 수동 HVIRAL 사업본부 전달: "+id,id);log("AUTO","영업→사업본부 전달",id);save();render()}

/* HQ CONTRACT FINANCE AUDIT EXEC */
function hq(){layout(`<div class="card narrow"><h2>HVIRAL 사업본부</h2><select id="kind"><option>아웃바운드</option><option>인바운드</option></select><input id="id" placeholder="Request ID 또는 IN-Request ID"><textarea id="internal" placeholder="회사용 견적요청서 치환내용"></textarea><input id="scope" placeholder="계약 범위"><input id="amount" placeholder="계약 예상금액"><button class="primary" onclick="hqToContract()">부대표 전달</button></div><div class="card">${table(db.hq,["kind","rid","inid","customer","service","serviceCode","taxText","request","internal","scope","amount","status","vpSent"])}</div>`)}
function hqToContract(){if(!req(["본부장"]))return;let id=v("id"),h=db.hq.find(x=>same(x,id));if(!h)return alert("사업본부 건 없음");h.internal=v("internal");h.scope=v("scope")||h.scope;h.amount=v("amount")||h.amount;h.status="부대표전달";h.vpSent="Y";if(!db.contract.some(x=>same(x,id)))db.contract.unshift({kind:h.kind,rid:h.rid,inid:h.inid,customer:h.customer,service:h.service,serviceCode:h.serviceCode,taxText:h.taxText,kakao:"",status:"계약대기",contractNo:seq("CT"),contractLink:"",scope:h.scope,amount:h.amount,balance:"",pay:"",signStatus:"서명대기"});notify("부대표","계약대기 건 도착: "+id,id);log("AUTO","사업본부→부대표 검토ㆍ승인",id);save();render()}
function contract(){layout(`<div class="card narrow"><h2>부대표 검토ㆍ승인</h2><input id="id" placeholder="Request ID 또는 IN-Request ID"><input id="amount" placeholder="최종 계약금액"><input id="balance" placeholder="잔금"><select id="pay"><option>삼성페이</option><option>카드결제</option><option>계좌이체</option><option>현금</option></select><button class="primary" onclick="issueContract()">계약서 링크 발행</button><button class="primary" onclick="balancePaid()">잔금 결제 완료</button><button class="primary" onclick="contractToExec()">전무이사 전달</button></div><div class="card">${table(db.contract,["rid","inid","customer","service","serviceCode","taxText","status","contractNo","contractLink","scope","amount","balance","pay","signStatus"])}</div>`)}
function issueContract(){if(!req(["부대표"]))return;let id=v("id"),c=db.contract.find(x=>same(x,id));if(!c)return alert("계약건 없음");c.contractLink=location.origin+location.pathname+"?contract="+encodeURIComponent(id);c.amount=v("amount")||c.amount;c.balance=v("balance")||c.balance;c.pay=v("pay");c.status="계약링크발행";notify("영업","고객 계약서 링크 전달 필요: "+id,id);log("LINK","부대표 계약서 링크 발행",id);save();alert(c.contractLink);render()}
function customerContract(id){topHeader.style.display="none";let c=db.contract.find(x=>same(x,id))||{};root.innerHTML=`<main><div class="contract-paper"><h1>계약서</h1><p><b>계약번호:</b> ${c.contractNo||""}</p><p><b>ID:</b> ${id}</p><p><b>고객:</b> ${c.customer||""}</p><p><b>서비스:</b> ${c.service||""}</p><p><b>정관/세무 코드:</b> ${c.serviceCode||""}</p><p><b>세금계산서 문구:</b> ${c.taxText||""}</p><p><b>범위:</b> ${c.scope||""}</p><p><b>금액:</b> ${c.amount||""}</p><input id="signer" placeholder="서명자"><canvas id="signCanvas" class="signbox"></canvas><button class="ghost no-print" onclick="clearSign()">서명 지우기</button><button class="primary no-print" onclick="finishSign('${id}')">전자서명 완료</button><button class="primary no-print" onclick="window.print()">PDF 저장/인쇄</button></div></main>`;initCanvas()}
function initCanvas(){let c=document.getElementById("signCanvas"),ctx=c.getContext("2d");c.width=c.offsetWidth;c.height=c.offsetHeight;ctx.lineWidth=3;ctx.lineCap="round";let d=false,p=e=>{let r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}};c.onmousedown=c.ontouchstart=e=>{d=true;let q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y);e.preventDefault()};c.onmousemove=c.ontouchmove=e=>{if(!d)return;let q=p(e);ctx.lineTo(q.x,q.y);ctx.stroke();e.preventDefault()};c.onmouseup=c.onmouseleave=c.ontouchend=()=>d=false;signPad=c}
function clearSign(){signPad.getContext("2d").clearRect(0,0,signPad.width,signPad.height)}
function finishSign(id){let c=db.contract.find(x=>same(x,id));c.signStatus="서명완료";c.status="서명완료";c.signer=v("signer");c.signedAt=now();c.signature=signPad.toDataURL("image/png");notify("부대표","고객 전자서명 완료: "+id,id);log("SIGN","고객 전자서명 완료",id);save();alert("서명 완료")}
function balancePaid(){if(!req(["부대표"]))return;let id=v("id"),c=db.contract.find(x=>same(x,id));if(!c)return alert("계약건 없음");c.balance=v("balance");c.pay=v("pay");c.status="잔금결제";let pay={id:seq("PAY"),payType:"잔금",rid:c.rid,inid:c.inid,customer:c.customer,service:c.service,serviceCode:c.serviceCode,taxText:c.taxText,amount:c.balance,method:c.pay,status:"확인대기"};db.finance.unshift(pay);notify("경영지원","잔금 결제 확인 필요: "+(pay.rid||pay.inid),pay.id);notify("감사","잔금 결제 건 예외 여부 확인 가능: "+(pay.rid||pay.inid),pay.id);log("PAY","잔금 결제 완료",id);save();render()}
function contractToExec(){if(!req(["부대표","경영지원","감사"]))return;let id=v("id"),c=db.contract.find(x=>same(x,id));if(!c)return alert("계약건 없음");if(!db.executive.some(x=>same(x,id)))db.executive.unshift({rid:c.rid,inid:c.inid,service:c.service,contract:"계약완료",finance:"확인필요",audit:"확인필요",status:"전무대기",judge:"대기"});notify("전무이사","실행 승인 대기: "+id,id);log("AUTO","계약→전무 전달",id);save();render()}
function finance(){layout(`<div class="card narrow"><h2>HVIRAL 경영지원팀</h2><input id="payId" placeholder="결제ID"><select id="status"><option>확인완료</option><option>이슈</option><option>확인대기</option></select><button class="primary" onclick="financeConfirm()">결제 확인 처리</button></div><div class="card">${table(db.finance,["id","payType","rid","inid","customer","service","serviceCode","taxText","amount","method","status"])}</div>`)}
function financeConfirm(){if(!req(["경영지원"]))return;let p=db.finance.find(x=>x.id===v("payId"));if(!p)return alert("결제ID 없음");p.status=v("status");if(p.status==="이슈"){db.audit.unshift({id:seq("AUD"),rid:p.rid,inid:p.inid,type:p.payType,reason:"경영지원 결제 이슈",risk:"중",status:"검토중"});notify("감사","경영지원 결제 이슈 검토 필요: "+(p.rid||p.inid),p.rid||p.inid)}log("FINANCE","결제 확인 처리",p.id);save();render()}
function audit(){layout(`<div class="card narrow"><h2>감사 예외검토</h2><input id="audId" placeholder="감사ID"><select id="status"><option>검토완료</option><option>이슈</option><option>반려</option></select><input id="memo" placeholder="검토 메모"><button class="primary" onclick="auditConfirm()">감사 처리</button></div><div class="card">${table(db.audit,["id","rid","inid","type","reason","risk","status","memo"])}</div>`)}
function auditConfirm(){if(!req(["감사"]))return;let a=db.audit.find(x=>x.id===v("audId"));if(!a)return alert("감사ID 없음");a.status=v("status");a.memo=v("memo");notify("대표","감사 처리 완료: "+a.id,a.id);log("AUDIT","감사 검토 처리",a.id);save();render()}
function executive(){layout(`<div class="card narrow"><h2>전무이사 실행ㆍ승인</h2><input id="id" placeholder="Request ID 또는 IN-Request ID"><select id="judge"><option>승인</option><option>보류</option><option>차단</option></select><select id="line"><option>lineA</option><option>lineB</option></select><button class="primary" onclick="execApprove()">실행 승인 → 라인 작업생성</button></div><div class="card">${table(db.executive,["rid","inid","service","contract","finance","audit","status","judge"])}</div>`)}
function execApprove(){if(!req(["전무이사"]))return;let id=v("id"),e=db.executive.find(x=>same(x,id));if(!e)return alert("전무대기 건 없음");e.judge=v("judge");e.status=v("judge")==="승인"?"실행승인":"보류";let line=v("line"),svc=serviceMeta(e.service||SERVICES[0].name);if(v("judge")==="승인"&&!db[line].some(x=>same(x,id)&&x.status==="작업요청")){db[line].unshift({rid:e.rid,inid:e.inid,token:"",unit:seq("UNIT"),...svc,type:"계약후작업",status:"작업요청",execView:"작업시작",managerView:"작업요청",usb:"",file:"",po:"N"});notify("라인","계약 후 라인 작업요청: "+id,id)}log("EXEC","전무 실행판정",id);save();render()}

/* INBOUND */
function inbound(){layout(`<div class="card narrow"><h2>HVIRAL 접수처</h2><input id="customer" placeholder="고객명/코드"><input id="channel" placeholder="유입경로"><select id="service">${serviceOptions()}</select><textarea id="summary" placeholder="요청요약"></textarea><select id="urgent"><option>보통</option><option>긴급</option><option>낮음</option></select><button class="primary" onclick="addInbound()">IN-Request ID 발급 → 기획조정 자동전달</button></div><div class="card">${table(db.inbound,["inid","customer","channel","product","serviceCode","taxText","summary","urgent","status"])}</div>`)}
function addInbound(){if(!req(["관리자","영업","기획조정"]))return;let inid=seq("IN"),svc=serviceMeta(v("service"));db.inbound.unshift({inid,customer:v("customer"),channel:v("channel"),product:svc.service,serviceCode:svc.serviceCode,taxText:svc.taxText,summary:v("summary"),urgent:v("urgent"),status:"접수완료"});db.planning.unshift({inid,customer:v("customer"),product:svc.service,serviceCode:svc.serviceCode,taxText:svc.taxText,summary:v("summary"),route:"",status:"대기"});notify("기획조정","인바운드 신규 접수: "+inid,inid);log("INBOUND","접수처 IN-Request ID 발급",inid);save();render()}
function planning(){layout(`<div class="card narrow"><h2>HVIRAL 기획조정팀</h2><input id="inid" placeholder="IN-Request ID"><select id="route"><option>영업</option><option>대표토큰</option><option>보류</option><option>제외</option></select><button class="primary" onclick="routeInbound()">분배 처리</button></div><div class="card">${table(db.planning,["inid","customer","product","serviceCode","taxText","summary","route","status"])}</div>`)}
function routeInbound(){if(!req(["기획조정"]))return;let p=db.planning.find(x=>x.inid===v("inid"));if(!p)return alert("기획조정 건 없음");p.route=v("route");p.status="분배완료";if(p.route==="영업"&&!db.sales.some(x=>x.inid===p.inid)){db.sales.unshift({kind:"인바운드",rid:"",inid:p.inid,customer:p.customer,kakao:"",service:p.product,serviceCode:p.serviceCode,taxText:p.taxText,sianLink:"",quoteLink:"",status:"영업대기",reserve:"",pay:"",hqSent:"N"});notify("영업","인바운드 영업 배정: "+p.inid,p.inid)}if(p.route==="대표토큰")notify("대표","인바운드 토큰 판단 필요: "+p.inid,p.inid);log("PLANNING","인바운드 분배",p.inid);save();render()}

function notifications(){layout(`<div class="card narrow"><h2>알림센터</h2><button class="primary" onclick="requestNotifyPermission()">브라우저 알림 권한 요청</button><input id="nid" placeholder="관련 ID"><button class="primary" onclick="markRead()">관련 ID 알림 읽음처리</button></div><div class="card">${table(db.notifications,["time","role","msg","id","kind","read"])}</div>`)}
function markRead(){let id=v("nid");db.notifications.forEach(n=>{if(n.id===id)n.read="Y"});log("NOTIFY","알림 읽음 처리",id);save();render()}
function logs(){layout(`<div class="card"><h2>감사 로그</h2>${table(db.logs,["time","user","role","type","msg","id","page"])}<button class="red" onclick="if(confirm('전체 초기화?')){localStorage.removeItem(KEY);location.reload()}">전체 초기화</button></div>`)}

render();
</script>
</body>
</html>
