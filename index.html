<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HVIRAL ERP·CRM FINAL INDEX</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,'Noto Sans KR',sans-serif;
  background:linear-gradient(135deg,#eef4ff,#fff7fb);
  color:#202633;
  min-height:100vh
}
header{
  height:70px;
  background:rgba(255,255,255,.93);
  backdrop-filter:blur(14px);
  border-bottom:1px solid #e5e8f0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  position:sticky;
  top:0;
  z-index:10
}
.brand{
  font-weight:900;
  font-size:17px;
  line-height:1.2
}
.menuBtn{
  border:0;
  background:#06142f;
  color:#fff;
  border-radius:18px;
  padding:13px 17px;
  font-size:23px
}
#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.38);
  display:none;
  z-index:20
}
#overlay.show{display:block}
nav{
  position:fixed;
  top:0;
  left:-326px;
  width:316px;
  height:100dvh;
  background:#111c36;
  padding:14px;
  z-index:30;
  transition:.25s;
  overflow-y:auto
}
nav.open{left:0}
nav button{
  width:100%;
  padding:13px;
  margin:5px 0;
  border:0;
  border-radius:14px;
  background:#263f68;
  color:#fff;
  text-align:left;
  font-weight:800
}
main{padding:18px}
.card{
  background:rgba(255,255,255,.96);
  border-radius:26px;
  padding:22px;
  margin:0 auto 18px;
  max-width:1180px;
  box-shadow:0 14px 32px rgba(20,30,60,.08)
}
input,select,textarea{
  width:100%;
  padding:15px;
  border:1px solid #dce2ee;
  border-radius:17px;
  margin-bottom:10px;
}
button.primary{
  width:100%;
  padding:16px;
  border:0;
  border-radius:18px;
  background:linear-gradient(135deg,#4f6dff,#7ed6ff);
  color:#fff;
  font-weight:900;
  font-size:16px;
  margin:7px 0
}
button.red{
  padding:10px 13px;
  border:0;
  border-radius:13px;
  background:#ef4444;
  color:#fff
}
</style>
</head>

<body>

<div id="overlay" onclick="toggleMenu()"></div>
<nav id="nav"></nav>

<header>
  <button class="menuBtn" onclick="toggleMenu()">☰</button>
  <div class="brand">HVIRAL ERP·CRM<br>FINAL INDEX</div>
  <div id="userBox"></div>
</header>

<main id="root"></main>

<script>
const PW="9898";

function toggleMenu(){
  document.getElementById("nav").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

function login(){
  root.innerHTML=`
  <div class="card">
    <h2>로그인</h2>
    <input id="name" placeholder="이름">
    <select id="role">
      <option>대표</option>
      <option>관리자</option>
      <option>영업</option>
      <option>콜팀</option>
    </select>
    <button class="primary" onclick="enter()">입장</button>
  </div>`;
}

function enter(){
  const name=document.getElementById("name").value;
  const role=document.getElementById("role").value;
  userBox.innerHTML=name+" · "+role;
  dashboard();
}

function dashboard(){
  root.innerHTML=`
  <div class="card">
    <h2>대시보드</h2>
    <p>HVIRAL ERP 시스템 정상 작동중</p>
  </div>`;
}

login();
</script>

</body>
</html>
