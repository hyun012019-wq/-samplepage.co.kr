<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>HVIRAL ERP·CRM SYSTEM</title>
<style>
:root{
  --bg:#f5f7ff;--card:#fff;--ink:#202633;--muted:#6b7280;
  --nav:#111c36;--nav2:#223456;--blue:#4f6dff;--red:#ef4444;
  --line:#e8ecf3;--ok:#dff7e8;--warn:#fff2c7;--bad:#ffe0e0;--gray:#edf1f7;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#edf2ff,#f8fafc);font-family:Arial,'Noto Sans KR',sans-serif;color:var(--ink);overflow-x:hidden}
.weather{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.drop,.snow{position:absolute;top:-20px;opacity:.45;animation:fall linear infinite}
.drop{width:2px;height:18px;background:#6aa8ff}
.snow{width:7px;height:7px;background:#fff;border-radius:50%;box-shadow:0 0 8px #fff}
@keyframes fall{to{transform:translateY(110vh)}}
header{height:64px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:20}
.app{display:grid;grid-template-columns:270px 1fr;height:calc(100vh - 64px);position:relative;z-index:2}
nav{background:linear-gradient(180deg,#101a33,#1e2a44);padding:12px;overflow:auto}
nav button{width:100%;padding:13px;margin:5px 0;border:0;border-radius:15px;background:#263a60;color:#fff;text-align:left;font-size:14px;cursor:pointer}
nav button.on{background:var(--blue)}
main{padding:18px;overflow:auto}
.card{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:28px;padding:18px;margin:0 auto 18px;max-width:1100px;box-shadow:0 14px 36px rgba(40,60,120,.09);animation:up .25s ease}
@keyframes up{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:none}}
.narrow{max-width:720px}
.small{font-size:12px;color:var(--muted);line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi .card{margin:0;max-width:none}
input,select,textarea{width:100%;padding:14px;border:1px solid #dde3ef;border-radius:17px;margin-bottom:10px;background:#fff;font-size:15px}
textarea{min-height:90px;resize:vertical}
button.primary{width:100%;padding:15px;border:0;border-radius:18px;background:var(--blue);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
button.red{padding:9px 12px;border:0;border-radius:13px;background:var(--red);color:#fff;cursor:pointer}
button.ghost{padding:9px 11px;border:1px solid #dbe2ef;border-radius:13px;background:#fff;color:#222;margin:2px;cursor:pointer}
.flow{display:flex;gap:8px;flex-wrap:wrap}.flow span{background:var(--gray);border-radius:999px;padding:8px 12px;font-size:13px}
.table-wrap{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:9px;text-align:left;vertical-align:top;white-space:nowrap}
th{background:#f0f3fa;position:sticky;top:0;z-index:1}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;background:var(--gray)}
.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}
.search{max-width:360px}
.linkbox{background:#f3f6ff;border-radius:16px;padding:10px;word-break:break-all}
.contract-paper{background:#fff;border:1px solid #ddd;border-radius:18px;padding:28px;max-width:850px;margin:auto;line-height:1.8}
.signbox{border:1px dashed #aaa;border-radius:12px;background:#fafafa;width:100%;height:180px;touch-action:none}
@media(max-width:768px){
  .app{display:block;height:auto}
  nav{position:fixed;top:0;left:-100%;width:280px;height:100%;z-index:50;transition:.25s}
  nav.open{left:0}
  main{padding:14px}.card{max-width:100%;border-radius:24px}.grid,.kpi{grid-template-columns:1fr}
  header b{font-size:15px}header div:last-child{font-size:12px}
  table,thead,tbody,tr,th,td{display:block;width:100%}thead{display:none}
  tbody tr{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:14px;box-shadow:0 6px 18px rgba(0,0,0,.05)}
  td{border:0;display:flex;justify-content:space-between;gap:12px;padding:8px 0;white-space:normal;font-size:14px}
  td::before{content:attr(data-label);font-weight:800;color:var(--muted);min-width:120px}
}
@media print{header,nav,.no-print{display:none!important}.app{display:block;height:auto}main{padding:0}.card{box-shadow:none}.contract-paper{border:0}}
</style>
</head>
<body>
<div class="weather" id="weather"></div>
<div id="root"></div>

<script>
const KEY="HVIRAL_FULL_KPI_REMIND_CONTRACT_V1";
const PW="2580";
const now=()=>new Date().toLocaleString("ko-KR");
const dayms=86400000;
const seq=p=>`${p}-${new Date().getFullYear()}-${String(Date.now()).slice(-6)}`;
let unlocked=false,user=null,view="dash",signPad=null,stampData="";

const blank={outDB:[],call:[],consent:[],token:[],execution:[],po:[],inbound:[],planning:[],sales:[],hq:[],contract:[],executive:[],logs:[]};
let db=JSON.parse(localStorage.getItem(KEY)||"null")||blank;
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const v=id=>document.getElementById(id)?.value?.trim()||"";
const same=(r,id)=>r["Request ID"]===id||r["IN-Request ID"]===id||r.id==id;
const exists=(a,p)=>db[a].some(p);
const by=(a,id)=>db[a].find(r=>same(r,id));
const updateBy=(a,id,p)=>db[a].forEach(r=>{if(same(r,id))Object.assign(r,p)});
const log=(구분,내용,참조="")=>{db.logs.unshift({일시:now(),사용자:user?.name||"",권한:user?.role||"",구분,내용,참조});save()};
function requireRole(roles){if(!user||!roles.includes(user.role)){alert("권한 없음: "+roles.join(", "));return false}return true}
function daysOld(t){let d=new Date(t);return isNaN(d)?0:Math.floor((Date.now()-d.getTime())/dayms)}
function cls(x){return["Y","승인","완료","사용중","가능","PO적재","계약완료","검증완료","동의","분배완료","작업요청","콜완료","서명완료","발행완료","제출완료"].includes(x)?"ok":["대기","보류","검토중","진행중","미연락","감사대기","계약대기","서명대기","고객작성대기"].includes(x)?"warn":["N","반려","차단","이슈","거절","불가","제외"].includes(x)?"bad":""}
const badge=x=>`<span class="badge ${cls(x)}">${x??""}</span>`;
function table(rows,cols){return`<input class="search no-print" placeholder="검색" onkeyup="filterRows(this)"><div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td data-label="${c}">${badge(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function filterRows(i){let q=i.value.toLowerCase();i.parentElement.querySelectorAll("tbody tr").forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?"":"none")}
function copyText(txt){navigator.clipboard?.writeText(txt);alert("복사 완료:\\n"+txt)}
function openKakaoPrepared(txt){copyText(txt);location.href="kakaotalk://launch"}
function toggleMenu(){document.querySelector("nav")?.classList.toggle("open")}
function routePublic(){let u=new URL(location.href),q=u.searchParams.get("quote"),c=u.searchParams.get("contract");if(q){customerQuote(q);return true}if(c){customerContract(c);return true}return false}
function lockScreen(){root.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px"><div class="card narrow"><h2>접근 제한</h2><input id="pw" type="password" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')checkPw()"><button class="primary" onclick="checkPw()">접속</button></div></div>`}
function checkPw(){if(v("pw")===PW){unlocked=true;renderApp()}else alert("비밀번호 틀림")}
function login(){root.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px"><div class="card narrow"><h1>HVIRAL ERP 로그인</h1><input id="loginName" value="이재현"><select id="loginRole"><option>대표</option><option>전무이사</option><option>부대표</option><option>본부장</option><option>운영지원</option><option>콜팀</option><option>영업</option><option>실행팀</option><option>PO</option><option>경영지원</option><option>감사</option></select><button class="primary" onclick="user={name:v('loginName'),role:v('loginRole')};log('LOGIN','로그인');render()">입장</button></div></div>`}
function layout(content){const m=[["dash","대시보드"],["kpi","KPI·병목"],["remind","리마인드"],["outDB","BOUND DB"],["call","콜팀"],["consent","동의자"],["token","대표 토큰"],["sales","마케팅·영업"],["hq","사업본부 본부장"],["contract","부대표 계약"],["executive","전무 실행"],["execution","실행팀"],["po","PO"],["inbound","인바운드"],["planning","기획조정"],["logs","로그"]];root.innerHTML=`<header><div style="display:flex;align-items:center;gap:10px"><button class="red no-print" onclick="toggleMenu()">☰</button><b>HVIRAL ERP·CRM</b></div><div class="no-print">${user.name} · ${user.role} <button class="red" onclick="user=null;render()">로그아웃</button></div></header><div class="app"><nav class="no-print">${m.map(x=>`<button class="${view===x[0]?'on':''}" onclick="view='${x[0]}';toggleMenu();render()">${x[1]}</button>`).join("")}</nav><main>${content}</main></div>`}

function metrics(){
 let calls=db.call.length, agree=db.call.filter(x=>x["동의여부"]==="Y").length;
 let tokens=db.token.filter(x=>x["승인상태"]==="승인").length;
 let contracts=db.contract.filter(x=>["계약완료","계약링크발행","계약대기"].includes(x["계약상태"])).length;
 let signed=db.contract.filter(x=>x["전자서명 상태"]==="서명완료"||x["계약상태"]==="계약완료").length;
 let units=new Set(db.token.map(x=>x["유닛ID"]).filter(Boolean)).size;
 let sales=db.contract.reduce((s,x)=>s+(parseInt((x["최종 계약금액"]||"0").replace(/[^0-9]/g,""))||0),0);
 return {calls,agree,tokens,contracts,signed,units,sales,agreeRate:calls?Math.round(agree/calls*100):0,contractRate:agree?Math.round(contracts/agree*100):0,signRate:contracts?Math.round(signed/contracts*100):0,unitSales:units?Math.round(sales/units):0}
}
function bottlenecks(){
 let m=metrics(), a=[];
 if(m.calls>=5&&m.agreeRate<25)a.push("콜은 많은데 동의율이 낮음 → 콜 스크립트/타깃 품질 점검");
 if(m.agree>=3&&m.tokens/m.agree<0.5)a.push("동의 후 토큰 승인 전환이 낮음 → 대표 승인 기준/상신 품질 점검");
 if(m.contracts>=3&&db.execution.filter(x=>x["파이프라인단계"]==="작업요청").length>db.po.length+2)a.push("계약/작업요청 대비 PO 적재가 느림 → 실행팀 병목 가능");
 if(db.hq.filter(x=>x["부대표 전달 여부"]==="N").length>=3)a.push("본부장 단계 미전달 누적 → 치환/검토 병목");
 if(!a.length)a.push("현재 큰 병목 없음");
 return a;
}
function reminders(){
 let list=[];
 db.sales.forEach(x=>{if(x["진행 상태"]==="고객작성대기")list.push({id:x["Request ID"]||x["IN-Request ID"],msg:"견적요청 링크 발행 후 고객 작성 대기",days:daysOld(x["결제 일시"]||x["생성일시"]||new Date())})});
 db.hq.forEach(x=>{if(x["부대표 전달 여부"]==="N")list.push({id:x["Request ID"]||x["IN-Request ID"],msg:"본부장 치환/부대표 전달 대기",days:0})});
 db.contract.forEach(x=>{if(x["전자서명 상태"]==="서명대기")list.push({id:x["Request ID"]||x["IN-Request ID"],msg:"계약서 링크 발행 후 전자서명 대기",days:0})});
 db.execution.forEach(x=>{if(x["파이프라인단계"]==="작업요청")list.push({id:x["Request ID"]||x["IN-Request ID"],msg:"실행팀 작업요청 대기",days:0})});
 return list;
}

function dash(){let m=metrics();layout(`<div class="card"><h2>하비럴 운영 대시보드</h2><div class="flow"><span>영업 링크</span><span>고객 견적요청</span><span>본부장 치환</span><span>부대표 계약링크</span><span>전자서명</span><span>전무 실행</span><span>PO</span></div><p class="small">카톡ID는 영업에서 최초 입력, 본부장은 볼 필요 없고, 부대표 계약 단계에서 Request ID와 자동 매칭됩니다.</p></div><div class="kpi"><div class="card"><b>동의율</b><h2>${m.agreeRate}%</h2></div><div class="card"><b>계약률</b><h2>${m.contractRate}%</h2></div><div class="card"><b>서명률</b><h2>${m.signRate}%</h2></div><div class="card"><b>유닛당 매출</b><h2>${m.unitSales.toLocaleString()}</h2></div></div><div class="card"><h2>날씨 효과</h2><select id="weatherSel" onchange="setWeather(this.value)"><option value="">맑음</option><option value="rain">비</option><option value="snow">눈</option></select><button class="ghost" onclick="autoWeather()">현재 위치 날씨 자동 적용</button></div>`)}
function kpi(){let m=metrics();layout(`<div class="kpi"><div class="card"><b>콜→동의율</b><h2>${m.agreeRate}%</h2><p>${m.agree}/${m.calls}</p></div><div class="card"><b>계약률</b><h2>${m.contractRate}%</h2><p>${m.contracts}/${m.agree}</p></div><div class="card"><b>총 계약금액</b><h2>${m.sales.toLocaleString()}</h2></div><div class="card"><b>유닛당 매출</b><h2>${m.unitSales.toLocaleString()}</h2></div></div><div class="card"><h2>병목 감지</h2>${bottlenecks().map(x=>`<p>${badge("검토중")} ${x}</p>`).join("")}</div>`)}
function remind(){let r=reminders();layout(`<div class="card"><h2>리마인드 자동 감지</h2>${r.length?r.map(x=>`<div class="card"><b>${x.id}</b><p>${x.msg}</p>${x.days>=1?badge(x.days+"일 경과"):badge("대기")}</div>`).join(""):"<p>방치 건 없음</p>"}</div>`)}

const C={
outDB:["Request ID","수집일","업체명","연락처","업종","지역","콜상태","콜담당자","차단여부","메모"],
call:["Request ID","업체명","연락처","콜담당자","연락결과","동의여부","거부사유","최초통화일시","콜메모"],
consent:["Request ID","요청일자","요청번호","고객/업체명","요청내용","요청자","동의확인","승인요청상태"],
token:["Request ID","IN-Request ID","토큰ID","유닛ID","고객/업체명","요청내용","승인상태","토큰상태","프로젝트오피스 전달여부","완료보고수령"],
sales:["유입구분","Request ID","IN-Request ID","고객 식별명","고객카톡ID","견적요청 링크","견적요청 상태","착수금 결제 여부","착수금액","결제수단","본부장 전달 여부","진행 상태"],
hq:["유입구분","Request ID","IN-Request ID","고객 식별명","고객용 견적요청서 수령","고객 요청 원본","회사 견적요청서 치환","계약 범위 확정","예상 금액","부대표 전달 여부"],
contract:["유입구분","Request ID","IN-Request ID","고객 식별명","고객카톡ID","계약상태","계약서 번호","계약서 링크","최종 계약금액","착수금액","결제수단","전자서명 상태","서명자","서명일시"],
executive:["유입구분","Request ID","IN-Request ID","토큰ID","유닛ID","계약상태","착수금 확인","전무이사 전달여부","작업지시 발급여부","실행시작 가능여부","전무이사 실행판정"],
execution:["Request ID","IN-Request ID","토큰ID","유닛ID","파이프라인구분","작업구분","파이프라인단계","작업부서","작업자","산출물 파일명","PO전달여부"],
po:["Request ID","IN-Request ID","토큰ID","유닛ID","작업코드","작업유형","산출물 파일명","저장경로","출고상태","토큰연계 여부"],
inbound:["IN-Request ID","유입경로","고객코드","업종","상품코드","요청요약","기획조정 상태","분배유형","접수일시"],
planning:["IN-Request ID","고객코드","업종","상품코드","요청요약","분배유형","담당팀","담당자","상태"],
logs:["일시","사용자","권한","구분","내용","참조"]
};

function outDB(){layout(`<div class="card narrow"><h2>BOUND 운영지원 DB</h2><input id="biz" placeholder="업체명"><input id="phone" placeholder="연락처"><input id="industry" placeholder="업종"><input id="area" placeholder="지역"><input id="memo" placeholder="메모"><button class="primary" onclick="addOut()">타깃 등록</button></div><div class="card">${table(db.outDB,C.outDB)}</div>`)}
function addOut(){if(!requireRole(["대표","운영지원"]))return;db.outDB.unshift({"Request ID":seq("OUT"),"수집일":now(),"업체명":v("biz"),"연락처":v("phone"),"업종":v("industry"),"지역":v("area"),"콜상태":"미연락","콜담당자":"","차단여부":"N","메모":v("memo")});log("CREATE","아웃바운드 타깃 등록");save();render()}
function call(){layout(`<div class="card narrow"><h2>콜팀</h2><input id="rid" placeholder="Request ID"><input id="caller" placeholder="콜담당자"><select id="result"><option>동의</option><option>거절</option><option>부재</option><option>재접촉</option><option>차단</option></select><input id="reject" placeholder="거부사유"><input id="memo" placeholder="콜메모"><button class="primary" onclick="addCall()">콜결과 저장</button></div><div class="card">${table(db.call,C.call)}</div>`)}

function addToken(){if(!requireRole(["대표"]))return;let raw=v("trid"),isIn=raw.startsWith("IN-"),tk=seq("TK"),unit=seq("U");if(exists("token",x=>same(x,raw)&&x["승인상태"]==="승인"))return alert("이미 승인 토큰 존재");db.token.unshift({"Request ID":isIn?"":raw,"IN-Request ID":isIn?raw:"","토큰ID":tk,"유닛ID":unit,"고객/업체명":v("customer"),"요청내용":v("work"),"승인상태":v("approve"),"토큰상태":v("approve")==="승인"?"사용중":"대기","프로젝트오피스 전달여부":"N","완료보고수령":"N"});if(v("approve")==="승인"){db.execution.unshift({"Request ID":isIn?"":raw,"IN-Request ID":isIn?raw:"","토큰ID":tk,"유닛ID":unit,"파이프라인구분":"1차-시안","작업구분":"시안","파이프라인단계":"작업요청","작업부서":"디자인팀","작업자":"","산출물 파일명":"","PO전달여부":"N"})}log("AUTO","토큰 승인 및 실행행 자동생성",raw);save();render()}

function sales(){layout(`<div class="card narrow"><h2>마케팅·영업</h2><select id="kind"><option>아웃바운드</option><option>인바운드</option></select><input id="sid" placeholder="Request ID 또는 IN-Request ID"><input id="customer" placeholder="고객 식별명"><input id="kakao" placeholder="고객 카톡ID"><input id="deposit" placeholder="착수금액"><select id="pay"><option>삼성페이</option><option>카드</option><option>계좌이체</option><option>현금</option></select><button class="primary" onclick="makeQuoteLink()">견적요청서 링크 발행 + 카톡복사</button><button class="primary" onclick="salesToHQ()">본부장 자동전달</button></div><div class="card">${table(db.sales,C.sales)}</div>`)}

function submitQuote(id){let isIn=id.startsWith("IN-");db.hq.unshift({"유입구분":isIn?"인바운드":"아웃바운드","Request ID":isIn?"":id,"IN-Request ID":isIn?id:"","고객 식별명":v("qname"),"고객용 견적요청서 수령":"Y","고객 요청 원본":`연락처:${v("qphone")} / 요청:${v("qcontent")}`,"회사 견적요청서 치환":"치환 대기","계약 범위 확정":"","예상 금액":"","부대표 전달 여부":"N"});updateBy("sales",id,{"견적요청 상태":"제출완료","본부장 전달 여부":"Y","진행 상태":"본부장전달"});log("CUSTOMER","고객 견적요청서 제출",id);save();alert("제출 완료");location.href=location.origin+location.pathname}

function hq(){layout(`<div class="card narrow"><h2>사업본부 본부장</h2><select id="kind"><option>아웃바운드</option><option>인바운드</option></select><input id="hid" placeholder="Request ID 또는 IN-Request ID"><textarea id="raw" placeholder="고객 요청 원본"></textarea><textarea id="fixed" placeholder="회사 견적요청서 치환"></textarea><input id="scope" placeholder="계약 범위 확정"><input id="amount" placeholder="예상 금액"><button class="primary" onclick="hqToContract()">부대표 자동전달</button></div><div class="card">${table(db.hq,C.hq)}</div>`)}
function hqToContract(){if(!requireRole(["대표","본부장"]))return;let id=v("hid"),kind=v("kind"),isIn=kind==="인바운드";if(exists("contract",x=>same(x,id)))return alert("이미 계약대기 존재");let sale=db.sales.find(x=>same(x,id))||{};db.contract.unshift({"유입구분":kind,"Request ID":isIn?"":id,"IN-Request ID":isIn?id:"","고객 식별명":sale["고객 식별명"]||"","고객카톡ID":sale["고객카톡ID"]||"","계약상태":"계약대기","계약서 번호":seq("CT"),"계약서 링크":"","최종 계약금액":v("amount"),"착수금액":sale["착수금액"]||"","결제수단":sale["결제수단"]||"","전자서명 상태":"서명대기","서명자":"","서명일시":""});updateBy("hq",id,{"부대표 전달 여부":"Y","회사 견적요청서 치환":v("fixed"),"계약 범위 확정":v("scope"),"예상 금액":v("amount")});log("AUTO","부대표 계약대기 생성",id);save();render()}

function contract(){layout(`<div class="card narrow"><h2>부대표 계약</h2><select id="kind"><option>아웃바운드</option><option>인바운드</option></select><input id="cid" placeholder="Request ID 또는 IN-Request ID"><input id="money" placeholder="최종 계약금액"><input id="deposit" placeholder="착수금액"><select id="pay"><option>삼성페이</option><option>카드</option><option>계좌이체</option><option>현금</option></select><button class="primary" onclick="issueContractLink()">계약서 링크 발행 + 카톡복사</button><button class="primary" onclick="contractToExecutive()">계약/입금/감사 완료 → 전무전달</button></div><div class="card">${table(db.contract,C.contract)}</div>`)}
function issueContractLink(){if(!requireRole(["대표","부대표"]))return;let id=v("cid"),c=db.contract.find(x=>same(x,id));if(!c)return alert("계약대기 건 없음");let link=location.origin+location.pathname+"?contract="+encodeURIComponent(id);Object.assign(c,{"계약서 링크":link,"계약상태":"계약링크발행","전자서명 상태":"서명대기","최종 계약금액":v("money")||c["최종 계약금액"],"착수금액":v("deposit")||c["착수금액"],"결제수단":v("pay")||c["결제수단"]});let msg=`[하비럴 계약서]\\n고객 카톡ID: ${c["고객카톡ID"]||""}\\nRequest ID: ${id}\\n계약서 링크: ${link}`;log("LINK","부대표 계약서 링크 발행",id);save();openKakaoPrepared(msg);render()}
function contractToExecutive(){if(!requireRole(["대표","부대표","경영지원","감사"]))return;let id=v("cid"),kind=v("kind"),isIn=kind==="인바운드",c=db.contract.find(x=>same(x,id))||{};if(exists("executive",x=>same(x,id)))return alert("이미 전무 전달됨");Object.assign(c,{"계약상태":"계약완료","최종 계약금액":v("money")||c["최종 계약금액"],"착수금액":v("deposit")||c["착수금액"],"결제수단":v("pay")||c["결제수단"]});db.executive.unshift({"유입구분":kind,"Request ID":isIn?"":id,"IN-Request ID":isIn?id:"","토큰ID":"","유닛ID":"","계약상태":"계약완료","착수금 확인":c["착수금액"]?"Y":"N","전무이사 전달여부":"Y","작업지시 발급여부":"N","실행시작 가능여부":"가능","전무이사 실행판정":"대기"});log("AUTO","전무이사 전달",id);save();render()}
function customerContract(id){let c=db.contract.find(x=>same(x,id))||{};root.innerHTML=`<main style="padding:20px"><div class="contract-paper"><h1>계약서</h1><p><b>계약번호:</b> ${c["계약서 번호"]||""}</p><p><b>Request ID:</b> ${id}</p><p><b>계약금액:</b> ${c["최종 계약금액"]||"-"}</p><p><b>착수금:</b> ${c["착수금액"]||"-"} / ${c["결제수단"]||""}</p><hr><p>본 계약은 고객 요청에 따른 디지털 마케팅/웹/콘텐츠/운영 업무 수행을 목적으로 합니다.</p><input id="signer" placeholder="서명자 이름"><canvas id="signCanvas" class="signbox"></canvas><button class="ghost no-print" onclick="clearSign()">서명 지우기</button><button class="primary no-print" onclick="finishSign('${id}')">전자서명 완료</button><button class="primary no-print" onclick="window.print()">PDF 저장/인쇄</button></div></main>`;initCanvas()}
function initCanvas(){let c=document.getElementById("signCanvas"),ctx=c.getContext("2d");c.width=c.offsetWidth;c.height=c.offsetHeight;ctx.lineWidth=3;ctx.lineCap="round";let d=false;let p=e=>{let r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}};c.onmousedown=c.ontouchstart=e=>{d=true;let q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y);e.preventDefault()};c.onmousemove=c.ontouchmove=e=>{if(!d)return;let q=p(e);ctx.lineTo(q.x,q.y);ctx.stroke();e.preventDefault()};c.onmouseup=c.onmouseleave=c.ontouchend=()=>d=false;signPad=c}
function clearSign(){signPad.getContext("2d").clearRect(0,0,signPad.width,signPad.height)}
function finishSign(id){let c=db.contract.find(x=>same(x,id));if(!c)return alert("계약정보 없음");Object.assign(c,{"계약상태":"계약완료","전자서명 상태":"서명완료","서명자":v("signer"),"서명일시":now(),"signatureData":signPad.toDataURL("image/png")});log("SIGN","고객 전자서명 완료",id);save();alert("서명 완료. PDF 저장/인쇄 버튼으로 저장하세요.")}

function execution(){layout(`<div class="card narrow"><h2>실행팀</h2><input id="erid" placeholder="Request ID"><input id="ein" placeholder="IN-Request ID"><input id="etk" placeholder="토큰ID"><input id="eunit" placeholder="유닛ID"><select id="etype"><option>시안</option><option>진행</option><option>유지관리</option></select><input id="file" placeholder="산출물 파일명"><input id="path" placeholder="저장경로"><button class="primary" onclick="completeExecution()">완료 → PO 자동적재</button></div><div class="card">${table(db.execution,C.execution)}</div>`)}

function routeInbound(){let id=v("pin");updateBy("inbound",id,{"기획조정 상태":"분배완료","분배유형":v("route")});db.planning.unshift({"IN-Request ID":id,"분배유형":v("route"),"담당팀":v("route"),"담당자":v("owner"),"상태":"분배완료"});save();render()}

function logs(){layout(`<div class="card"><h2>감사 로그</h2>${table(db.logs,C.logs)}<button class="red" onclick="if(confirm('초기화?')){localStorage.removeItem(KEY);location.reload()}">전체 초기화</button></div>`)}
function setWeather(type){let w=document.getElementById("weather");w.innerHTML="";if(!type)return;let n=type==="rain"?90:55;for(let i=0;i<n;i++){let s=document.createElement("i");s.className=type==="rain"?"drop":"snow";s.style.left=Math.random()*100+"vw";s.style.animationDuration=(type==="rain"?0.7+Math.random():4+Math.random()*4)+"s";s.style.animationDelay=Math.random()*4+"s";w.appendChild(s)}}
function autoWeather(){navigator.geolocation?.getCurrentPosition(async p=>{try{let lat=p.coords.latitude,lon=p.coords.longitude;let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=weather_code`);let j=await r.json(),c=j.current.weather_code;if([61,63,65,80,81,82].includes(c))setWeather("rain");else if([71,73,75,77,85,86].includes(c))setWeather("snow");else setWeather("")}catch(e){alert("날씨 자동 적용 실패")}})}
function renderApp(){if(routePublic())return;if(!user)return login();({dash,kpi,remind,outDB,call,consent,token,sales,hq,contract,executive,execution,po,inbound,planning,logs}[view])()}
function render(){if(routePublic())return;if(!unlocked){lockScreen();return}renderApp()}
render();
</script>
